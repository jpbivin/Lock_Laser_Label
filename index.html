<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141923">
<title>Markbench — lockout lock marking</title>
<style>
/* ============================================================
   MARKBENCH — design tokens
   Chrome: graphite instrument housing. Work surface: bright stock.
   Signal orange = things that act on the world. Cyan = the cursor's world.
   ============================================================ */
:root{
  --bg:#0C0F14;
  --chrome:#141923;
  --chrome-2:#1B2130;
  --chrome-3:#232B3B;
  --line:#2B3446;
  --line-2:#3A465C;
  --text:#DFE5EE;
  --text-2:#8593A8;
  --text-3:#5C6980;
  --accent:#F26419;
  --accent-dim:#7A3410;
  --cyan:#2BC5D9;
  --paper:#F7F6F2;
  --paper-2:#E9E7E0;
  --rule:#C3C0B6;
  --danger:#E5484D;
  --ok:#43C08A;
  --amber:#E8B23A;

  --cond:"Roboto Condensed","Arial Narrow","Helvetica Neue Condensed",system-ui,sans-serif;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;

  --r:4px;
  --topbar:52px;
  --statusbar:26px;
  --navbar:58px;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{
  background:var(--bg);color:var(--text);
  font-family:var(--ui);font-size:14px;line-height:1.4;
  -webkit-text-size-adjust:100%;
  overscroll-behavior:none;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}
::-webkit-scrollbar-thumb:hover{background:var(--line-2)}

/* ============================================================
   SHELL
   ============================================================ */
#app{
  position:fixed;inset:0;
  display:grid;
  grid-template-rows:var(--topbar) 1fr var(--statusbar);
  grid-template-columns:1fr;
}
@media(min-width:1080px){
  #app{grid-template-columns:252px 1fr 312px;
       grid-template-areas:"top top top" "left stage right" "status status status"}
  #topbar{grid-area:top}#leftrail{grid-area:left}#stagewrap{grid-area:stage}
  #rightrail{grid-area:right}#statusbar{grid-area:status}
}

/* ---- topbar ---- */
#topbar{
  display:flex;align-items:center;gap:10px;
  padding:0 12px;background:var(--chrome);
  border-bottom:1px solid var(--line);
  min-width:0;
}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.brand .mk{
  font-family:var(--cond);font-weight:700;font-size:17px;
  letter-spacing:.15em;text-transform:uppercase;white-space:nowrap;
}
.brand .mk em{color:var(--accent);font-style:normal}
.brand .doc{
  font-size:12px;color:var(--text-3);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;max-width:24vw;
}
@media(max-width:520px){.brand .doc{display:none}}
.grow{flex:1;min-width:0}

/* ---- face tabs ---- */
.facetabs{display:flex;gap:3px;min-width:0;flex-shrink:1;background:var(--chrome-2);padding:3px;border-radius:var(--r);
  border:1px solid var(--line);overflow:auto;max-width:100%;scrollbar-width:none}
.facetabs::-webkit-scrollbar{display:none}
.facetab{
  border:0;background:transparent;color:var(--text-2);
  font-family:var(--cond);font-size:12px;letter-spacing:.09em;text-transform:uppercase;
  padding:5px 11px;border-radius:2px;cursor:pointer;white-space:nowrap;
}
.facetab[aria-selected="true"]{background:var(--chrome-3);color:var(--text);box-shadow:inset 0 -2px 0 var(--accent)}
.facetab.add{color:var(--text-3);padding:5px 9px}

/* ---- rails ---- */
.rail{
  background:var(--chrome);overflow-y:auto;overflow-x:hidden;
  display:flex;flex-direction:column;
}
#leftrail{border-right:1px solid var(--line)}
#rightrail{border-left:1px solid var(--line)}
@media(max-width:1079px){
  .rail{
    position:absolute;left:0;right:0;bottom:calc(var(--navbar) + env(safe-area-inset-bottom));
    max-height:min(66dvh,560px);z-index:30;
    border-top:1px solid var(--line);
    border-radius:12px 12px 0 0;
    box-shadow:0 -18px 44px rgba(0,0,0,.55);
    transform:translateY(102%);
    transition:transform .22s cubic-bezier(.3,.9,.3,1);
    display:flex;
  }
  .rail.open{transform:translateY(0)}
  .sheetgrip{
    position:sticky;top:0;z-index:2;background:var(--chrome);
    padding:8px 0 4px;display:flex;justify-content:center;flex:0 0 auto;
  }
  .sheetgrip i{display:block;width:40px;height:4px;border-radius:4px;background:var(--line-2)}
}
@media(min-width:1080px){ .sheetgrip{display:none} }

/* ---- section blocks in rails ---- */
.sec{border-bottom:1px solid var(--line)}
.sec>h3{
  margin:0;padding:9px 12px 7px;
  font-family:var(--cond);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--text-3);font-weight:600;
  display:flex;align-items:center;gap:8px;
}
.sec>h3 .tag{
  margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--text-3);
  border:1px solid var(--line);border-radius:2px;padding:0 5px;
}
.sec .body{padding:0 12px 12px}

/* ---- form controls ---- */
.row{display:grid;gap:7px;margin-bottom:7px}
.c2{grid-template-columns:1fr 1fr}
.c3{grid-template-columns:1fr 1fr 1fr}
.c4{grid-template-columns:1fr 1fr 1fr 1fr}
label.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
label.fld>span{
  font-family:var(--cond);font-size:10px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
input[type=text],input[type=number],select,textarea{
  width:100%;min-width:0;padding:6px 8px;
  background:var(--chrome-2);border:1px solid var(--line);border-radius:var(--r);
  color:var(--text);
}
input[type=number]{font-family:var(--mono);font-size:13px}
textarea{resize:vertical;font-size:13px;line-height:1.35}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--text-3) 50%),linear-gradient(135deg,var(--text-3) 50%,transparent 50%);
  background-position:calc(100% - 14px) 12px,calc(100% - 9px) 12px;background-size:5px 5px;background-repeat:no-repeat;padding-right:26px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,[tabindex]:focus-visible{
  outline:2px solid var(--cyan);outline-offset:1px}
input[type=range]{width:100%;accent-color:var(--accent);background:transparent}
input[type=color]{width:100%;height:30px;padding:2px;background:var(--chrome-2);border:1px solid var(--line);border-radius:var(--r)}

.chk{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--text-2);cursor:pointer;
  padding:5px 0;user-select:none}
.chk input{width:15px;height:15px;accent-color:var(--accent);margin:0}

/* segmented control */
.seg{display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--chrome-2)}
.seg button{
  flex:1;border:0;background:transparent;color:var(--text-3);
  padding:6px 4px;cursor:pointer;font-size:12px;
  font-family:var(--cond);letter-spacing:.07em;text-transform:uppercase;
  border-right:1px solid var(--line);white-space:nowrap;
}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--chrome-3);color:var(--text)}
.seg.hot button[aria-pressed="true"]{background:var(--accent);color:#160800;font-weight:700}

/* buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border:1px solid var(--line);background:var(--chrome-2);color:var(--text);
  padding:7px 11px;border-radius:var(--r);cursor:pointer;white-space:nowrap;
  font-size:13px;
}
.btn:hover{background:var(--chrome-3);border-color:var(--line-2)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#170700;font-weight:600}
.btn.pri:hover{background:#FF7628}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 8px;font-size:12px}
.btn.wide{width:100%}
.btn.dngr{color:var(--danger);border-color:#4A2226}
.btn.dngr:hover{background:#2A171A}
.btnrow{display:flex;gap:6px;flex-wrap:wrap}
.btnrow.split>*{flex:1}

/* 9-point anchor picker */
.anchor9{
  display:grid;grid-template-columns:repeat(3,1fr);gap:2px;
  width:74px;padding:3px;background:var(--chrome-2);border:1px solid var(--line);border-radius:var(--r);
}
.anchor9 button{
  aspect-ratio:1;border:0;border-radius:2px;background:var(--chrome-3);cursor:pointer;
  position:relative;padding:0;
}
.anchor9 button::after{content:"";position:absolute;inset:38%;border-radius:50%;background:var(--text-3)}
.anchor9 button[aria-pressed="true"]{background:var(--accent)}
.anchor9 button[aria-pressed="true"]::after{background:#170700}

/* ---- element palette ---- */
.palette{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.palette .btn{flex-direction:column;gap:4px;padding:10px 6px;font-size:11px;
  font-family:var(--cond);letter-spacing:.08em;text-transform:uppercase;color:var(--text-2)}
.palette .btn svg{width:20px;height:20px;stroke:var(--accent);fill:none;stroke-width:1.6}

/* ---- layers list ---- */
.layers{display:flex;flex-direction:column;gap:3px}
.layer{
  display:flex;align-items:center;gap:7px;padding:6px 7px;
  background:var(--chrome-2);border:1px solid transparent;border-radius:var(--r);
  cursor:pointer;user-select:none;
}
.layer:hover{border-color:var(--line)}
.layer[aria-selected="true"]{border-color:var(--cyan);background:var(--chrome-3)}
.layer .ic{width:15px;height:15px;flex:0 0 auto;stroke:var(--text-3);fill:none;stroke-width:1.7}
.layer[aria-selected="true"] .ic{stroke:var(--cyan)}
.layer .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.layer .mini{
  border:0;background:transparent;color:var(--text-3);cursor:pointer;padding:2px 3px;
  font-family:var(--mono);font-size:11px;line-height:1;border-radius:2px;
}
.layer .mini:hover{color:var(--text);background:var(--chrome-3)}
.layer .mini[data-off="1"]{color:var(--text-3);opacity:.4}

/* ---- stage ---- */
#stagewrap{
  position:relative;overflow:hidden;background:
    radial-gradient(ellipse at 50% 0%,#151B26 0%,var(--bg) 68%);
  min-height:0;display:flex;flex-direction:column;
}
#stagetools{
  position:absolute;top:8px;left:8px;right:8px;z-index:6;
  display:flex;gap:6px;align-items:center;pointer-events:none;flex-wrap:wrap;
}
#stagetools>*{pointer-events:auto}
.tbtn{
  border:1px solid var(--line);background:rgba(20,25,35,.86);backdrop-filter:blur(6px);
  color:var(--text-2);border-radius:var(--r);cursor:pointer;padding:5px 8px;
  font-family:var(--cond);font-size:11px;letter-spacing:.09em;text-transform:uppercase;
}
.tbtn[aria-pressed="true"]{color:var(--accent);border-color:var(--accent-dim)}
.tbtn:hover{color:var(--text)}
#stage{flex:1;min-height:0;touch-action:none;user-select:none;display:block;width:100%}

/* ---- status ---- */
#statusbar{
  display:flex;align-items:center;gap:12px;padding:0 12px;
  background:var(--chrome);border-top:1px solid var(--line);
  font-family:var(--mono);font-size:11px;color:var(--text-3);
  overflow:hidden;white-space:nowrap;
}
#statusbar .warn{color:var(--amber)}
#statusbar .bad{color:var(--danger)}
#statusbar .good{color:var(--ok)}
@media(max-width:1079px){#statusbar{padding-bottom:0}}

/* ---- bottom nav (mobile) ---- */
#nav{
  display:none;
  position:absolute;left:0;right:0;bottom:0;z-index:40;
  height:calc(var(--navbar) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  background:var(--chrome);border-top:1px solid var(--line);
}
@media(max-width:1079px){
  #nav{display:grid;grid-template-columns:repeat(5,1fr)}
  #app{padding-bottom:calc(var(--navbar) + env(safe-area-inset-bottom))}
  .brand .mk{font-size:15px;letter-spacing:.12em}
  .tbtn{padding:5px 7px;font-size:10px}
}
#nav button{
  border:0;background:transparent;color:var(--text-3);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-family:var(--cond);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  padding:0;
}
#nav button svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7}
#nav button[aria-pressed="true"]{color:var(--accent)}

/* ---- cloud chip ---- */
.chip{
  display:inline-flex;align-items:center;gap:6px;cursor:pointer;
  border:1px solid var(--line);background:var(--chrome-2);color:var(--text-3);
  font-family:var(--cond);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  padding:5px 9px;border-radius:99px;white-space:nowrap;
}
.chip:hover{border-color:var(--line-2);color:var(--text-2)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--text-3);flex:0 0 auto}
.chip.on{color:var(--ok);border-color:#215240}
.chip.on i{background:var(--ok);box-shadow:0 0 6px rgba(67,192,138,.7)}
.chip.bad{color:var(--danger);border-color:#4A2226}
.chip.bad i{background:var(--danger)}
.chip.wait i{background:var(--amber)}
@media(max-width:640px){ .chip{padding:5px 7px;font-size:10px} .chip span{display:none} }

.seg.scrollx{overflow-x:auto;scrollbar-width:none}
.seg.scrollx::-webkit-scrollbar{display:none}
.seg.scrollx button{flex:0 0 auto;padding:6px 11px}

/* ---- misc ---- */
.hint{font-size:12px;color:var(--text-3);line-height:1.45;margin:8px 0 0}
.divider{height:1px;background:var(--line);margin:10px 0}
.pill{
  display:inline-block;font-family:var(--mono);font-size:10px;
  padding:1px 6px;border-radius:99px;border:1px solid var(--line);color:var(--text-3);
}
.pill.on{color:var(--ok);border-color:#215240}
.empty{
  text-align:center;color:var(--text-3);font-size:12px;padding:18px 8px;
  border:1px dashed var(--line);border-radius:var(--r);
}
.thumb{
  width:100%;height:78px;object-fit:contain;background:
    repeating-conic-gradient(#2A3140 0% 25%,#222836 0% 50%) 50%/12px 12px;
  border:1px solid var(--line);border-radius:var(--r);
}
.tokrow{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.tok{
  border:1px solid var(--line);background:var(--chrome-2);color:var(--cyan);
  font-family:var(--mono);font-size:11px;padding:2px 6px;border-radius:99px;cursor:pointer;
}
.tok:hover{border-color:var(--cyan)}

/* roster table */
.roster{display:flex;flex-direction:column;gap:4px;max-height:240px;overflow:auto;padding-right:2px}
.rrow{display:grid;grid-template-columns:20px 1fr 1fr 1fr 24px;gap:4px;align-items:center}
.rrow .n{font-family:var(--mono);font-size:10px;color:var(--text-3);text-align:right}
.rrow input{padding:4px 6px;font-size:12px}
.rrow button{border:0;background:transparent;color:var(--text-3);cursor:pointer;font-size:13px;padding:2px}
.rrow button:hover{color:var(--danger)}
@media(max-width:1079px) and (min-width:521px){.rrow{grid-template-columns:20px 1fr 1fr 1fr 24px}}
@media(max-width:520px){
  .rrow{grid-template-columns:20px 1fr 1fr 24px;grid-template-areas:"n f l x" "n d d x"}
  .rrow .n{grid-area:n}.rrow .f{grid-area:f}.rrow .l{grid-area:l}
  .rrow .d{grid-area:d}.rrow .x{grid-area:x}
}

/* laser dose ladder */
.ladder{display:flex;gap:2px;margin:8px 0 4px}
.ladder div{flex:1;height:20px;border-radius:1px;position:relative}
.ladder div.cur{box-shadow:0 0 0 2px var(--accent)}
.laddercap{display:flex;justify-content:space-between;font-family:var(--cond);
  font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3)}
.readout{
  display:grid;grid-template-columns:1fr auto;gap:3px 10px;margin-top:9px;padding:9px 10px;
  background:var(--chrome-2);border:1px solid var(--line);border-radius:var(--r);
  font-family:var(--mono);font-size:12px;
}
.readout b{font-weight:400;color:var(--text-3)}
.readout span{text-align:right}
.callout{border-left:2px solid var(--amber);background:#241E10;padding:8px 10px;
  font-size:12px;color:#E9DCC0;margin-top:9px;border-radius:0 var(--r) var(--r) 0}
.callout.bad{border-color:var(--danger);background:#2A1417;color:#F0CFD1}

/* toast */
#toast{
  position:absolute;left:50%;bottom:calc(var(--navbar) + env(safe-area-inset-bottom) + 16px);transform:translateX(-50%) translateY(20px);
  background:var(--chrome-3);border:1px solid var(--line-2);color:var(--text);
  padding:9px 15px;border-radius:99px;font-size:13px;z-index:60;
  opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;max-width:88vw;text-align:center;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(min-width:1080px){#toast{bottom:44px}}

/* modal */
#scrim{position:absolute;inset:0;background:rgba(6,8,12,.62);z-index:25;opacity:0;pointer-events:none;
  transition:opacity .2s}
#scrim.show{opacity:1;pointer-events:auto}
@media(min-width:1080px){#scrim{display:none}}

@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}

@media(max-width:520px){
  #stSheet{display:none}
  .palette{grid-template-columns:1fr 1fr}
}

</style>
</head>
<body>
<div id="app">

  <header id="topbar">
    <div class="brand">
      <div class="mk">Mark<em>bench</em></div>
      <div class="doc" id="docName">Lockout lock · untitled</div>
    </div>
    <div class="grow"></div>
    <div class="facetabs" id="faceTabs" role="tablist"></div>
    <button class="chip" id="cloudChip" title="Cloud status"><i></i>Local</button>
    <button class="btn sm pri" id="btnExport">Export</button>
  </header>

  <aside class="rail" id="leftrail" data-panel="build">
    <div class="sheetgrip"><i></i></div>

    <section class="sec">
      <h3>Add element</h3>
      <div class="body">
        <div class="palette" id="palette"></div>
      </div>
    </section>

    <section class="sec">
      <h3>Elements <span class="tag" id="elCount">0</span></h3>
      <div class="body">
        <div class="layers" id="layers"></div>
        <div class="btnrow split" style="margin-top:8px">
          <button class="btn sm" id="btnDup">Duplicate</button>
          <button class="btn sm dngr" id="btnDel">Delete</button>
        </div>
      </div>
    </section>

    <section class="sec">
      <h3>Arrange</h3>
      <div class="body">
        <div class="btnrow split">
          <button class="btn sm" data-align="left">Left</button>
          <button class="btn sm" data-align="hcenter">Center</button>
          <button class="btn sm" data-align="right">Right</button>
        </div>
        <div class="btnrow split" style="margin-top:6px">
          <button class="btn sm" data-align="top">Top</button>
          <button class="btn sm" data-align="vcenter">Middle</button>
          <button class="btn sm" data-align="bottom">Bottom</button>
        </div>
        <div class="btnrow split" style="margin-top:6px">
          <button class="btn sm" data-align="stack">Stack evenly</button>
          <button class="btn sm" data-align="fitwidth">Fit width</button>
        </div>
      </div>
    </section>
  </aside>

  <div id="stagewrap">
    <div id="stagetools">
      <button class="tbtn" id="tGrid">Grid</button>
      <button class="tbtn" id="tSnap">Snap</button>
      <button class="tbtn" id="tLock">Body</button>
      <button class="tbtn" id="tRule">Rule</button>
      <div class="grow"></div>
      <button class="tbtn" id="tFit">Fit</button>
    </div>
    <svg id="stage"></svg>
  </div>

  <aside class="rail" id="rightrail" data-panel="props">
    <div class="sheetgrip"><i></i></div>
    <div id="railBody"></div>
  </aside>

  <div id="statusbar">
    <span id="stCoord">—</span>
    <span id="stFit" class="good">Inside limits</span>
    <span class="grow" style="flex:1"></span>
    <span id="stSheet">—</span>
  </div>

  <div id="scrim"></div>
  <div id="toast"></div>

  <nav id="nav">
    <button data-nav="build" aria-pressed="false">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Build</button>
    <button data-nav="props" aria-pressed="false">
      <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg>Properties</button>
    <button data-nav="stage" aria-pressed="true">

<script>
/* ============================================================================
   MARKBENCH — core
   Canonical internal unit is the INCH. Everything converts at the boundary:
   the UI converts on display, the exporters convert to millimetres.
   ========================================================================== */
"use strict";

const MM   = 25.4;
const CAPR = 0.716;              // cap height / em for the sans faces we ship with
const FONTS = ["Arial","Arial Black","Arial Narrow","Verdana","Tahoma",
               "Trebuchet MS","Segoe UI","Georgia","Times New Roman",
               "Courier New","Consolas","Impact"];

const uid = (p) => p + Math.random().toString(36).slice(2,9);
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
                          .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const r3 = n => (Math.round(n*1e4)/1e4);

/* ---------------------------------------------------------------- units --- */
const U = {
  get u(){ return doc.units; },
  toDisp(inches){ return doc.units==="in" ? inches : inches*MM; },
  fromDisp(v){ return doc.units==="in" ? v : v/MM; },
  step(){ return doc.units==="in" ? 0.005 : 0.1; },
  fmt(inches,d){ const v=U.toDisp(inches); return v.toFixed(d!==undefined?d:(doc.units==="in"?3:2)); },
  label(){ return doc.units==="in" ? "in" : "mm"; }
};

/* -------------------------------------------------------------- defaults --- */
function textEl(o){
  return Object.assign({
    id:uid("e_"), type:"text", name:"Text", anchor:"tc", ox:0, oy:0,
    w:1.0, h:0.16, rot:0, visible:true, locked:false,
    text:"Text", font:"Arial", bold:true, italic:false, caps:false,
    cap:0.12, track:0, lead:1.45, align:"center", valign:"middle",
    fit:"shrink", invert:false
  },o);
}
function imageEl(o){
  return Object.assign({
    id:uid("e_"), type:"image", name:"Graphic", anchor:"tc", ox:0, oy:0,
    w:0.6, h:0.3, rot:0, visible:true, locked:false,
    raw:null, data:null, srcW:0, srcH:0, bytes:0, isSvg:false,
    dpi:600, mode:"threshold", thresh:128, invert:false, keepAR:true, fit:"contain"
  },o);
}
function iconEl(o){
  return Object.assign({
    id:uid("e_"), type:"icon", name:"Symbol", anchor:"tc", ox:0, oy:0,
    w:0.4, h:0.36, rot:0, visible:true, locked:false,
    icon:"danger", invert:false
  },o);
}
function shapeEl(o){
  return Object.assign({
    id:uid("e_"), type:"shape", name:"Shape", anchor:"tc", ox:0, oy:0,
    w:1.0, h:0.02, rot:0, visible:true, locked:false,
    shape:"rect", filled:true, stroke:0.008, corner:0
  },o);
}

function defaultDoc(){
  const d = {
    v:2, units:"in", name:"Lockout lock",
    lock:{ w:1.55, h:2.05, corner:0.20 },
    label:{ w:1.25, h:1.70, corner:0.06, dx:0, dy:0 },
    pad:0.08,
    faces:[], roster:[{first:"Dana",last:"Whitfield",dept:"Maintenance"},
                      {first:"",last:"",dept:""}],
    sheet:{ cols:4, gapX:0.20, gapY:0.20, field:110/MM, order:"pairs" },
    laser:{ material:"anodized", trim:0, manual:false,
            speed:0, power:0, freq:0, interval:0, passes:1, fill:"scan" }
  };
  d.faces = [ seedOwnershipFace(d), seedDangerFace(d) ];
  return d;
}

function seedOwnershipFace(d){
  const W = d.label.w - 2*d.pad;
  return { id:uid("f_"), name:"Side 1", els:[
    textEl({name:"Property of", text:"PROPERTY OF", cap:0.085, w:W, h:0.10,
            anchor:"tc", ox:0, oy:0.02, track:80}),
    shapeEl({name:"Rule", shape:"rect", filled:true, w:W, h:0.012,
             anchor:"tc", ox:0, oy:0.155}),
    textEl({name:"First name", text:"{first}", cap:0.19, w:W, h:0.24,
            anchor:"tc", ox:0, oy:0.215}),
    textEl({name:"Last name", text:"{last}", cap:0.19, w:W, h:0.24,
            anchor:"tc", ox:0, oy:0.48}),
    textEl({name:"Department", text:"{dept}", cap:0.095, w:W, h:0.13,
            anchor:"bc", ox:0, oy:-0.30, caps:true, track:40}),
    imageEl({name:"Company logo", w:0.85, h:0.30, anchor:"bc", ox:0, oy:-0.02})
  ]};
}
function seedDangerFace(d){
  const W = d.label.w - 2*d.pad;
  return { id:uid("f_"), name:"Side 2", els:[
    iconEl({name:"Danger symbol", icon:"danger", w:0.46, h:0.40,
            anchor:"tc", ox:0, oy:0.01}),
    shapeEl({name:"Headline bar", shape:"rect", filled:true, w:W, h:0.17,
             anchor:"tc", ox:0, oy:0.46}),
    textEl({name:"Headline", text:"DANGER", cap:0.115, w:W, h:0.17,
            anchor:"tc", ox:0, oy:0.46, invert:true, track:60}),
    textEl({name:"Line 1", text:"DO NOT OPERATE", cap:0.085, w:W, h:0.11,
            anchor:"tc", ox:0, oy:0.68}),
    textEl({name:"Line 2", text:"EQUIPMENT LOCKED OUT", cap:0.062, w:W, h:0.09,
            anchor:"tc", ox:0, oy:0.82}),
    textEl({name:"Line 3", text:"REMOVED BY OWNER ONLY", cap:0.062, w:W, h:0.09,
            anchor:"tc", ox:0, oy:0.94}),
    textEl({name:"Standard", text:"OSHA 1910.147", cap:0.050, w:W, h:0.07,
            anchor:"bc", ox:0, oy:-0.01, track:70})
  ]};
}

let doc = defaultDoc();

/* ------------------------------------------------------------- geometry --- */
function safeRect(){
  return { x:doc.pad, y:doc.pad,
           w:Math.max(0.02, doc.label.w-2*doc.pad),
           h:Math.max(0.02, doc.label.h-2*doc.pad) };
}
const AX = {l:0, c:.5, r:1};
const AY = {t:0, m:.5, b:1};
function anchorF(a){ return { fy:AY[a[0]], fx:AX[a[1]] }; }

function boxOf(el){
  const s = safeRect(), {fx,fy} = anchorF(el.anchor);
  return { x: s.x + fx*s.w + el.ox - fx*el.w,
           y: s.y + fy*s.h + el.oy - fy*el.h,
           w: el.w, h: el.h };
}
function setBox(el, b, noClamp){
  const s = safeRect();
  let w = clamp(b.w, 0.02, s.w), h = clamp(b.h, 0.005, s.h);
  let x = b.x, y = b.y;
  if(!noClamp){
    x = clamp(x, s.x, s.x + s.w - w);
    y = clamp(y, s.y, s.y + s.h - h);
  }
  const {fx,fy} = anchorF(el.anchor);
  el.w = w; el.h = h;
  el.ox = x + fx*w - (s.x + fx*s.w);
  el.oy = y + fy*h - (s.y + fy*s.h);
}
function reanchor(el, a){
  const b = boxOf(el); el.anchor = a; setBox(el, b);
}
/* keeps every element legal after the label or padding changes */
function reflowAll(){
  doc.faces.forEach(f => f.els.forEach(el => setBox(el, boxOf(el))));
}

/* ----------------------------------------------------------- text engine --- */
const _mc = document.createElement("canvas").getContext("2d");
function fontStr(el, px){
  return (el.italic?"italic ":"") + (el.bold?"700 ":"400 ") + px + "px " +
         "'" + el.font + "', Arial, sans-serif";
}
function textW(str, el, fs){
  if(!str) return 0;
  _mc.font = fontStr(el, 1000);
  const base = _mc.measureText(str).width/1000*fs;
  const extra = (str.length-1) * fs * (el.track||0)/1000;
  return base + Math.max(0, extra);
}
function fillTokens(str, ctx){
  return String(str).replace(/\{(\w+)\}/g, (m,k)=>{
    const v = ctx[k.toLowerCase()];
    return v===undefined ? m : String(v);
  });
}
function wrapLine(str, el, fs, maxW){
  const words = str.split(/\s+/).filter(Boolean);
  if(!words.length) return [""];
  const out=[]; let cur=words[0];
  for(let i=1;i<words.length;i++){
    const t = cur+" "+words[i];
    if(textW(t,el,fs) <= maxW) cur = t; else { out.push(cur); cur = words[i]; }
  }
  out.push(cur);
  return out;
}
function layoutText(el, box, ctx){
  let raw = fillTokens(el.text ?? "", ctx || {});
  if(el.caps) raw = raw.toUpperCase();
  const paras = raw.split("\n");
  const wrap = el.fit==="wrap" || el.fit==="wrapshrink";
  const shrink = el.fit==="shrink" || el.fit==="wrapshrink";
  let cap = el.cap;
  let lines = paras;

  for(let pass=0; pass<4; pass++){
    const fs = cap/CAPR;
    lines = wrap ? paras.flatMap(p => wrapLine(p, el, fs, box.w)) : paras;
    const maxW = Math.max(0.0001, ...lines.map(l=>textW(l,el,fs)));
    const step = cap*el.lead;
    const totH = (lines.length-1)*step + cap;
    if(!shrink) break;
    const k = Math.min(1, box.w/maxW, box.h/totH);
    if(k > 0.999) break;
    cap = cap*k*0.999;
    if(!wrap) break;
  }
  const fs = cap/CAPR, step = cap*el.lead;
  const totH = (lines.length-1)*step + cap;
  const widths = lines.map(l=>textW(l,el,fs));
  let top = box.y;
  if(el.valign==="middle") top = box.y + (box.h-totH)/2;
  else if(el.valign==="bottom") top = box.y + box.h - totH;
  return { lines, widths, cap, fs, step, totH, top,
           maxW: Math.max(0, ...widths) };
}

/* ------------------------------------------------------------------ icons --- */
function ringCircle(cx,cy,r,n){
  const out=[]; n=n||44;
  for(let i=0;i<n;i++){ const a=i/n*Math.PI*2; out.push([cx+Math.cos(a)*r, cy+Math.sin(a)*r]); }
  return out;
}
const ICONS = {
  /* every icon returns closed rings inside the unit square, y down */
  danger(){
    const A=[.5,.03], B=[.97,.94], C=[.03,.94];
    const d=(p,q)=>Math.hypot(p[0]-q[0],p[1]-q[1]);
    const a=d(B,C), b=d(A,C), c=d(A,B), per=a+b+c;
    const ix=(a*A[0]+b*B[0]+c*C[0])/per, iy=(a*A[1]+b*B[1]+c*C[1])/per;
    const area=Math.abs((B[0]-A[0])*(C[1]-A[1])-(C[0]-A[0])*(B[1]-A[1]))/2, r=area/(per/2);
    const k=(r-0.105)/r;
    const inner=[A,B,C].map(p=>[ix+(p[0]-ix)*k, iy+(p[1]-iy)*k]);
    const iTop=inner[0][1], iBot=inner[1][1], hIn=iBot-iTop;
    const bt=iTop+hIn*0.30, bb=iTop+hIn*0.68, wt=0.062, wb=wt*0.58;
    const bar=[[ix-wt,bt],[ix+wt,bt],[ix+wb,bb],[ix-wb,bb]];
    const dT=iTop+hIn*0.78, dB=iTop+hIn*0.92, dr=Math.min(wt,(dB-dT)/2);
    const dcy=(dT+dB)/2;
    return [[A,B,C], inner, bar, ringCircle(ix,dcy,dr,20)];
  },
  bolt(){
    return [[[.56,.02],[.20,.55],[.44,.55],[.34,.98],[.80,.40],[.53,.40],[.72,.02]]];
  },
  padlock(){
    const body=[[.10,.44],[.90,.44],[.90,.98],[.10,.98]];
    const so=ringCircle(.5,.44,.30,36).filter(p=>p[1]<=.45);
    const si=ringCircle(.5,.44,.18,36).filter(p=>p[1]<=.45).reverse();
    const shackle=[[.20,.45],...so.slice().sort((p,q)=>p[0]-q[0]).reverse(),[.80,.45],[.68,.45],
                   ...si.slice().sort((p,q)=>p[0]-q[0]),[.32,.45]];
    const kh=ringCircle(.5,.62,.085,20);
    const stem=[[.455,.62],[.545,.62],[.575,.86],[.425,.86]];
    return [body, kh, stem, shackle];
  },
  exclaim(){
    const outer=ringCircle(.5,.5,.48,48);
    const inner=ringCircle(.5,.5,.375,48).reverse();
    const bt=.22, bb=.60, wt=.062, wb=.040;
    const bar=[[.5-wt,bt],[.5+wt,bt],[.5+wb,bb],[.5-wb,bb]];
    return [outer, inner, bar, ringCircle(.5,.72,.058,20)];
  },
  arcflash(){
    const rays=[];
    for(let i=0;i<12;i++){
      const a=i/12*Math.PI*2, a2=a+0.13;
      rays.push([[.5+Math.cos(a)*.14,.5+Math.sin(a)*.14],
                 [.5+Math.cos(a)*.49,.5+Math.sin(a)*.49],
                 [.5+Math.cos(a2)*.49,.5+Math.sin(a2)*.49],
                 [.5+Math.cos(a2)*.14,.5+Math.sin(a2)*.14]]);
    }
    return [ringCircle(.5,.5,.13,28), ...rays];
  },
  tag(){
    const o=[[.06,.24],[.68,.24],[.94,.5],[.68,.76],[.06,.76]];
    const i=[[.14,.31],[.65,.31],[.83,.5],[.65,.69],[.14,.69]].reverse();
    return [o,i,ringCircle(.24,.5,.055,20)];
  }
};
const ICON_NAMES = { danger:"Danger triangle", bolt:"Lightning bolt", padlock:"Padlock",
                     exclaim:"Exclamation circle", arcflash:"Arc flash burst", tag:"Tag outline" };

/* ------------------------------------------------- element -> primitives --- */
function rotPt(p, cx, cy, deg){
  if(!deg) return p;
  const a = deg*Math.PI/180, s=Math.sin(a), c=Math.cos(a);
  const dx=p[0]-cx, dy=p[1]-cy;
  return [cx+dx*c-dy*s, cy+dx*s+dy*c];
}
function fitInto(box, ar){                 // ar = w/h of the content
  if(!ar || !isFinite(ar)) return box;
  const bAR = box.w/box.h;
  if(ar > bAR){ const h = box.w/ar; return {x:box.x, y:box.y+(box.h-h)/2, w:box.w, h}; }
  const w = box.h*ar; return {x:box.x+(box.w-w)/2, y:box.y, w, h:box.h};
}

function elPrims(el, ctx){
  if(el.visible === false) return [];
  const box = boxOf(el);
  const rc = [box.x+box.w/2, box.y+box.h/2];
  const rot = el.rot||0;
  const out = [];

  if(el.type==="text"){
    const L = layoutText(el, box, ctx);
    L.lines.forEach((ln,i)=>{
      if(!ln) return;
      const w = L.widths[i];
      let x = box.x;
      if(el.align==="center") x = box.x + (box.w-w)/2;
      else if(el.align==="right") x = box.x + box.w - w;
      out.push({ t:"text", x, y:L.top + L.cap + i*L.step, str:ln, cap:L.cap, fs:L.fs,
                 w, font:el.font, bold:el.bold, italic:el.italic, track:el.track,
                 invert:el.invert, rot, rc });
    });
  }
  else if(el.type==="shape"){
    if(el.shape==="ellipse"){
      const ring = ringCircle(0,0,0.5,56).map(p=>[box.x+box.w/2+p[0]*box.w, box.y+box.h/2+p[1]*box.h]);
      out.push({ t:"poly", rings:[ring.map(p=>rotPt(p,rc[0],rc[1],rot))],
                 filled:el.filled, stroke:el.stroke });
    } else {
      out.push({ t:"rect", x:box.x, y:box.y, w:box.w, h:box.h, rx:el.corner||0,
                 filled:el.filled, stroke:el.stroke, rot, rc });
    }
  }
  else if(el.type==="icon"){
    const rings = (ICONS[el.icon]||ICONS.danger)();
    let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
    rings.forEach(r=>r.forEach(p=>{minX=Math.min(minX,p[0]);maxX=Math.max(maxX,p[0]);
                                   minY=Math.min(minY,p[1]);maxY=Math.max(maxY,p[1]);}));
    const uw=Math.max(1e-6,maxX-minX), uh=Math.max(1e-6,maxY-minY);
    const f = fitInto(box, uw/uh);
    const mapped = rings.map(r=>r.map(p=>rotPt(
      [f.x + (p[0]-minX)/uw*f.w, f.y + (p[1]-minY)/uh*f.h], rc[0], rc[1], rot)));
    out.push({ t:"poly", rings:mapped, filled:true, invert:el.invert });
  }
  else if(el.type==="image"){
    const ar = el.srcW && el.srcH ? el.srcW/el.srcH : null;
    const f = el.fit==="stretch" || !ar ? box : fitInto(box, ar);
    if(el.data) out.push({ t:"img", x:f.x, y:f.y, w:f.w, h:f.h, href:el.data, rot, rc });
    else out.push({ t:"ph", x:box.x, y:box.y, w:box.w, h:box.h, label:el.name||"GRAPHIC" });
  }
  return out;
}

function facePrims(face, ctx){
  const out = [];
  face.els.forEach(el => out.push(...elPrims(el, ctx)));
  return out;
}
function rosterCtx(i){
  const r = doc.roster[i] || {};
  return { first:r.first||"", last:r.last||"", dept:r.dept||"",
           n:String(i+1), total:String(doc.roster.length),
           date:new Date().toISOString().slice(0,10) };
}

/* --------------------------------------------------------- SVG serialiser --- */
function primSvg(p, ox, oy, k, opt){
  const X = v => r3((v+ox)*k), Y = v => r3((v+oy)*k);
  const rot = p.rot ? ` transform="rotate(${r3(p.rot)} ${X(p.rc[0])} ${Y(p.rc[1])})"` : "";
  const ink = opt.ink || "#111111";
  if(p.t==="ph"){
    if(opt.forExport) return "";
    return `<rect x="${X(p.x)}" y="${Y(p.y)}" width="${r3(p.w*k)}" height="${r3(p.h*k)}"`
      + ` fill="none" stroke="${opt.guide}" stroke-width="${r3(0.008*k)}" stroke-dasharray="${r3(.03*k)} ${r3(.02*k)}"/>`
      + `<text x="${X(p.x+p.w/2)}" y="${Y(p.y+p.h/2)}" fill="${opt.guide}"`
      + ` font-family="Arial" font-size="${r3(Math.min(p.h*0.34,p.w*0.20,0.09)*k)}"`
      + ` text-anchor="middle" dominant-baseline="central">${esc(p.label)}</text>`;
  }
  if(p.t==="text"){
    const ls = p.track ? ` letter-spacing="${r3(p.fs*p.track/1000*k)}"` : "";
    return `<text x="${X(p.x)}" y="${Y(p.y)}" font-family="${esc(p.font)}, Arial, sans-serif"`
      + ` font-size="${r3(p.fs*k)}" font-weight="${p.bold?700:400}"`
      + (p.italic?` font-style="italic"`:"") + ls
      + ` fill="${p.invert ? (opt.knock||"#FFFFFF") : ink}" xml:space="preserve"${rot}>`
      + `${esc(p.str)}</text>`;
  }
  if(p.t==="rect"){
    const style = p.filled ? `fill="${ink}"`
      : `fill="none" stroke="${ink}" stroke-width="${r3((p.stroke||0.008)*k)}"`;
    return `<rect x="${X(p.x)}" y="${Y(p.y)}" width="${r3(p.w*k)}" height="${r3(p.h*k)}"`
      + ` rx="${r3((p.rx||0)*k)}" ${style}${rot}/>`;
  }
  if(p.t==="poly"){
    const d = p.rings.map(r=>"M"+r.map(v=>X(v[0])+","+Y(v[1])).join("L")+"Z").join("");
    return p.filled===false
      ? `<path d="${d}" fill="none" stroke="${ink}" stroke-width="${r3((p.stroke||0.008)*k)}"/>`
      : `<path d="${d}" fill="${p.invert?(opt.knock||"#FFFFFF"):ink}" fill-rule="evenodd"/>`;
  }
  if(p.t==="img"){
    return `<image x="${X(p.x)}" y="${Y(p.y)}" width="${r3(p.w*k)}" height="${r3(p.h*k)}"`
      + ` preserveAspectRatio="none" href="${p.href}" xlink:href="${p.href}"${rot}/>`;
  }
  return "";
}

/* ---------------------------------------------------------------- sheet --- */
function sheetFaces(){
  const out = [];
  const order = doc.sheet.order;
  const push = (fi, ri) => {
    const f = doc.faces[fi]; if(!f) return;
    const r = doc.roster[ri]||{};
    const nm = (r.first||r.last) ? (r.first+" "+r.last).trim() : ("Lock "+(ri+1));
    out.push({ name:nm+" · "+f.name, prims:facePrims(f, rosterCtx(ri)) });
  };
  if(order==="pairs"){
    doc.roster.forEach((_,ri)=> doc.faces.forEach((_,fi)=> push(fi,ri)));
  } else if(order==="grouped"){
    doc.faces.forEach((_,fi)=> doc.roster.forEach((_,ri)=> push(fi,ri)));
  } else {
    const fi = parseInt(order.replace("face",""))||0;
    doc.roster.forEach((_,ri)=> push(fi,ri));
  }
  const cols = Math.max(1, Math.round(doc.sheet.cols));
  const rows = Math.max(1, Math.ceil(out.length/cols));
  const cw = doc.label.w + doc.sheet.gapX, ch = doc.label.h + doc.sheet.gapY;
  out.forEach((f,i)=>{ f.ox = (i%cols)*cw; f.oy = Math.floor(i/cols)*ch; });
  return { faces:out, cols, rows,
           w: cols*doc.label.w + (cols-1)*doc.sheet.gapX,
           h: rows*doc.label.h + (rows-1)*doc.sheet.gapY };
}

function exportSVG(){
  const sh = sheetFaces(), k = MM;
  const opt = { forExport:true, ink:"#000000", knock:"#FFFFFF", guide:"#BBBBBB" };
  let s = `<?xml version="1.0" encoding="UTF-8"?>\n`
    + `<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" `
    + `width="${r3(sh.w*k)}mm" height="${r3(sh.h*k)}mm" `
    + `viewBox="0 0 ${r3(sh.w*k)} ${r3(sh.h*k)}">\n`
    + `<title>${esc(doc.name)} — ${sh.faces.length} faces</title>\n`;
  sh.faces.forEach((f,i)=>{
    s += `<g id="${esc("face_"+(i+1)+"_"+f.name.replace(/[^A-Za-z0-9]+/g,"_"))}">\n`;
    f.prims.forEach(p=>{ const t = primSvg(p, f.ox, f.oy, k, opt); if(t) s += "  "+t+"\n"; });
    s += `</g>\n`;
  });
  return s + `</svg>\n`;
}

/* ---------------------------------------------------- LightBurn serialiser --- */
function lbCut(idx, name, p, isCut, output){
  return `  <CutSetting type="${isCut?"Cut":"Scan"}">
    <index Value="${idx}"/>
    <name Value="${esc(name)}"/>
    <maxPower Value="${p.power}"/>
    <maxPower2 Value="${p.power}"/>
    <speed Value="${p.speed}"/>
    <frequency Value="${Math.round(p.freq*1000)}"/>
    <numPasses Value="${p.passes}"/>
    <interval Value="${p.interval}"/>
    <QPulseWidth Value="200"/>
    <doOutput Value="${output?1:0}"/>
    <priority Value="${idx}"/>
    <tabCount Value="1"/>
    <tabCountMax Value="1"/>
  </CutSetting>\n`;
}
function lbXForm(cx, cy, rot){
  if(!rot) return `1 0 0 1 ${r3(cx)} ${r3(cy)}`;
  const a = -rot*Math.PI/180, s=Math.sin(a), c=Math.cos(a);
  return `${r3(c)} ${r3(s)} ${r3(-s)} ${r3(c)} ${r3(cx)} ${r3(cy)}`;
}
function primLbrn(p, ox, oy, H, pad){
  const k = MM;
  const X = v => (v+ox)*k, Y = v => H - (v+oy)*k;
  if(p.t==="ph") return "";
  if(p.t==="text"){
    return `${pad}<Shape Type="Text" CutIndex="0" Font="${esc(p.font)}" Str="${esc(p.str)}" `
      + `H="${r3(p.cap*k)}" LS="${r3(p.fs*k*(p.track||0)/1000)}" LnS="0" Ah="0" Av="0" `
      + `Bold="${p.bold?1:0}" Italic="${p.italic?1:0}" Weld="0" HasBackupPath="0">\n`
      + `${pad}  <XForm>${lbXForm(X(p.x), Y(p.y), p.rot)}</XForm>\n${pad}</Shape>\n`;
  }
  if(p.t==="rect"){
    return `${pad}<Shape Type="Rect" CutIndex="0" W="${r3(p.w*k)}" H="${r3(p.h*k)}" `
      + `Cr="${r3((p.rx||0)*k)}">\n`
      + `${pad}  <XForm>${lbXForm(X(p.x+p.w/2), Y(p.y+p.h/2), p.rot)}</XForm>\n${pad}</Shape>\n`;
  }
  if(p.t==="poly"){
    let v="", pr="", n=0;
    p.rings.forEach(r=>{
      const st=n;
      r.forEach(q=>{ v += `V${r3(X(q[0]))} ${r3(Y(q[1]))}`; n++; });
      for(let i=st;i<n;i++) pr += `L${i} ${i+1<n?i+1:st}`;
    });
    return `${pad}<Shape Type="Path" CutIndex="0">\n${pad}  <XForm>1 0 0 1 0 0</XForm>\n`
      + `${pad}  <VertList>${v}</VertList>\n${pad}  <PrimList>${pr}</PrimList>\n${pad}</Shape>\n`;
  }
  if(p.t==="img"){
    return `${pad}<Shape Type="Rect" CutIndex="1" W="${r3(p.w*k)}" H="${r3(p.h*k)}" Cr="0">\n`
      + `${pad}  <XForm>${lbXForm(X(p.x+p.w/2), Y(p.y+p.h/2), p.rot)}</XForm>\n${pad}</Shape>\n`;
  }
  return "";
}
function exportLBRN(){
  const sh = sheetFaces(), H = sh.h*MM, p = laserEffective();
  let s = `<?xml version="1.0" encoding="UTF-8"?>\n`
    + `<LightBurnProject AppVersion="1.7.00" DeviceName="Haas HL-50E" FormatVersion="1" `
    + `MaterialHeight="0" MirrorX="False" MirrorY="False">\n`;
  s += lbCut(0, MATERIALS[doc.laser.material].name.slice(0,30), p, doc.laser.fill==="cut", true);
  s += lbCut(1, "Guide — no output", {power:10,speed:1000,freq:30,passes:1,interval:0.05}, true, false);
  sh.faces.forEach(f=>{
    s += `  <Shape Type="Group">\n    <XForm>1 0 0 1 0 0</XForm>\n    <Children>\n`;
    f.prims.forEach(q=> s += primLbrn(q, f.ox, f.oy, H, "      "));
    s += `    </Children>\n  </Shape>\n`;
  });
  return s + `</LightBurnProject>\n`;
}

/* ------------------------------------------------------------ fit checker --- */
function fitIssues(){
  const s = safeRect(), out = [];
  const t = 0.002;
  doc.faces.forEach(f=>{
    f.els.forEach(el=>{
      if(el.visible===false) return;
      elPrims(el, rosterCtx(0)).forEach(p=>{
        let x0,y0,x1,y1;
        if(p.t==="text"){ x0=p.x; x1=p.x+p.w; y0=p.y-p.cap; y1=p.y + (/[gjpqyQ,;]/.test(p.str)?p.cap*0.22:0); }
        else if(p.t==="poly"){
          const xs=[],ys=[]; p.rings.forEach(r=>r.forEach(v=>{xs.push(v[0]);ys.push(v[1]);}));
          x0=Math.min(...xs);x1=Math.max(...xs);y0=Math.min(...ys);y1=Math.max(...ys);
        } else { x0=p.x;y0=p.y;x1=p.x+p.w;y1=p.y+p.h; }
        if(x0<s.x-t||y0<s.y-t||x1>s.x+s.w+t||y1>s.y+s.h+t){
          const nm = f.name+" · "+el.name;
          if(!out.includes(nm)) out.push(nm);
        }
      });
    });
  });
  return out;
}

/* ============================================================================
   MARKBENCH — stage editor
   The stage is one SVG whose viewBox IS the world, measured in inches.
   Screen scale = pixel width / viewBox width, so a handle drawn at 9/scale
   inches is always 9 px no matter the zoom.
   ========================================================================== */

const ui = {
  faceIdx:0, previewIdx:0, sel:[],
  view:{x:-0.4, y:-0.4, w:3}, scale:1,
  showGrid:true, snap:true, showLock:true, showRule:true,
  grid:1/16,
  panel:"stage",
  drag:null, guides:[]
};

const stage = document.getElementById("stage");
const face = () => doc.faces[ui.faceIdx] || doc.faces[0];
const selEls = () => face().els.filter(e => ui.sel.includes(e.id));
const firstSel = () => selEls()[0] || null;

function lockOrigin(){
  return { x:(doc.label.w-doc.lock.w)/2 - doc.label.dx,
           y:(doc.label.h-doc.lock.h)/2 - doc.label.dy };
}
function worldBounds(){
  const lo = lockOrigin();
  const x0 = Math.min(0, lo.x), y0 = Math.min(0, lo.y);
  const x1 = Math.max(doc.label.w, lo.x+doc.lock.w);
  const y1 = Math.max(doc.label.h, lo.y+doc.lock.h);
  return {x:x0, y:y0, w:x1-x0, h:y1-y0};
}
function fitView(){
  const r = stage.getBoundingClientRect();
  if(!r.width || !r.height) return;
  const b = worldBounds();
  const padTop = ui.showRule ? 0.34 : 0.18, padL = ui.showRule ? 0.30 : 0.18;
  const bw = b.w + padL + 0.18, bh = b.h + padTop + 0.18;
  const z = Math.min(r.width/bw, r.height/bh) * 0.94;
  const vw = r.width/z, vh = r.height/z;
  ui.view = { x: b.x - padL - (vw-bw)/2, y: b.y - padTop - (vh-bh)/2, w: vw };
  drawStage();
}
function viewRect(){
  const r = stage.getBoundingClientRect();
  const h = r.height ? ui.view.w * r.height / r.width : ui.view.w;
  return { x:ui.view.x, y:ui.view.y, w:ui.view.w, h };
}
function toWorld(ev){
  const r = stage.getBoundingClientRect(), v = viewRect();
  return { x: v.x + (ev.clientX-r.left)/r.width*v.w,
           y: v.y + (ev.clientY-r.top)/r.height*v.h };
}

/* ------------------------------------------------------------------ draw --- */
function drawStage(){
  const r = stage.getBoundingClientRect();
  if(!r.width) return;
  const v = viewRect();
  ui.scale = r.width / v.w;                       // px per inch
  const S = ui.scale, px = n => n/S;              // n screen px -> inches
  stage.setAttribute("viewBox", `${r3(v.x)} ${r3(v.y)} ${r3(v.w)} ${r3(v.h)}`);
  stage.setAttribute("preserveAspectRatio","none");

  const lo = lockOrigin(), sf = safeRect(), L = doc.label;
  let s = "";

  /* --- lock body --- */
  if(ui.showLock){
    s += `<rect x="${r3(lo.x)}" y="${r3(lo.y)}" width="${r3(doc.lock.w)}" height="${r3(doc.lock.h)}"`
      + ` rx="${r3(doc.lock.corner)}" fill="#20262F" stroke="#39424F" stroke-width="1" vector-effect="non-scaling-stroke"/>`;
  }
  /* --- label stock --- */
  s += `<rect x="0" y="0" width="${r3(L.w)}" height="${r3(L.h)}" rx="${r3(L.corner)}"`
    + ` fill="var(--paper)" stroke="#9A968B" stroke-width="1" vector-effect="non-scaling-stroke"/>`;

  /* --- grid --- */
  if(ui.showGrid && ui.grid*S >= 4){
    let g = "";
    for(let x=ui.grid; x<L.w-1e-6; x+=ui.grid){
      const major = Math.abs((x/0.125)-Math.round(x/0.125))<1e-6;
      g += `<line x1="${r3(x)}" y1="0" x2="${r3(x)}" y2="${r3(L.h)}" stroke="#C9C6BB" stroke-width="${major?1:0.6}" opacity="${major?.85:.5}" vector-effect="non-scaling-stroke"/>`;
    }
    for(let y=ui.grid; y<L.h-1e-6; y+=ui.grid){
      const major = Math.abs((y/0.125)-Math.round(y/0.125))<1e-6;
      g += `<line x1="0" y1="${r3(y)}" x2="${r3(L.w)}" y2="${r3(y)}" stroke="#C9C6BB" stroke-width="${major?1:0.6}" opacity="${major?.85:.5}" vector-effect="non-scaling-stroke"/>`;
    }
    s += `<g clip-path="url(#lblclip)">${g}</g>`;
  }
  /* --- safe area --- */
  s += `<rect x="${r3(sf.x)}" y="${r3(sf.y)}" width="${r3(sf.w)}" height="${r3(sf.h)}"`
    + ` fill="none" stroke="#D8452E" stroke-width="1" stroke-dasharray="4 3" opacity=".65" vector-effect="non-scaling-stroke"/>`;

  /* --- artwork --- */
  const opt = { forExport:false, ink:"#14181F", knock:"var(--paper)", guide:"#A8A49A" };
  const ctx = rosterCtx(ui.previewIdx);
  s += `<g clip-path="url(#lblclip)">`;
  face().els.forEach(el=>{ elPrims(el, ctx).forEach(p=>{ s += primSvg(p, 0, 0, 1, opt); }); });
  s += `</g>`;

  /* --- selection --- */
  selEls().forEach(el=>{
    const b = boxOf(el), c=[b.x+b.w/2,b.y+b.h/2], rot=el.rot||0;
    const tr = rot?` transform="rotate(${r3(rot)} ${r3(c[0])} ${r3(c[1])})"`:"";
    s += `<rect x="${r3(b.x)}" y="${r3(b.y)}" width="${r3(b.w)}" height="${r3(b.h)}"`
      + ` fill="none" stroke="var(--cyan)" stroke-width="1.4" vector-effect="non-scaling-stroke"${tr}/>`;
  });
  const one = ui.sel.length===1 ? firstSel() : null;
  if(one && !one.locked){
    const b = boxOf(one), c=[b.x+b.w/2,b.y+b.h/2], hs = px(9);
    const tr = one.rot?` transform="rotate(${r3(one.rot)} ${r3(c[0])} ${r3(c[1])})"`:"";
    s += `<g${tr}>`;
    HANDLES.forEach(h=>{
      const p = handlePt(b,h);
      s += `<rect x="${r3(p[0]-hs/2)}" y="${r3(p[1]-hs/2)}" width="${r3(hs)}" height="${r3(hs)}"`
        + ` fill="#0C0F14" stroke="var(--cyan)" stroke-width="1.4" vector-effect="non-scaling-stroke"/>`;
    });
    s += `</g>`;
  }

  /* --- snap guides --- */
  ui.guides.forEach(g=>{
    s += g.axis==="x"
      ? `<line x1="${r3(g.v)}" y1="${r3(v.y)}" x2="${r3(g.v)}" y2="${r3(v.y+v.h)}" stroke="var(--accent)" stroke-width="1" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"/>`
      : `<line x1="${r3(v.x)}" y1="${r3(g.v)}" x2="${r3(v.x+v.w)}" y2="${r3(g.v)}" stroke="var(--accent)" stroke-width="1" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"/>`;
  });

  /* --- machinist's rule (the scale reference along top + left) --- */
  if(ui.showRule) s += drawRule(v, S);

  stage.innerHTML =
    `<defs><clipPath id="lblclip"><rect x="0" y="0" width="${r3(L.w)}" height="${r3(L.h)}" rx="${r3(L.corner)}"/></clipPath></defs>` + s;
}

function drawRule(v, S){
  const L = doc.label, px = n=>n/S;
  const inMode = doc.units==="in";
  const div = inMode ? 1/16 : 1/MM;             // finest tick
  const majEvery = inMode ? 16 : 10;            // 1 in, or 10 mm
  const midEvery = inMode ? 8 : 5;
  const y0 = -px(26), x0 = -px(26), th = px(9), tm = px(6), ts = px(3.5);
  const fs = px(9);
  let s = `<g pointer-events="none">`;
  s += `<rect x="0" y="${r3(y0-th-px(13))}" width="${r3(L.w)}" height="${r3(th+px(13))}" fill="#171D28"/>`;
  s += `<rect x="${r3(x0-th-px(13))}" y="0" width="${r3(th+px(13))}" height="${r3(L.h)}" fill="#171D28"/>`;
  s += `<line x1="0" y1="${r3(y0)}" x2="${r3(L.w)}" y2="${r3(y0)}" stroke="#7E8DA4" stroke-width="1.2" vector-effect="non-scaling-stroke"/>`;
  const n = Math.floor(L.w/div + 1e-6);
  for(let i=0;i<=n;i++){
    const x = i*div;
    const maj = i%majEvery===0, mid = i%midEvery===0;
    const len = maj?th:mid?tm:ts;
    if(!maj && !mid && div*S < 3.5) continue;
    s += `<line x1="${r3(x)}" y1="${r3(y0)}" x2="${r3(x)}" y2="${r3(y0-len)}" stroke="${maj?"#C4CEDC":"#6E7C93"}" stroke-width="${maj?1.2:1}" vector-effect="non-scaling-stroke"/>`;
    if(maj && i>0) s += `<text x="${r3(x)}" y="${r3(y0-th-px(3))}" fill="#B6C2D2" font-family="ui-monospace,monospace" font-size="${r3(fs)}" text-anchor="middle">${inMode?(i/16):(i)}</text>`;
  }
  s += `<line x1="${r3(x0)}" y1="0" x2="${r3(x0)}" y2="${r3(L.h)}" stroke="#7E8DA4" stroke-width="1.2" vector-effect="non-scaling-stroke"/>`;
  const m = Math.floor(L.h/div + 1e-6);
  for(let i=0;i<=m;i++){
    const y = i*div;
    const maj = i%majEvery===0, mid = i%midEvery===0;
    const len = maj?th:mid?tm:ts;
    if(!maj && !mid && div*S < 3.5) continue;
    s += `<line x1="${r3(x0)}" y1="${r3(y)}" x2="${r3(x0-len)}" y2="${r3(y)}" stroke="${maj?"#C4CEDC":"#6E7C93"}" stroke-width="${maj?1.2:1}" vector-effect="non-scaling-stroke"/>`;
    if(maj && i>0) s += `<text x="${r3(x0-th-px(4))}" y="${r3(y+fs*0.36)}" fill="#B6C2D2" font-family="ui-monospace,monospace" font-size="${r3(fs)}" text-anchor="end">${inMode?(i/16):(i)}</text>`;
  }
  s += `<text x="${r3(x0-px(4))}" y="${r3(y0-px(4))}" fill="#5C6980" font-family="ui-monospace,monospace" font-size="${r3(fs)}" text-anchor="end">${U.label()}</text>`;
  return s+`</g>`;
}

/* --------------------------------------------------------------- handles --- */
const HANDLES = ["nw","n","ne","e","se","s","sw","w"];
function handlePt(b,h){
  const x = h.includes("w")?b.x : h.includes("e")?b.x+b.w : b.x+b.w/2;
  const y = h.includes("n")?b.y : h.includes("s")?b.y+b.h : b.y+b.h/2;
  return [x,y];
}
function unrot(pt, c, deg){
  if(!deg) return pt;
  const a = -deg*Math.PI/180, s=Math.sin(a), co=Math.cos(a);
  const dx=pt.x-c[0], dy=pt.y-c[1];
  return { x:c[0]+dx*co-dy*s, y:c[1]+dx*s+dy*co };
}
function hitElement(w){
  const els = face().els;
  for(let i=els.length-1;i>=0;i--){
    const el = els[i];
    if(el.visible===false || el.locked) continue;
    const b = boxOf(el), c=[b.x+b.w/2,b.y+b.h/2];
    const p = unrot(w, c, el.rot||0);
    const m = 4/ui.scale;
    if(p.x>=b.x-m && p.x<=b.x+b.w+m && p.y>=b.y-m && p.y<=b.y+b.h+m) return el;
  }
  return null;
}
function hitHandle(w){
  if(ui.sel.length!==1) return null;
  const el = firstSel(); if(!el || el.locked) return null;
  const b = boxOf(el), c=[b.x+b.w/2,b.y+b.h/2];
  const p = unrot(w, c, el.rot||0), t = 10/ui.scale;
  for(const h of HANDLES){
    const q = handlePt(b,h);
    if(Math.abs(p.x-q[0])<t && Math.abs(p.y-q[1])<t) return h;
  }
  return null;
}

/* --------------------------------------------------------------- snapping --- */
function snapTargets(exceptIds){
  const s = safeRect();
  const xs = [{v:s.x,l:"edge"},{v:s.x+s.w/2,l:"center"},{v:s.x+s.w,l:"edge"}];
  const ys = [{v:s.y,l:"edge"},{v:s.y+s.h/2,l:"middle"},{v:s.y+s.h,l:"edge"}];
  face().els.forEach(el=>{
    if(exceptIds.includes(el.id) || el.visible===false) return;
    const b = boxOf(el);
    xs.push({v:b.x},{v:b.x+b.w/2},{v:b.x+b.w});
    ys.push({v:b.y},{v:b.y+b.h/2},{v:b.y+b.h});
  });
  return {xs,ys};
}
function applySnap(box, ids){
  ui.guides = [];
  if(!ui.snap) return box;
  const tol = 7/ui.scale;
  const T = snapTargets(ids);
  const cands = [[box.x,0],[box.x+box.w/2,0.5],[box.x+box.w,1]];
  let bestX=null;
  cands.forEach(([v,f])=>{
    T.xs.forEach(t=>{
      const d = Math.abs(v-t.v);
      if(d<tol && (!bestX || d<bestX.d)) bestX = {d, dx:t.v-v, gv:t.v};
    });
  });
  const candsY = [[box.y,0],[box.y+box.h/2,0.5],[box.y+box.h,1]];
  let bestY=null;
  candsY.forEach(([v,f])=>{
    T.ys.forEach(t=>{
      const d = Math.abs(v-t.v);
      if(d<tol && (!bestY || d<bestY.d)) bestY = {d, dy:t.v-v, gv:t.v};
    });
  });
  if(bestX){ box.x += bestX.dx; ui.guides.push({axis:"x", v:bestX.gv}); }
  else { box.x = Math.round(box.x/ui.grid)*ui.grid; }
  if(bestY){ box.y += bestY.dy; ui.guides.push({axis:"y", v:bestY.gv}); }
  else { box.y = Math.round(box.y/ui.grid)*ui.grid; }
  return box;
}

/* ------------------------------------------------------------- interaction --- */
let pointers = new Map(), pinch = null;

stage.addEventListener("pointerdown", ev=>{
  stage.setPointerCapture(ev.pointerId);
  pointers.set(ev.pointerId, ev);
  if(pointers.size===2){
    const [a,b] = [...pointers.values()];
    pinch = { d:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY), w:ui.view.w,
              cx:(a.clientX+b.clientX)/2, cy:(a.clientY+b.clientY)/2 };
    ui.drag = null; return;
  }
  const w = toWorld(ev);
  const h = hitHandle(w);
  if(h){
    const el = firstSel();
    ui.drag = { mode:"resize", h, el, start:w, box0:boxOf(el), cap0:el.cap };
    return;
  }
  const el = hitElement(w);
  if(el){
    if(ev.shiftKey){ ui.sel = ui.sel.includes(el.id) ? ui.sel.filter(i=>i!==el.id) : [...ui.sel, el.id]; }
    else if(!ui.sel.includes(el.id)) ui.sel = [el.id];
    ui.drag = { mode:"move", start:w, boxes:selEls().map(e=>({e, b:boxOf(e)})) };
    syncSelection();
  } else {
    if(!ev.shiftKey){ ui.sel = []; syncSelection(); }
    ui.drag = { mode:"pan", start:{cx:ev.clientX, cy:ev.clientY}, vx:ui.view.x, vy:ui.view.y };
  }
  drawStage();
});

stage.addEventListener("pointermove", ev=>{
  if(pointers.has(ev.pointerId)) pointers.set(ev.pointerId, ev);
  if(pinch && pointers.size===2){
    const [a,b] = [...pointers.values()];
    const d = Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);
    if(d>4){
      const r = stage.getBoundingClientRect();
      const before = { x: ui.view.x + (pinch.cx-r.left)/r.width*ui.view.w,
                       y: ui.view.y + (pinch.cy-r.top)/r.width*ui.view.w };
      ui.view.w = clamp(pinch.w * pinch.d/d, 0.25, 40);
      ui.view.x = before.x - (pinch.cx-r.left)/r.width*ui.view.w;
      ui.view.y = before.y - (pinch.cy-r.top)/r.width*ui.view.w;
      drawStage();
    }
    return;
  }
  const d = ui.drag; if(!d) { showCoord(toWorld(ev)); return; }
  if(d.mode==="pan"){
    const r = stage.getBoundingClientRect();
    ui.view.x = d.vx - (ev.clientX-d.start.cx)/r.width*ui.view.w;
    ui.view.y = d.vy - (ev.clientY-d.start.cy)/r.width*ui.view.w;
    drawStage(); return;
  }
  const w = toWorld(ev);
  if(d.mode==="move"){
    let dx = w.x-d.start.x, dy = w.y-d.start.y;
    if(d.boxes.length===1){
      const nb = applySnap({x:d.boxes[0].b.x+dx, y:d.boxes[0].b.y+dy,
                            w:d.boxes[0].b.w, h:d.boxes[0].b.h}, [d.boxes[0].e.id]);
      setBox(d.boxes[0].e, nb);
    } else {
      ui.guides = [];
      d.boxes.forEach(({e,b})=> setBox(e, {x:b.x+dx, y:b.y+dy, w:b.w, h:b.h}));
    }
  }
  else if(d.mode==="resize"){
    const el = d.el, b0 = d.box0, c=[b0.x+b0.w/2, b0.y+b0.h/2];
    const p = unrot(w, c, el.rot||0), s0 = unrot(d.start, c, el.rot||0);
    let dx = p.x-s0.x, dy = p.y-s0.y;
    let nb = {...b0};
    if(d.h.includes("w")){ nb.x = b0.x+dx; nb.w = b0.w-dx; }
    if(d.h.includes("e")){ nb.w = b0.w+dx; }
    if(d.h.includes("n")){ nb.y = b0.y+dy; nb.h = b0.h-dy; }
    if(d.h.includes("s")){ nb.h = b0.h+dy; }
    if(nb.w < 0.02){ nb.w = 0.02; }
    if(nb.h < 0.005){ nb.h = 0.005; }
    if(el.type==="image" && el.keepAR && el.srcW && el.srcH && d.h.length===2){
      const ar = el.srcW/el.srcH;
      nb.h = nb.w/ar;
      if(d.h.includes("n")) nb.y = b0.y + b0.h - nb.h;
    }
    nb = applySnap(nb, [el.id]);
    if(el.type==="text" && el.fit==="none"){
      el.cap = clamp(d.cap0 * (nb.h/Math.max(1e-4,b0.h)), 0.01, 4);
    }
    setBox(el, nb);
  }
  showCoord(w);
  drawStage();
});

function endDrag(ev){
  pointers.delete(ev.pointerId);
  if(pointers.size<2) pinch = null;
  if(ui.drag){ const was = ui.drag.mode; ui.drag = null; ui.guides = [];
    drawStage(); renderProps(); updateStatus();
    if(was !== "pan" && typeof saveLocal === "function") saveLocal(); }
}

stage.addEventListener("pointercancel", endDrag);
stage.addEventListener("lostpointercapture", endDrag);

stage.addEventListener("wheel", ev=>{
  ev.preventDefault();
  const r = stage.getBoundingClientRect();
  const before = { x: ui.view.x + (ev.clientX-r.left)/r.width*ui.view.w,
                   y: ui.view.y + (ev.clientY-r.top)/r.width*ui.view.w };
  const f = Math.exp(ev.deltaY*0.0016);
  ui.view.w = clamp(ui.view.w*f, 0.25, 40);
  ui.view.x = before.x - (ev.clientX-r.left)/r.width*ui.view.w;
  ui.view.y = before.y - (ev.clientY-r.top)/r.width*ui.view.w;
  drawStage();
}, {passive:false});

  const el = hitElement(toWorld(ev));

document.addEventListener("keydown", ev=>{
  const tag = (ev.target.tagName||"").toLowerCase();
  if(tag==="input"||tag==="textarea"||tag==="select") return;
  const sel = selEls();
  if(ev.key==="Escape"){ ui.sel=[]; syncSelection(); drawStage(); return; }
  if((ev.key==="Delete"||ev.key==="Backspace") && sel.length){ ev.preventDefault(); deleteSel(); return; }
  if(ev.key.toLowerCase()==="d" && (ev.ctrlKey||ev.metaKey)){ ev.preventDefault(); duplicateSel(); return; }
  if(ev.key.startsWith("Arrow") && sel.length){
    ev.preventDefault();
    const st = ev.shiftKey ? ui.grid*4 : ui.grid;
    const dx = ev.key==="ArrowLeft"?-st:ev.key==="ArrowRight"?st:0;
    const dy = ev.key==="ArrowUp"?-st:ev.key==="ArrowDown"?st:0;
    sel.forEach(e=>{ const b=boxOf(e); setBox(e,{x:b.x+dx,y:b.y+dy,w:b.w,h:b.h}); });
    drawStage(); renderProps(); updateStatus();
  }
});

}

/* ------------------------------------------------------------- materials --- */
const MATERIALS = {
  anodized:{ name:"Anodized aluminium — white mark", speed:1200, power:45, freq:40, interval:0.02, passes:1,
    note:"Anodising is microns thick. Ablate it, don't engrave it. Brown halo or burnt-looking letters means go faster before you drop power." },
  alumBare:{ name:"Bare / mill aluminium — dark", speed:400, power:85, freq:30, interval:0.012, passes:2,
    note:"Bare aluminium resists contrast. Two lighter passes read darker than one heavy pass and warp the body less." },
  ssAnneal:{ name:"Stainless — anneal (black, no depth)", speed:150, power:35, freq:60, interval:0.010, passes:1,
    note:"Annealing wants heat, not removal. High frequency, slow speed, 1–2 mm out of focus. Grey instead of black means slow down before adding power." },
  ssEngrave:{ name:"Stainless / carbon steel — engrave", speed:600, power:90, freq:30, interval:0.020, passes:2,
    note:"In focus, mid frequency. Past 90 % power, add a pass instead." },
  painted:{ name:"Powder-coated or painted steel", speed:1500, power:40, freq:40, interval:0.030, passes:1,
    note:"You're removing coating only. Stop when the substrate shows — extra dose scorches a ring around the letters." },
  brass:{ name:"Brass / bronze", speed:400, power:80, freq:25, interval:0.020, passes:1,
    note:"Reflective but forgiving. Lower frequency gives a cleaner, deeper cut." },
  thermo:{ name:"Thermoplastic lock body", speed:1800, power:22, freq:30, interval:0.030, passes:1,
    note:"Plastic foams rather than cuts. Too much dose melts the edge and closes the letters up. Ventilate." },
  laminate:{ name:"Laminate / engraving stock", speed:2000, power:20, freq:30, interval:0.030, passes:1,
    note:"Very light dose. If the core colour isn't showing, add a pass instead of power." },
  titanium:{ name:"Titanium — colour anneal", speed:500, power:30, freq:60, interval:0.015, passes:1,
    note:"Colour is almost pure dose. Small speed changes swing the colour — move one trim step at a time." }
};
function laserEffective(){
  const L = doc.laser;
  if(L.manual) return {speed:L.speed, power:L.power, freq:L.freq, interval:L.interval, passes:L.passes};
  const m = MATERIALS[L.material], n = L.trim;
  return { speed: Math.max(20, Math.round(m.speed*Math.pow(0.82,n)/10)*10),
           power: clamp(Math.round(m.power*Math.pow(1.05,n)), 5, 100),
           freq:m.freq, interval:m.interval, passes:m.passes };
}

/* ------------------------------------------------------------ image pipe --- */
const _imgCache = new Map();
function loadImg(src){
  if(_imgCache.has(src)) return Promise.resolve(_imgCache.get(src));
  return new Promise((res,rej)=>{
    const im = new Image();
    im.onload = ()=>{ _imgCache.set(src,im); res(im); };
    im.onerror = ()=>rej(new Error("image"));
    im.src = src;
  });
}
function readFile(file){
  return new Promise((res,rej)=>{
    const fr = new FileReader();
    fr.onload = ()=>res(fr.result); fr.onerror = ()=>rej(new Error("read"));
    fr.readAsDataURL(file);
  });
}
async function ingestImage(el, file){
  const raw = await readFile(file);
  el.raw = raw;
  el.isSvg = /^data:image\/svg/.test(raw);
  try{
    const im = await loadImg(raw);
    el.srcW = im.naturalWidth||300; el.srcH = im.naturalHeight||200;
  }catch(e){ el.srcW = 300; el.srcH = 200; }
  if(el.keepAR && el.srcW && el.srcH){
    const b = boxOf(el);
    setBox(el, {x:b.x, y:b.y, w:b.w, h:b.w*el.srcH/el.srcW});
  }
  el.name = file.name.replace(/\.[^.]+$/,"").slice(0,24) || el.name;
  await processImage(el);
}
async function processImage(el){
  if(!el.raw) return;
  if(el.isSvg && el.mode==="original"){
    el.data = el.raw; el.bytes = Math.round(el.raw.length*0.75); return;
  }
  const im = await loadImg(el.raw);
  const targetW = Math.max(24, Math.min(4000, Math.round(el.w * el.dpi)));
  const scale = Math.min(1, targetW/(im.naturalWidth||targetW));
  const W = Math.max(8, Math.round((im.naturalWidth||targetW)*scale));
  const H = Math.max(8, Math.round((im.naturalHeight||targetW)*scale));
  const cv = document.createElement("canvas");
  cv.width = W; cv.height = H;
  const cx = cv.getContext("2d", {willReadFrequently:true});
  cx.imageSmoothingQuality = "high";
  cx.drawImage(im, 0, 0, W, H);
  if(el.mode!=="original"){
    const d = cx.getImageData(0,0,W,H), a = d.data;
    for(let i=0;i<a.length;i+=4){
      let g = 0.299*a[i] + 0.587*a[i+1] + 0.114*a[i+2];
      if(el.invert) g = 255-g;
      if(el.mode==="threshold"){
        const on = g < el.thresh;                  // dark pixels are the mark
        a[i]=a[i+1]=a[i+2] = on?0:255;
        a[i+3] = on ? Math.max(a[i+3],255) : 0;    // white becomes clear
      } else {
        a[i]=a[i+1]=a[i+2] = g;
      }
    }
    cx.putImageData(d,0,0);
  }
  el.data = cv.toDataURL("image/png");
  el.bytes = Math.round(el.data.length*0.75);
}

const $ = id => document.getElementById(id);
function toast(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove("show"), 2200);
}
function download(name, text, mime){
  const b = new Blob([text], {type:mime||"application/octet-stream"});
  const u = URL.createObjectURL(b), a = document.createElement("a");
  a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(u), 5000);
}
function setByPath(path, v){
  const parts = path.split(".");
  const root = parts.shift();
  let o = root==="el" ? firstSel() : root==="ui" ? ui : doc;
  if(!o) return;
  while(parts.length>1) o = o[parts.shift()];
  o[parts[0]] = v;
}
function getByPath(path){
  const parts = path.split(".");
  const root = parts.shift();
  let o = root==="el" ? firstSel() : root==="ui" ? ui : doc;
  for(const p of parts){ if(o==null) return undefined; o = o[p]; }
  return o;
}

/* ---- batch ---- */
function panelBatch(){
  const sh = sheetFaces();
  const over = doc.sheet.field>0 && (sh.w>doc.sheet.field || sh.h>doc.sheet.field);
  const perC = Math.max(1, Math.floor((doc.sheet.field+doc.sheet.gapX)/(doc.label.w+doc.sheet.gapX)));
  const perR = Math.max(1, Math.floor((doc.sheet.field+doc.sheet.gapY)/(doc.label.h+doc.sheet.gapY)));

/* ------------------------------------------------------- panel behaviour --- */
function bindPanel(root){
  root.querySelectorAll("[data-bind]").forEach(inp=>{
    const ev = (inp.type==="checkbox"||inp.tagName==="SELECT") ? "change" : "input";
    inp.addEventListener(ev, async ()=>{
      const path = inp.dataset.bind, kind = inp.dataset.kind||"raw";
      let v;
      if(kind==="bool") v = inp.checked;
      else if(kind==="len") v = U.fromDisp(parseFloat(inp.value)||0);
      else if(kind==="num") v = parseFloat(inp.value)||0;
      else v = inp.value;
      if(path.startsWith("ui.")){
        if(kind==="raw" && typeof v==="string" && v.trim()!=="" && isFinite(+v)) v = +v;
        ui[path.slice(3)] = v; drawStage(); return;
      }
      setByPath(path, v);
      if(inp.dataset.reproc){ const el=firstSel(); if(el){ await processImage(el); } }
      await afterEdit(path);
    });
  });
  root.querySelectorAll("[data-seg]").forEach(seg=>{
    seg.addEventListener("click", async e=>{
      const b = e.target.closest("button[data-v]"); if(!b) return;
      const path = seg.dataset.seg, v = b.dataset.v;
      [...seg.children].forEach(c=>c.setAttribute("aria-pressed", c===b));
      if(path==="doc.units"){ doc.units = v; renderRail(); drawStage(); updateStatus(); return; }
      setByPath(path, v);
      await afterEdit(path);
    });
  });
  root.querySelectorAll("[data-anchor]").forEach(a=>{
    a.addEventListener("click", e=>{
      const b = e.target.closest("button[data-v]"); if(!b) return;
      const el = firstSel(); if(!el) return;
      reanchor(el, b.dataset.v);
      renderRail(); drawStage();
    });
  });
  const rq = root.querySelector("[data-rotq]");
  if(rq) rq.addEventListener("click", e=>{
    const b = e.target.closest("button[data-v]"); if(!b) return;
    const el = firstSel(); if(!el) return;
    el.rot = parseFloat(b.dataset.v); renderRail(); drawStage();
  });
  root.querySelectorAll("[data-token]").forEach(t=>{
    t.addEventListener("click", ()=>{
      const el = firstSel(); if(!el || el.type!=="text") return;
      const ta = root.querySelector('textarea[data-bind="el.text"]');
      const pos = ta ? ta.selectionStart : el.text.length;
      el.text = el.text.slice(0,pos) + t.dataset.token + el.text.slice(pos);
      renderRail(); drawStage();
    });
  });
  root.querySelectorAll("#railTabs button").forEach(b=>{
    b.addEventListener("click", ()=>{ ui.panel = b.dataset.tab; renderRail(); syncNav(); });
  });
  root.querySelectorAll("[data-act]").forEach(b=> b.addEventListener("click", ()=>action(b.dataset.act)));
  if(root.querySelector("#roster")) renderRoster();
}

async function afterEdit(path){
  if(path.startsWith("doc.label")||path==="doc.pad"||path.startsWith("doc.lock")) reflowAll();
  const el = firstSel();
  if(el && path.startsWith("el.")){
    if(path==="el.w"||path==="el.h") setBox(el, boxOf(el));
    if(el.type==="image" && (path==="el.dpi"||path==="el.mode"||path==="el.invert"||path==="el.w"||path==="el.h")){
      await processImage(el);
    }
  }
  drawStage(); updateStatus(); renderLayers(); saveLocal();
  if(path.startsWith("doc.sheet")||path.startsWith("doc.laser")||path==="doc.pad"||path.startsWith("doc.label")){
    if(ui.panel==="batch"||ui.panel==="laser"||ui.panel==="export") renderRail();
  }
}

/* ------------------------------------------------------------- actions --- */
async function action(a){
  if(/^(cloud|pull|push|addperson|savepreset)/.test(a)) return cloudAction(a);
  const el = firstSel();
  switch(a){
    case "pickimg": {
      if(!el) return;
      const f = $("fileImg");
      f.value = "";
      f.onchange = async ()=>{ if(f.files[0]){ await ingestImage(el, f.files[0]); renderRail(); drawStage(); renderLayers(); toast("Graphic loaded and compressed"); } };
      f.click(); break;
    }
    case "clearimg": if(el){ el.raw=el.data=null; el.bytes=0; renderRail(); drawStage(); } break;
    case "fitcontent": {
      if(!el) return;
      const b = boxOf(el);
      if(el.type==="text"){
        const L = layoutText(el, {...b, w:safeRect().w}, rosterCtx(ui.previewIdx));
        setBox(el, {x:b.x, y:b.y, w:Math.min(safeRect().w, L.maxW*1.02), h:L.totH*1.05});
      } else if(el.type==="image" && el.srcW){
        setBox(el, {x:b.x, y:b.y, w:b.w, h:b.w*el.srcH/el.srcW});
      }
      renderRail(); drawStage(); break;
    }
    case "fillsafe": { if(!el) return; const s=safeRect(); setBox(el,{x:s.x,y:s.y,w:s.w,h:s.h}); renderRail(); drawStage(); break; }
    case "addrow": doc.roster.push({first:"",last:"",dept:""}); renderRail(); drawStage(); break;
    case "clearroster": doc.roster = doc.roster.map(()=>({first:"",last:"",dept:""})); renderRail(); drawStage(); break;
    case "gocloud": showPanel("cloud"); break;
    case "reset": if(confirm("Discard this design and start from the default layout?")) resetDoc(); break;
    case "loadcsv": {
      const rows = ($("csvBox").value||"").split("\n").map(r=>r.split(/[,\t]/).map(s=>s.trim()))
                     .filter(r=>r.join("").length);
      if(!rows.length){ toast("Nothing to load"); return; }
      doc.roster = rows.map(r=>({first:r[0]||"", last:r[1]||"", dept:r[2]||""}));
      ui.previewIdx = 0; renderRail(); drawStage(); toast(rows.length+" locks loaded"); break;
    }
    case "lighter": doc.laser.manual=false; doc.laser.trim=clamp(doc.laser.trim-1,-5,5); renderRail(); break;
    case "darker":  doc.laser.manual=false; doc.laser.trim=clamp(doc.laser.trim+1,-5,5); renderRail(); break;
    case "resettrim": doc.laser.manual=false; doc.laser.trim=0; renderRail(); break;
    case "testgrid": download("hl50e-test-grid.lbrn", testGrid(), "application/xml"); toast("Test grid saved"); break;
    case "exsvg": download(fileStem()+".svg", exportSVG(), "image/svg+xml"); toast("SVG saved"); break;
    case "exlbrn": download(fileStem()+".lbrn", exportLBRN(), "application/xml"); toast("LightBurn file saved"); break;
    case "savejson": download(fileStem()+".json", JSON.stringify(doc), "application/json"); toast("Project saved"); break;
    case "loadjson": {
      const f = $("fileJson"); f.value="";
      f.onchange = ()=>{
        const file = f.files[0]; if(!file) return;
        const fr = new FileReader();
        fr.onload = ()=>{ try{
            const d = JSON.parse(fr.result);
            if(!d.faces) throw new Error("shape");
            doc = d; ui.faceIdx=0; ui.sel=[]; ui.previewIdx=0;
            reflowAll(); buildAll(); fitView(); toast("Project opened");
          }catch(e){ toast("That file isn't a Markbench project"); } };
        fr.readAsText(file);
      };
      f.click(); break;
    }
  }
}
function fileStem(){
  return (doc.name||"markbench").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")
    + "-" + doc.roster.length + "up";
}

/* ------------------------------------------------------------- test grid --- */
function testGrid(){
  const base = laserEffective();
  const sp = [0.6,0.85,1.15,1.5].map(k=>Math.max(20,Math.round(base.speed*k/10)*10));
  const pw = [0.7,0.85,1.0,1.15].map(k=>clamp(Math.round(base.power*k),5,100));
  const cell=8, gap=2, lw=11, lh=6;
  const W = lw+4*(cell+gap), H = lh+4*(cell+gap);
  let s = `<?xml version="1.0" encoding="UTF-8"?>\n<LightBurnProject AppVersion="1.7.00" `
    + `DeviceName="Haas HL-50E" FormatVersion="1" MaterialHeight="0" MirrorX="False" MirrorY="False">\n`;
  let i=0;
  for(let r=0;r<4;r++) for(let c=0;c<4;c++)
    s += lbCut(i++, `${sp[c]} mm/s · ${pw[r]}%`,
      {speed:sp[c],power:pw[r],freq:base.freq,passes:base.passes,interval:base.interval}, false, true);
  const LBL = i;
  s += lbCut(LBL, "Labels", {speed:1000,power:Math.min(60,base.power),freq:base.freq,passes:1,interval:base.interval}, false, true);
  i=0;
  for(let r=0;r<4;r++) for(let c=0;c<4;c++){
    const x = lw+c*(cell+gap), y = lh+r*(cell+gap);
    s += `  <Shape Type="Rect" CutIndex="${i++}" W="${cell}" H="${cell}" Cr="0">\n`
       + `    <XForm>1 0 0 1 ${r3(x+cell/2)} ${r3(H-(y+cell/2))}</XForm>\n  </Shape>\n`;
  }
  for(let c=0;c<4;c++)
    s += `  <Shape Type="Text" CutIndex="${LBL}" Font="Arial" Str="${sp[c]}" H="2.5" LS="0" LnS="0" `
       + `Ah="1" Av="0" Bold="1" Italic="0" Weld="0" HasBackupPath="0">\n`
       + `    <XForm>1 0 0 1 ${r3(lw+c*(cell+gap)+cell/2)} ${r3(H-lh+1.6)}</XForm>\n  </Shape>\n`;
  for(let r=0;r<4;r++)
    s += `  <Shape Type="Text" CutIndex="${LBL}" Font="Arial" Str="${pw[r]}%" H="2.5" LS="0" LnS="0" `
       + `Ah="2" Av="0" Bold="1" Italic="0" Weld="0" HasBackupPath="0">\n`
       + `    <XForm>1 0 0 1 ${r3(lw-1.6)} ${r3(H-(lh+r*(cell+gap)+cell/2+1.2))}</XForm>\n  </Shape>\n`;
  return s + `</LightBurnProject>\n`;
}

/* --------------------------------------------------------------- left rail --- */
const PALETTE = [
  ["text","Text", `<path d="M4 6h16M12 6v13M8 19h8"/>`],
  ["image","Graphic", `<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.6"/><path d="M4 17l5-4 4 3 3-2 4 3"/>`],
  ["icon","Symbol", `<path d="M12 3L22 20H2z"/><path d="M12 10v4M12 17.2v.1"/>`],
  ["shape","Rule / bar", `<rect x="3" y="10" width="18" height="4" rx="1"/>`]
];
function buildPalette(){
  $("palette").innerHTML = PALETTE.map(([t,label,path])=>
    `<button class="btn" data-add="${t}"><svg viewBox="0 0 24 24">${path}</svg>${label}</button>`).join("");
  $("palette").querySelectorAll("[data-add]").forEach(b=>
    b.addEventListener("click", ()=>addElement(b.dataset.add)));
}
function addElement(type){
  const s = safeRect();
  const mk = {text:textEl, image:imageEl, icon:iconEl, shape:shapeEl}[type];
  const el = mk({ anchor:"mc", ox:0, oy:0 });
  if(type==="text"){ el.w = s.w*0.9; el.h = 0.18; el.text = "New text"; }
  if(type==="shape"){ el.w = s.w*0.9; el.h = 0.015; el.name = "Rule"; }
  if(type==="icon"){ el.w = Math.min(s.w*0.5, 0.5); el.h = el.w*0.88; }
  if(type==="image"){ el.w = Math.min(s.w*0.8, 0.9); el.h = el.w*0.4; }
  setBox(el, boxOf(el));
  face().els.push(el);
  ui.sel = [el.id];
  buildAll();
  ui.panel = "props"; renderRail(); syncNav();
  if(type==="image") action("pickimg");
}
function duplicateSel(){
  const add = [];
  selEls().forEach(e=>{
    const c = JSON.parse(JSON.stringify(e));
    c.id = uid("e_"); c.name = e.name+" copy"; c.ox += ui.grid*2; c.oy += ui.grid*2;
    setBox(c, boxOf(c)); add.push(c);
  });
  if(!add.length) return;
  face().els.push(...add);
  ui.sel = add.map(a=>a.id);
  buildAll();
}
function deleteSel(){
  if(!ui.sel.length) return;
  face().els = face().els.filter(e=>!ui.sel.includes(e.id));
  ui.sel = []; buildAll();
}
const LAYER_ICON = {
  text:`<path d="M4 6h16M12 6v13M8 19h8"/>`,
  image:`<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M4 17l5-4 4 3 3-2 4 3"/>`,
  icon:`<path d="M12 3L22 20H2z"/>`,
  shape:`<rect x="3" y="10" width="18" height="4" rx="1"/>`
};
function renderLayers(){
  const els = face().els;
  $("elCount").textContent = els.length;
  $("layers").innerHTML = els.length ? els.slice().reverse().map(el=>`
    <div class="layer" data-id="${el.id}" aria-selected="${ui.sel.includes(el.id)}">
      <svg class="ic" viewBox="0 0 24 24">${LAYER_ICON[el.type]||""}</svg>
      <span class="nm">${esc(el.name)}</span>
      <button class="mini" data-vis="${el.id}" data-off="${el.visible?0:1}" title="Show / hide">${el.visible?"◉":"○"}</button>
      <button class="mini" data-lk="${el.id}" data-off="${el.locked?0:1}" title="Lock">${el.locked?"▣":"▢"}</button>
      <button class="mini" data-up="${el.id}" title="Bring forward">▲</button>
      <button class="mini" data-dn="${el.id}" title="Send back">▼</button>
    </div>`).join("") : `<div class="empty">No elements on this face yet</div>`;
  $("layers").querySelectorAll(".layer").forEach(row=>{
    row.addEventListener("click", ev=>{
      if(ev.target.closest("button")) return;
      const id = row.dataset.id;
      ui.sel = ev.shiftKey ? (ui.sel.includes(id)?ui.sel.filter(x=>x!==id):[...ui.sel,id]) : [id];
      syncSelection(); drawStage();
    });
  });
  const els2 = face().els;
  $("layers").querySelectorAll("[data-vis]").forEach(b=>b.addEventListener("click",()=>{
    const el = els2.find(e=>e.id===b.dataset.vis); el.visible = !el.visible; buildAll(); }));
  $("layers").querySelectorAll("[data-lk]").forEach(b=>b.addEventListener("click",()=>{
    const el = els2.find(e=>e.id===b.dataset.lk); el.locked = !el.locked; buildAll(); }));
  $("layers").querySelectorAll("[data-up]").forEach(b=>b.addEventListener("click",()=>move(b.dataset.up, 1)));
  $("layers").querySelectorAll("[data-dn]").forEach(b=>b.addEventListener("click",()=>move(b.dataset.dn,-1)));
}
function move(id, dir){
  const a = face().els, i = a.findIndex(e=>e.id===id), j = i+dir;
  if(i<0||j<0||j>=a.length) return;
  [a[i],a[j]] = [a[j],a[i]];
  buildAll();
}

/* alignment ------------------------------------------------------------- */
function doAlign(kind){
  const sel = selEls(); if(!sel.length) return;
  const s = safeRect();
  let ref = s;
  if(sel.length>1){
    const bs = sel.map(boxOf);
    ref = { x:Math.min(...bs.map(b=>b.x)), y:Math.min(...bs.map(b=>b.y)) };
    ref.w = Math.max(...bs.map(b=>b.x+b.w)) - ref.x;
    ref.h = Math.max(...bs.map(b=>b.y+b.h)) - ref.y;
  }
  if(kind==="stack"){
    const bs = sel.map(e=>({e, b:boxOf(e)})).sort((p,q)=>p.b.y-q.b.y);
    const totH = bs.reduce((a,x)=>a+x.b.h,0);
    const gap = bs.length>1 ? (s.h-totH)/(bs.length-1) : 0;
    let y = s.y;
    bs.forEach(({e,b})=>{ setBox(e,{x:b.x,y,w:b.w,h:b.h}); y += b.h + gap; });
  } else if(kind==="fitwidth"){
    sel.forEach(e=>{ const b=boxOf(e); setBox(e,{x:s.x,y:b.y,w:s.w,h:b.h}); });
  } else sel.forEach(e=>{
    const b = boxOf(e);
    if(kind==="left") b.x = ref.x;
    if(kind==="right") b.x = ref.x+ref.w-b.w;
    if(kind==="hcenter") b.x = ref.x+(ref.w-b.w)/2;
    if(kind==="top") b.y = ref.y;
    if(kind==="bottom") b.y = ref.y+ref.h-b.h;
    if(kind==="vcenter") b.y = ref.y+(ref.h-b.h)/2;
    setBox(e,b);
  });
  buildAll();
}

/* ------------------------------------------------------------------ roster --- */
function renderRoster(){
  const host = $("roster"); if(!host) return;
  host.innerHTML = doc.roster.map((r,i)=>`
    <div class="rrow" data-i="${i}">

    if(doc.roster.length<=1) return;

/* ----------------------------------------------------------- local restore --- */
const STORE_KEY = "markbench.doc.v2";
let _saveT = null;
function saveLocal(){
  clearTimeout(_saveT);
  _saveT = setTimeout(()=>{
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(doc)); }catch(e){}
  }, 700);
}
function restoreLocal(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return false;
    const d = JSON.parse(raw);
    if(!d || !Array.isArray(d.faces) || !d.faces.length) return false;
    doc = d; reflowAll(); return true;
  }catch(e){ return false; }
}

  doc = defaultDoc(); ui.faceIdx=0; ui.sel=[]; ui.previewIdx=0;
  try{ localStorage.removeItem(STORE_KEY); }catch(e){}
