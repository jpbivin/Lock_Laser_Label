}

/* --------------------------------------------------------------------- boot */
function boot(){
  const restored = restoreLocal();
  buildPalette();
  buildAll();
  if(restored) setTimeout(()=>toast("Picked up where you left off"), 400);

  document.querySelectorAll("[data-align]").forEach(b=>
    b.addEventListener("click", ()=>doAlign(b.dataset.align)));
  $("btnDup").addEventListener("click", duplicateSel);
  $("btnDel").addEventListener("click", deleteSel);

  const tog = (id, key, fn) => {
    const b = $(id);
    const set = ()=> b.setAttribute("aria-pressed", ui[key]);
    b.addEventListener("click", ()=>{ ui[key] = !ui[key]; set(); (fn||drawStage)(); });
    set();
  };
  tog("tGrid","showGrid"); tog("tSnap","snap");
  tog("tLock","showLock"); tog("tRule","showRule", ()=>{ drawStage(); });
  $("tFit").addEventListener("click", fitView);

  document.querySelectorAll("#nav button").forEach(b=>b.addEventListener("click", ()=>{
    const n = b.dataset.nav;
    if(n==="stage"){ closeSheets(); return; }
    if(n==="build"){
      const open = $("leftrail").classList.contains("open");
      closeSheets();
      if(!open){ $("leftrail").classList.add("open"); $("scrim").classList.add("show"); }
      syncNav(); return;
    }
    const same = $("rightrail").classList.contains("open") && ui.panel===n;
    closeSheets();
    if(!same) showPanel(n);
  }));
  $("scrim").addEventListener("click", closeSheets);
  document.querySelectorAll(".sheetgrip").forEach(g=>g.addEventListener("click", closeSheets));
  $("btnExport").addEventListener("click", ()=>showPanel("export"));
  $("docName").style.cursor = "pointer";
  $("docName").title = "Rename";
  $("docName").addEventListener("click", ()=>{
    const n = prompt("Project name", doc.name);
    if(n && n.trim()){ doc.name = n.trim().slice(0,40); updateStatus(); saveLocal(); }
  });

  cloudBoot();

  const ro = new ResizeObserver(()=>drawStage());
  ro.observe($("stagewrap"));
  requestAnimationFrame(()=>{ fitView(); syncNav(); });
}
document.addEventListener("DOMContentLoaded", boot);
if(document.readyState!=="loading") boot();

/* ============================================================================
   MARKBENCH — cloud layer (Firebase / Firestore)

   Optional by design. With no config the app is exactly what it was: a single
   offline file. Configure it and the shop shares one library of designs,
   one people roster, and one set of proven laser recipes.

   Collections
     workspaces/{ws}/designs/{id}            metadata only  — cheap to list
     workspaces/{ws}/designs/{id}/body/main  the design payload
     workspaces/{ws}/people/{id}             shared roster
     workspaces/{ws}/presets/{id}            saved laser recipes
   ========================================================================== */

const FB_VERSION = "12.11.0";
const FB_CDN = "https://www.gstatic.com/firebasejs/" + FB_VERSION;

/* Commit your project's web config here and everyone who loads the page is
   connected with no setup. Leaving it blank makes the app ask for it once and
   remember it in the browser. A Firebase web apiKey is an identifier, not a
   secret — access is controlled by your Firestore rules. */
const FIREBASE_BUILTIN = {
  apiKey: "",
  authDomain: "",
  projectId: "",
  appId: "",
  storageBucket: "",
  messagingSenderId: "",
  workspace: "shop",
  authMode: "anonymous"        // "anonymous" | "google"
};

const CFG_KEY = "markbench.firebase";
const FS_DOC_LIMIT = 1048487;

const cloud = {
  state:"off",            // off | connecting | ready | error
  err:null, uid:null, who:"",
  fb:null, db:null, auth:null,
  designs:[], people:[], presets:[],
  curId:null, curName:"", busy:false, unsub:[]
};

function cloudCfg(){
  let saved = null;
  try{ saved = JSON.parse(localStorage.getItem(CFG_KEY) || "null"); }catch(e){}
  const c = Object.assign({}, FIREBASE_BUILTIN, saved || {});
  return c;
}
function cloudConfigured(c){ c = c || cloudCfg(); return !!(c.apiKey && c.projectId && c.appId); }
function saveCloudCfg(c){ try{ localStorage.setItem(CFG_KEY, JSON.stringify(c)); }catch(e){} }

/* single indirection point for the SDK import — lets the module be exercised
   without a network, and lets you swap in vendored SDK files if gstatic is blocked */
let fbImport = (url) => import(url);

async function cloudConnect(){
  const c = cloudCfg();
  if(!cloudConfigured(c)){ cloud.state="off"; renderCloud(); return; }
  cloud.state = "connecting"; cloud.err = null; renderCloud();
  try{
    const [app, auth, fs] = await Promise.all([
      fbImport(`${FB_CDN}/firebase-app.js`),
      fbImport(`${FB_CDN}/firebase-auth.js`),
      fbImport(`${FB_CDN}/firebase-firestore.js`)
    ]);
    cloud.fb = { app, auth, fs };
    const a = app.initializeApp({
      apiKey:c.apiKey, authDomain:c.authDomain, projectId:c.projectId,
      appId:c.appId, storageBucket:c.storageBucket, messagingSenderId:c.messagingSenderId
    });
    cloud.auth = auth.getAuth(a);
    cloud.db = fs.getFirestore(a);

    if(c.authMode === "google"){
      const cur = cloud.auth.currentUser;
      if(!cur) await auth.signInWithPopup(cloud.auth, new auth.GoogleAuthProvider());
    } else {
      await auth.signInAnonymously(cloud.auth);
    }
    const u = cloud.auth.currentUser;
    cloud.uid = u ? u.uid : null;
    cloud.who = u && u.email ? u.email : (u ? "device " + u.uid.slice(0,6) : "");
    cloud.state = "ready";
    cloudListen();
  }catch(e){
    cloud.state = "error";
    cloud.err = friendlyCloudError(e);
  }
  renderCloud();
}
function friendlyCloudError(e){
  const m = String(e && (e.code || e.message) || e);
  if(/Failed to fetch|dynamically imported|NetworkError|import/i.test(m))
    return "Couldn't load the Firebase SDK. Your network is probably blocking gstatic.com — "
         + "ask IT to allow it, or vendor the SDK files into the repo.";
  if(/auth\/operation-not-allowed/.test(m))
    return "Sign-in method isn't enabled. In the Firebase console open Authentication → Sign-in method "
         + "and enable " + (cloudCfg().authMode==="google" ? "Google." : "Anonymous.");
  if(/auth\/unauthorized-domain/.test(m))
    return "This domain isn't authorised. Add it under Authentication → Settings → Authorized domains.";
  if(/permission-denied|insufficient/i.test(m))
    return "Firestore rules rejected the request. Publish the rules from firestore.rules in the repo.";
  if(/popup/i.test(m)) return "The sign-in popup was closed or blocked.";
  return m;
}

function wsPath(){ return "workspaces/" + (cloudCfg().workspace || "shop"); }
function cloudListen(){
  const { collection, onSnapshot, query, orderBy, limit } = cloud.fb.fs;
  cloud.unsub.forEach(u=>{ try{u();}catch(e){} });
  cloud.unsub = [];
  const watch = (name, key, q) => cloud.unsub.push(onSnapshot(q,
    snap => { cloud[key] = snap.docs.map(d=>Object.assign({id:d.id}, d.data())); renderCloud(); },
    err  => { cloud.err = friendlyCloudError(err); renderCloud(); }));
  watch("designs","designs", query(collection(cloud.db, wsPath()+"/designs"), orderBy("updatedAt","desc"), limit(200)));
  watch("people","people",   query(collection(cloud.db, wsPath()+"/people"), orderBy("last"), limit(500)));
  watch("presets","presets", query(collection(cloud.db, wsPath()+"/presets"), orderBy("name"), limit(200)));
}
function cloudDisconnect(){
  cloud.unsub.forEach(u=>{ try{u();}catch(e){} });
  cloud.unsub = []; cloud.state = "off"; cloud.designs = cloud.people = cloud.presets = [];
  cloud.curId = null; renderCloud();
}

/* ---------------------------------------------------------------- designs --- */
function designPayload(){ return JSON.stringify(doc); }
function payloadSize(){ return new Blob([designPayload()]).size; }

async function cloudSaveDesign(asNew){
  if(cloud.state!=="ready" || cloud.busy) return;
  const body = designPayload(), size = new Blob([body]).size;
  if(size > FS_DOC_LIMIT - 4096){
    toast("Too big for one record (" + Math.round(size/1024) + " KB). Lower the graphic resolution.");
    return;
  }
  const name = (doc.name || "Untitled").slice(0,60);
  const { doc:dref, collection, setDoc, addDoc, serverTimestamp } = cloud.fb.fs;
  cloud.busy = true; renderCloud();
  try{
    const meta = { name, updatedBy: cloud.who || "unknown", updatedAt: serverTimestamp(),
                   faces: doc.faces.length, locks: doc.roster.length,
                   labelW: r3(doc.label.w*MM), labelH: r3(doc.label.h*MM), bytes: size };
    let id = asNew ? null : cloud.curId;
    if(id){
      await setDoc(dref(cloud.db, wsPath()+"/designs/"+id), meta, {merge:true});
    } else {
      const ref = await addDoc(collection(cloud.db, wsPath()+"/designs"), meta);
      id = ref.id;
    }
    await setDoc(dref(cloud.db, wsPath()+"/designs/"+id+"/body/main"), { data: body });
    cloud.curId = id; cloud.curName = name;
    toast(asNew ? "Saved as a new design" : "Saved to the shop library");
  }catch(e){ cloud.err = friendlyCloudError(e); toast("Save failed"); }
  cloud.busy = false; renderCloud();
}
async function cloudOpenDesign(id){
  if(cloud.state!=="ready") return;
  const { doc:dref, getDoc } = cloud.fb.fs;
  cloud.busy = true; renderCloud();
  try{
    const snap = await getDoc(dref(cloud.db, wsPath()+"/designs/"+id+"/body/main"));
    if(!snap.exists()) throw new Error("That design has no saved body.");
    const d = JSON.parse(snap.data().data);
    if(!d || !Array.isArray(d.faces) || !d.faces.length) throw new Error("bad payload");
    doc = d; ui.faceIdx = 0; ui.sel = []; ui.previewIdx = 0;
    cloud.curId = id;
    reflowAll(); buildAll(); fitView();
    toast("Opened " + (doc.name||"design"));
  }catch(e){ cloud.err = friendlyCloudError(e); toast("Couldn't open that one"); }
  cloud.busy = false; renderCloud();
}
async function cloudDeleteDesign(id, name){
  if(cloud.state!=="ready") return;
  if(!confirm("Delete \u201C"+name+"\u201D from the shop library? This affects everyone.")) return;
  const { doc:dref, deleteDoc } = cloud.fb.fs;
  try{
    await deleteDoc(dref(cloud.db, wsPath()+"/designs/"+id+"/body/main"));
    await deleteDoc(dref(cloud.db, wsPath()+"/designs/"+id));
    if(cloud.curId===id) cloud.curId = null;
    toast("Deleted");
  }catch(e){ cloud.err = friendlyCloudError(e); }
  renderCloud();
}

/* ----------------------------------------------------------------- people --- */
async function cloudPushRoster(){
  if(cloud.state!=="ready") return;
  const { collection, addDoc, serverTimestamp } = cloud.fb.fs;
  const rows = doc.roster.filter(r=>(r.first||r.last).trim());
  if(!rows.length){ toast("Nothing in this roster to share"); return; }
  const have = new Set(cloud.people.map(p=>(p.first+"|"+p.last).toLowerCase()));
  let n = 0;
  try{
    for(const r of rows){
      const k = ((r.first||"")+"|"+(r.last||"")).toLowerCase();
      if(have.has(k)) continue;
      await addDoc(collection(cloud.db, wsPath()+"/people"),
        { first:r.first||"", last:r.last||"", dept:r.dept||"", addedAt:serverTimestamp() });
      have.add(k); n++;
    }
    toast(n ? n+" added to the shared roster" : "All of them were already shared");
  }catch(e){ cloud.err = friendlyCloudError(e); renderCloud(); }
}
function cloudPullRoster(){
  if(!cloud.people.length){ toast("The shared roster is empty"); return; }
  doc.roster = cloud.people.map(p=>({first:p.first||"", last:p.last||"", dept:p.dept||""}));
  ui.previewIdx = 0;
  buildAll();
  toast(doc.roster.length + " locks loaded from the shared roster");
}
async function cloudAddPerson(){
  const first = (prompt("First name")||"").trim(); if(!first) return;
  const last  = (prompt("Last name")||"").trim();
  const dept  = (prompt("Department")||"").trim();
  const { collection, addDoc, serverTimestamp } = cloud.fb.fs;
  try{ await addDoc(collection(cloud.db, wsPath()+"/people"), {first,last,dept,addedAt:serverTimestamp()}); }
  catch(e){ cloud.err = friendlyCloudError(e); renderCloud(); }
}
async function cloudDeletePerson(id){
  const { doc:dref, deleteDoc } = cloud.fb.fs;
  try{ await deleteDoc(dref(cloud.db, wsPath()+"/people/"+id)); }
  catch(e){ cloud.err = friendlyCloudError(e); renderCloud(); }
}

async function cloudSavePreset(){

  const def = MATERIALS[doc.laser.material].name.split(" — ")[0];

function fmtWhen(ts){
  if(!ts) return "";
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  const diff = (Date.now()-d.getTime())/1000;
  if(diff < 60) return "just now";
  if(diff < 3600) return Math.floor(diff/60)+" min ago";
  if(diff < 86400) return Math.floor(diff/3600)+" h ago";
  return d.toLocaleDateString();
}

      </div>`).join("")}</div>`
      : `<div class="empty">Nothing saved yet. Save this design to start the library.</div>`}
  </div></section>

  <section class="sec"><h3>Shared roster <span class="tag">${cloud.people.length}</span></h3><div class="body">
    <div class="btnrow split">
      <button class="btn sm" data-act="pullroster">Load into batch</button>
      <button class="btn sm" data-act="pushroster">Share this batch</button>
    </div>
    ${cloud.people.length ? `<div class="layers" style="margin-top:8px;max-height:230px;overflow:auto">
      ${cloud.people.map(p=>`<div class="layer">
        <span class="nm">${esc(((p.first||"")+" "+(p.last||"")).trim()||"—")}
          <em style="display:block;font-style:normal;font-size:11px;color:var(--text-3)">${esc(p.dept||"")}</em></span>
        <button class="mini" data-delperson="${p.id}">✕</button></div>`).join("")}</div>`
      : `<div class="empty" style="margin-top:8px">No shared people yet</div>`}
    <div class="btnrow" style="margin-top:6px"><button class="btn sm ghost wide" data-act="addperson">Add a person</button></div>
  </div></section>

  <section class="sec"><h3>Proven recipes <span class="tag">${cloud.presets.length}</span></h3><div class="body">
    ${cloud.presets.length ? `<div class="layers">${cloud.presets.map(p=>`
      <div class="layer">
        <span class="nm">${esc(p.name)}
          <em style="display:block;font-style:normal;font-size:11px;color:var(--text-3)">
            ${p.speed} mm/s · ${p.power}% · ${p.freq} kHz · ${p.passes}p · ${esc(p.by||"")}</em></span>
        <button class="mini" data-preset="${p.id}" title="Apply">↧</button>
        <button class="mini" data-delpreset="${p.id}" title="Delete">✕</button>
      </div>`).join("")}</div>` : `<div class="empty">No saved recipes yet</div>`}
    <div class="btnrow" style="margin-top:8px">
      <button class="btn sm wide" data-act="savepreset">Save the current laser settings</button>
    </div>
    <p class="hint">Once someone dials in a material on this machine, save it here so nobody repeats
      the test grid.</p>
  </div></section>`;
}
function cfgField(label, key, c){
  return `<label class="fld"><span>${label}</span>
    <input type="text" id="cfg_${key}" value="${esc(c[key]||"")}" spellcheck="false" autocapitalize="off"></label>`;
}

function cloudBind(root){
  const g = id => root.querySelector("#"+id);
  root.querySelectorAll("[data-open]").forEach(b=>b.addEventListener("click",()=>cloudOpenDesign(b.dataset.open)));
  root.querySelectorAll("[data-deldesign]").forEach(b=>b.addEventListener("click",()=>cloudDeleteDesign(b.dataset.deldesign, b.dataset.name)));
  root.querySelectorAll("[data-delperson]").forEach(b=>b.addEventListener("click",()=>cloudDeletePerson(b.dataset.delperson)));
  root.querySelectorAll("[data-preset]").forEach(b=>b.addEventListener("click",()=>cloudApplyPreset(b.dataset.preset)));
  root.querySelectorAll("[data-delpreset]").forEach(b=>b.addEventListener("click",()=>cloudDeletePreset(b.dataset.delpreset)));
}

async function cloudAction(a){
  switch(a){
    case "cloudsave": {
      const keys = ["projectId","apiKey","appId","authDomain","workspace","messagingSenderId"];
      const c = cloudCfg();
      keys.forEach(k=>{ const el = $("cfg_"+k); if(el) c[k] = el.value.trim(); });
      const am = $("cfgAuthMode"); if(am) c.authMode = am.value;
      if(!c.authDomain && c.projectId) c.authDomain = c.projectId + ".firebaseapp.com";
      if(!c.storageBucket && c.projectId) c.storageBucket = c.projectId + ".appspot.com";
      if(!c.workspace) c.workspace = "shop";
      if(!cloudConfigured(c)){ toast("Project ID, API key and App ID are all required"); return; }
      saveCloudCfg(c); await cloudConnect(); break;
    }
    case "cloudpaste": {
      const raw = prompt("Paste the whole firebaseConfig object or JSON");
      if(!raw) return;
      try{
        const json = raw.replace(/^[^{]*/,"").replace(/[^}]*$/,"")
                        .replace(/([{,]\s*)([A-Za-z0-9_]+)\s*:/g,'$1"$2":')
                        .replace(/'/g,'"').replace(/,(\s*})/g,"$1");
        const o = JSON.parse(json);
        const c = Object.assign(cloudCfg(), o);
        saveCloudCfg(c); ui.panel="cloud"; renderRail();
        toast("Config read — press Connect");
      }catch(e){ toast("Couldn't read that config"); }
      break;
    }
    case "cloudoff": cloudDisconnect(); break;
    case "cloudput": await cloudSaveDesign(false); break;
    case "cloudputnew": await cloudSaveDesign(true); break;
    case "pullroster": cloudPullRoster(); break;
    case "pushroster": await cloudPushRoster(); break;
    case "addperson": await cloudAddPerson(); break;
    case "savepreset": await cloudSavePreset(); break;
  }
}

function cloudBoot(){
  renderCloudChip();
  const chip = $("cloudChip");
  if(chip) chip.addEventListener("click", ()=>showPanel("cloud"));
  if(cloudConfigured()) cloudConnect();
}

</script>
</body>
