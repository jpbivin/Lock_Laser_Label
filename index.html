<script>
/* ============================================================================
   MARKBENCH — core
   Canonical internal unit is the INCH. Everything converts at the boundary:
   the UI converts on display, the exporters convert to millimetres.
   ========================================================================== */
"use strict";

const BUILD = "2026.08.28-b";
const MM   = 25.4;
const CAPR = 0.716;              // cap height / em for the sans faces we ship with
const FONTS = ["Arial","Arial Black","Arial Narrow","Verdana","Tahoma",
               "Trebuchet MS","Segoe UI","Georgia","Times New Roman",
               "Courier New","Consolas","Impact"];

const uid = (p) => p + Math.random().toString(36).slice(2,9);
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
                          .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const r3 = n => (Math.round(n*1e4)/1e4);

/* ---------------------------------------------------------------- units --- */
const U = {
  get u(){ return doc.units; },
  toDisp(inches){ return doc.units==="in" ? inches : inches*MM; },
  fromDisp(v){ return doc.units==="in" ? v : v/MM; },
  step(){ return doc.units==="in" ? 0.005 : 0.1; },
  fmt(inches,d){ const v=U.toDisp(inches); return v.toFixed(d!==undefined?d:(doc.units==="in"?3:2)); },
  label(){ return doc.units==="in" ? "in" : "mm"; }
};

/* -------------------------------------------------------------- defaults --- */
function textEl(o){
  return Object.assign({
    id:uid("e_"), type:"text", name:"Text", anchor:"tc", ox:0, oy:0,
    w:1.0, h:0.16, rot:0, visible:true, locked:false, output:true,
    text:"Text", font:"Arial", bold:true, italic:false, caps:false,
    cap:0.12, track:0, lead:1.45, align:"center", valign:"middle",
    fit:"shrink", invert:false
  },o);
}
function imageEl(o){
  return Object.assign({
    id:uid("e_"), type:"image", name:"Graphic", anchor:"tc", ox:0, oy:0,
    w:0.6, h:0.3, rot:0, visible:true, locked:false, output:true,
    raw:null, data:null, bmp:null, srcW:0, srcH:0, bytes:0, isSvg:false,
    render:"trace",                       // trace = real outlines, raster = image fill
    paths:null, tracePts:0, traceRes:"", traceTol:0.3, traceMin:14,
    dpi:600, mode:"threshold", thresh:128, invert:false, keepAR:true, fit:"contain"
  },o);
}
function iconEl(o){
  return Object.assign({
    id:uid("e_"), type:"icon", name:"Symbol", anchor:"tc", ox:0, oy:0,
    w:0.4, h:0.36, rot:0, visible:true, locked:false, output:true,
    icon:"danger", invert:false
  },o);
}
function shapeEl(o){
  return Object.assign({
    id:uid("e_"), type:"shape", name:"Shape", anchor:"tc", ox:0, oy:0,
    w:1.0, h:0.02, rot:0, visible:true, locked:false, output:true,
    shape:"rect", filled:true, stroke:0.008, corner:0
  },o);
}

/* ------------------------------------------------------------- machines --- */
const MACHINE_TEMPLATES = {
  hl50e:{ name:"Haas HL-50E", watts:50, source:"q", lens:110, lenses:[110,150],
          speedMax:4000, powerMax:100, freqMin:20, freqMax:80, freqDefault:40,
          pulseMin:0, pulseMax:0, intervalDefault:0.02, minInterval:0.005,
          notes:"Q-switched fiber. Pulse width is fixed; frequency is your heat control." },
  fiber20:{ name:"20 W fiber (Q-switched)", watts:20, source:"q", lens:110, lenses:[110,150,175],
          speedMax:3000, powerMax:100, freqMin:20, freqMax:60, freqDefault:30,
          pulseMin:0, pulseMax:0, intervalDefault:0.02, minInterval:0.005,
          notes:"Half the power of a 50 W — expect roughly half the speed for the same mark." },
  fiber30:{ name:"30 W fiber (Q-switched)", watts:30, source:"q", lens:110, lenses:[110,150,175],
          speedMax:4000, powerMax:100, freqMin:20, freqMax:80, freqDefault:35,
          pulseMin:0, pulseMax:0, intervalDefault:0.02, minInterval:0.005, notes:"" },
  mopa60:{ name:"60 W MOPA fiber", watts:60, source:"mopa", lens:110, lenses:[110,150,175,200],
          speedMax:7000, powerMax:100, freqMin:1, freqMax:400, freqDefault:60,
          pulseMin:2, pulseMax:500, intervalDefault:0.015, minInterval:0.003,
          notes:"Adjustable pulse width. Short pulses at high frequency give colour on stainless; long pulses cut deeper." },
  co2_60:{ name:"60 W CO2", watts:60, source:"co2", lens:0, lenses:[0],
          speedMax:1000, powerMax:100, freqMin:1, freqMax:50, freqDefault:20,
          pulseMin:0, pulseMax:0, intervalDefault:0.08, minInterval:0.02,
          notes:"For organics and coated metals — not bare metal. Frequency here is PPI, not kHz." },
  custom:{ name:"Custom machine", watts:50, source:"q", lens:110, lenses:[110,150],
          speedMax:4000, powerMax:100, freqMin:1, freqMax:200, freqDefault:30,
          pulseMin:0, pulseMax:0, intervalDefault:0.02, minInterval:0.005, notes:"" }
};
const SOURCE_NAMES = { q:"Q-switched fiber", mopa:"MOPA fiber", co2:"CO2", other:"Other" };

function makeMachine(tmplKey){
  const t = MACHINE_TEMPLATES[tmplKey] || MACHINE_TEMPLATES.custom;
  return Object.assign({ id:uid("m_") }, JSON.parse(JSON.stringify(t)));
}

/* ------------------------------------------------------------- materials --- */
const MATERIAL_SEEDS = [
  { id:"anodized", name:"Anodized aluminium — white mark", speed:1200, power:45, freq:40,
    interval:0.02, passes:1, fill:"scan", pulse:0, proven:false,
    note:"Anodising is microns thick. Ablate it, don't engrave it. Brown halo or burnt-looking letters means go faster before you drop power." },
  { id:"alumBare", name:"Bare / mill aluminium — dark", speed:400, power:85, freq:30,
    interval:0.012, passes:2, fill:"scan", pulse:0, proven:false,
    note:"Bare aluminium resists contrast. Two lighter passes read darker than one heavy pass and warp the body less." },
  { id:"ssAnneal", name:"Stainless — anneal (black, no depth)", speed:150, power:35, freq:60,
    interval:0.010, passes:1, fill:"scan", pulse:0, proven:false,
    note:"Annealing wants heat, not removal. High frequency, slow speed, 1–2 mm out of focus. Grey instead of black means slow down before adding power." },
  { id:"ssEngrave", name:"Stainless / carbon steel — engrave", speed:600, power:90, freq:30,
    interval:0.020, passes:2, fill:"scan", pulse:0, proven:false,
    note:"In focus, mid frequency. Past 90 % power, add a pass instead." },
  { id:"painted", name:"Powder-coated or painted steel", speed:1500, power:40, freq:40,
    interval:0.030, passes:1, fill:"scan", pulse:0, proven:false,
    note:"You're removing coating only. Stop when the substrate shows — extra dose scorches a ring around the letters." },
  { id:"brass", name:"Brass / bronze", speed:400, power:80, freq:25,
    interval:0.020, passes:1, fill:"scan", pulse:0, proven:false,
    note:"Reflective but forgiving. Lower frequency gives a cleaner, deeper cut." },
  { id:"thermo", name:"Thermoplastic lock body", speed:1800, power:22, freq:30,
    interval:0.030, passes:1, fill:"scan", pulse:0, proven:false,
    note:"Plastic foams rather than cuts. Too much dose melts the edge and closes the letters up. Ventilate." },
  { id:"laminate", name:"Laminate / engraving stock", speed:2000, power:20, freq:30,
    interval:0.030, passes:1, fill:"scan", pulse:0, proven:false,
    note:"Very light dose. If the core colour isn't showing, add a pass instead of power." },
  { id:"titanium", name:"Titanium — colour anneal", speed:500, power:30, freq:60,
    interval:0.015, passes:1, fill:"scan", pulse:0, proven:false,
    note:"Colour is almost pure dose. Small speed changes swing the colour — move one trim step at a time." }
];
function seedMaterials(machineId){
  return MATERIAL_SEEDS.map(m => Object.assign({}, m, {machineId:machineId||null}));
}

function defaultDoc(){
  const d = {
    v:2, units:"in", name:"Lockout lock",
    lock:{ w:1.55, h:2.05, corner:0.20 },
    label:{ w:1.25, h:1.70, corner:0.06, dx:0, dy:0 },
    pad:0.08,
    faces:[], roster:[{first:"Dana",last:"Whitfield",dept:"Maintenance"},
                      {first:"",last:"",dept:""}],
    sheet:{ order:"pairs" },
    lbImage:"embed",
    bedOrigin:"bl",                 // where the machine's 0,0 sits: bl or tl
    textOut:"outline",              // outline = traced geometry, live = LightBurn text
    lbTextNudge:0,
    fixture:{ rows:2, cols:3, pitchX:1.75, pitchY:2.40,
              originX:0.90, originY:0.85, stagger:0,
              order:"row", field:110/MM, batch:0,
              moved:{}, skipped:{}, rot:{},
              manual:false, assign:{} },
    laser:{ materialId:"anodized", trim:0, manual:false,
            speed:0, power:0, freq:0, interval:0, passes:1, fill:"scan", pulse:0 }
  };
  const m = makeMachine("hl50e");
  d.machines = [m];
  d.machineId = m.id;
  d.materials = seedMaterials(m.id);
  d.fixture.field = m.lens/MM;
  d.faces = [ seedOwnershipFace(d), seedDangerFace(d) ];
  return d;
}

/* -------------------------------------------------- machine / material --- */
function activeMachine(){
  return (doc.machines||[]).find(m=>m.id===doc.machineId) || (doc.machines||[])[0] || MACHINE_TEMPLATES.hl50e;
}
function machineMaterials(){
  const mid = doc.machineId;
  return (doc.materials||[]).filter(m => !m.machineId || m.machineId===mid);
}
function activeMaterial(){
  const list = doc.materials||[];
  return list.find(m=>m.id===doc.laser.materialId) || machineMaterials()[0] || list[0] || MATERIAL_SEEDS[0];
}
function clampToMachine(p){
  const M = activeMachine();
  return { speed: clamp(Math.round(p.speed), 1, M.speedMax||99999),
           power: clamp(Math.round(p.power), 1, M.powerMax||100),
           freq:  clamp(p.freq, M.freqMin||1, M.freqMax||1000),
           interval: Math.max(M.minInterval||0.001, p.interval),
           passes: clamp(Math.round(p.passes), 1, 50),
           pulse: M.source==="mopa" ? clamp(p.pulse||M.pulseMin||2, M.pulseMin||1, M.pulseMax||500) : 0 };
}

function seedOwnershipFace(d){
  const W = d.label.w - 2*d.pad;
  return { id:uid("f_"), name:"Side 1", els:[
    textEl({name:"Property of", text:"PROPERTY OF", cap:0.085, w:W, h:0.10,
            anchor:"tc", ox:0, oy:0.02, track:80}),
    shapeEl({name:"Rule", shape:"rect", filled:true, w:W, h:0.012,
             anchor:"tc", ox:0, oy:0.155}),
    textEl({name:"First name", text:"{first}", cap:0.19, w:W, h:0.24,
            anchor:"tc", ox:0, oy:0.215}),
    textEl({name:"Last name", text:"{last}", cap:0.19, w:W, h:0.24,
            anchor:"tc", ox:0, oy:0.48}),
    textEl({name:"Department", text:"{dept}", cap:0.095, w:W, h:0.13,
            anchor:"bc", ox:0, oy:-0.30, caps:true, track:40}),
    imageEl({name:"Company logo", w:0.85, h:0.30, anchor:"bc", ox:0, oy:-0.02})
  ]};
}
function seedDangerFace(d){
  const W = d.label.w - 2*d.pad;
  return { id:uid("f_"), name:"Side 2", els:[
    iconEl({name:"Danger symbol", icon:"danger", w:0.46, h:0.40,
            anchor:"tc", ox:0, oy:0.01}),
    shapeEl({name:"Headline bar", shape:"rect", filled:true, w:W, h:0.17,
             anchor:"tc", ox:0, oy:0.46}),
    textEl({name:"Headline", text:"DANGER", cap:0.115, w:W, h:0.17,
            anchor:"tc", ox:0, oy:0.46, invert:true, track:60}),
    textEl({name:"Line 1", text:"DO NOT OPERATE", cap:0.085, w:W, h:0.11,
            anchor:"tc", ox:0, oy:0.68}),
    textEl({name:"Line 2", text:"EQUIPMENT LOCKED OUT", cap:0.062, w:W, h:0.09,
            anchor:"tc", ox:0, oy:0.82}),
    textEl({name:"Line 3", text:"REMOVED BY OWNER ONLY", cap:0.062, w:W, h:0.09,
            anchor:"tc", ox:0, oy:0.94}),
    textEl({name:"Standard", text:"OSHA 1910.147", cap:0.050, w:W, h:0.07,
            anchor:"bc", ox:0, oy:-0.01, track:70})
  ]};
}

function migrateDoc(d){
  if(!d || typeof d!=="object") return d;
  d.sheet = d.sheet || {};
  if(!d.sheet.order) d.sheet.order = "pairs";
  if(!d.lbImage) d.lbImage = "embed";
  if(!d.textOut) d.textOut = "outline";
  if(!d.bedOrigin) d.bedOrigin = "bl";
  if(d.lbTextNudge === undefined) d.lbTextNudge = 0;
  (d.faces||[]).forEach(f=>(f.els||[]).forEach(el=>{
    if(el.type!=="image") return;
    if(!el.render) el.render = el.paths && el.paths.length ? "trace" : "raster";
    if(el.traceTol===undefined) el.traceTol = 0.3;
    if(el.traceMin===undefined) el.traceMin = 14;
  }));
  if(!d.fixture){
    // old projects stored a column count and edge gaps; convert to true pitch
    const cols = Math.max(1, Math.round(d.sheet.cols || 3));
    const gx = d.sheet.gapX !== undefined ? d.sheet.gapX : 0.2;
    const gy = d.sheet.gapY !== undefined ? d.sheet.gapY : 0.2;
    const lw = (d.label && d.label.w) || 1.25, lh = (d.label && d.label.h) || 1.7;
    const field = d.sheet.field !== undefined ? d.sheet.field : 110/MM;
    const pitchX = lw + gx, pitchY = lh + gy;
    const rows = Math.max(1, Math.floor(((field>0?field:pitchY*3) + 1e-6) / pitchY)) || 1;
    d.fixture = { rows, cols, pitchX, pitchY,
                  originX: pitchX/2 + 0.1, originY: pitchY/2 + 0.1,
                  stagger:0, order:"row", field, batch:0, moved:{}, skipped:{}, rot:{},
                  manual:false, assign:{} };
  }
  /* machines + material library arrived after the first releases */
  if(!Array.isArray(d.machines) || !d.machines.length){
    const m = makeMachine("hl50e");
    if(d.sheet && d.sheet.field) m.lens = Math.round(d.sheet.field*MM) || 110;
    d.machines = [m]; d.machineId = m.id;
  }
  if(!d.machineId || !d.machines.some(m=>m.id===d.machineId)) d.machineId = d.machines[0].id;
  d.machines.forEach(m=>{
    const t = MACHINE_TEMPLATES.custom;
    Object.keys(t).forEach(k=>{ if(m[k]===undefined) m[k]=t[k]; });
    if(!Array.isArray(m.lenses) || !m.lenses.length) m.lenses = [m.lens||110];
  });
  if(!Array.isArray(d.materials) || !d.materials.length) d.materials = seedMaterials(d.machineId);
  (d.faces||[]).forEach(f=>(f.els||[]).forEach(el=>{ if(el.output===undefined) el.output = true; }));
  d.materials.forEach(m=>{ if(!m.id) m.id = uid("mat_"); if(m.fill===undefined) m.fill="scan";
                           if(m.passes===undefined) m.passes=1; if(m.pulse===undefined) m.pulse=0; });
  d.laser = d.laser || {};
  if(!d.laser.materialId){
    d.laser.materialId = d.laser.material && d.materials.some(m=>m.id===d.laser.material)
      ? d.laser.material : (d.materials[0] && d.materials[0].id);
  }
  delete d.laser.material;
  if(d.laser.pulse===undefined) d.laser.pulse = 0;

  const f = d.fixture;
  f.moved = f.moved || {}; f.skipped = f.skipped || {}; f.rot = f.rot || {};
  f.assign = f.assign || {}; if(f.manual === undefined) f.manual = false;
  Object.keys(f.assign).forEach(k=>{                 // was {slot, face}; now just the side
    const v = f.assign[k];
    if(v && typeof v === "object"){
      if(v.face === null || v.face === undefined) delete f.assign[k];
      else f.assign[k] = v.face;
    }
  });
  Object.keys(f.assign).forEach(k=>{            // an earlier build stored {slot, face}
    const v = f.assign[k];
    if(v && typeof v === "object") f.assign[k] = (v.face===null||v.face===undefined) ? undefined : v.face;
    if(f.assign[k] === undefined) delete f.assign[k];
  });
  if(f.batch === undefined) f.batch = 0;
  if(f.stagger === undefined) f.stagger = 0;
  if(f.field === undefined) f.field = 110/MM;
  return d;
}

let doc = defaultDoc();

/* ------------------------------------------------------------- geometry --- */
function safeRect(){
  return { x:doc.pad, y:doc.pad,
           w:Math.max(0.02, doc.label.w-2*doc.pad),
           h:Math.max(0.02, doc.label.h-2*doc.pad) };
}
const AX = {l:0, c:.5, r:1};
const AY = {t:0, m:.5, b:1};
function anchorF(a){ return { fy:AY[a[0]], fx:AX[a[1]] }; }

function boxOf(el){
  const s = safeRect(), {fx,fy} = anchorF(el.anchor);
  return { x: s.x + fx*s.w + el.ox - fx*el.w,
           y: s.y + fy*s.h + el.oy - fy*el.h,
           w: el.w, h: el.h };
}
function setBox(el, b, noClamp){
  const s = safeRect();
  /* Something that only records an existing stamp is allowed to sit outside the
     safe area — the padding rule exists to protect what we mark, not what's
     already there. It still has to stay on the stock. */
  const lim = (el && el.output === false)
    ? { x:0, y:0, w:doc.label.w, h:doc.label.h } : s;
  let w = clamp(b.w, 0.02, lim.w), h = clamp(b.h, 0.005, lim.h);
  let x = b.x, y = b.y;
  if(!noClamp){
    x = clamp(x, lim.x, lim.x + lim.w - w);
    y = clamp(y, lim.y, lim.y + lim.h - h);
  }
  const {fx,fy} = anchorF(el.anchor);
  el.w = w; el.h = h;
  el.ox = x + fx*w - (s.x + fx*s.w);
  el.oy = y + fy*h - (s.y + fy*s.h);
}
function reanchor(el, a){
  const b = boxOf(el); el.anchor = a; setBox(el, b);
}
/* keeps every element legal after the label or padding changes */
function reflowAll(){
  doc.faces.forEach(f => f.els.forEach(el => setBox(el, boxOf(el))));
}

/* ----------------------------------------------------------- text engine --- */
const _mc = document.createElement("canvas").getContext("2d");
function fontStr(el, px){
  return (el.italic?"italic ":"") + (el.bold?"700 ":"400 ") + px + "px " +
         "'" + el.font + "', Arial, sans-serif";
}
function textW(str, el, fs){
  if(!str) return 0;
  _mc.font = fontStr(el, 1000);
  const base = _mc.measureText(str).width/1000*fs;
  const extra = (str.length-1) * fs * (el.track||0)/1000;
  return base + Math.max(0, extra);
}
function fillTokens(str, ctx){
  return String(str).replace(/\{(\w+)\}/g, (m,k)=>{
    const v = ctx[k.toLowerCase()];
    return v===undefined ? m : String(v);
  });
}
function wrapLine(str, el, fs, maxW){
  const words = str.split(/\s+/).filter(Boolean);
  if(!words.length) return [""];
  const out=[]; let cur=words[0];
  for(let i=1;i<words.length;i++){
    const t = cur+" "+words[i];
    if(textW(t,el,fs) <= maxW) cur = t; else { out.push(cur); cur = words[i]; }
  }
  out.push(cur);
  return out;
}
function layoutText(el, box, ctx){
  let raw = fillTokens(el.text ?? "", ctx || {});
  if(el.caps) raw = raw.toUpperCase();
  const paras = raw.split("\n");
  const wrap = el.fit==="wrap" || el.fit==="wrapshrink";
  const shrink = el.fit==="shrink" || el.fit==="wrapshrink";
  let cap = el.cap;
  let lines = paras;

  for(let pass=0; pass<4; pass++){
    const fs = cap/CAPR;
    lines = wrap ? paras.flatMap(p => wrapLine(p, el, fs, box.w)) : paras;
    const maxW = Math.max(0.0001, ...lines.map(l=>textW(l,el,fs)));
    const step = cap*el.lead;
    const totH = (lines.length-1)*step + cap;
    if(!shrink) break;
    const k = Math.min(1, box.w/maxW, box.h/totH);
    if(k > 0.999) break;
    cap = cap*k*0.999;
    if(!wrap) break;
  }
  const fs = cap/CAPR, step = cap*el.lead;
  const totH = (lines.length-1)*step + cap;
  const widths = lines.map(l=>textW(l,el,fs));
  let top = box.y;
  if(el.valign==="middle") top = box.y + (box.h-totH)/2;
  else if(el.valign==="bottom") top = box.y + box.h - totH;
  return { lines, widths, cap, fs, step, totH, top,
           maxW: Math.max(0, ...widths) };
}

/* ------------------------------------------------------------------ icons --- */
function ringCircle(cx,cy,r,n){
  const out=[]; n=n||44;
  for(let i=0;i<n;i++){ const a=i/n*Math.PI*2; out.push([cx+Math.cos(a)*r, cy+Math.sin(a)*r]); }
  return out;
}
const ICONS = {
  /* every icon returns closed rings inside the unit square, y down */
  danger(){
    const A=[.5,.03], B=[.97,.94], C=[.03,.94];
    const d=(p,q)=>Math.hypot(p[0]-q[0],p[1]-q[1]);
    const a=d(B,C), b=d(A,C), c=d(A,B), per=a+b+c;
    const ix=(a*A[0]+b*B[0]+c*C[0])/per, iy=(a*A[1]+b*B[1]+c*C[1])/per;
    const area=Math.abs((B[0]-A[0])*(C[1]-A[1])-(C[0]-A[0])*(B[1]-A[1]))/2, r=area/(per/2);
    const k=(r-0.105)/r;
    const inner=[A,B,C].map(p=>[ix+(p[0]-ix)*k, iy+(p[1]-iy)*k]);
    const iTop=inner[0][1], iBot=inner[1][1], hIn=iBot-iTop;
    const bt=iTop+hIn*0.30, bb=iTop+hIn*0.68, wt=0.062, wb=wt*0.58;
    const bar=[[ix-wt,bt],[ix+wt,bt],[ix+wb,bb],[ix-wb,bb]];
    const dT=iTop+hIn*0.78, dB=iTop+hIn*0.92, dr=Math.min(wt,(dB-dT)/2);
    const dcy=(dT+dB)/2;
    return [[A,B,C], inner, bar, ringCircle(ix,dcy,dr,20)];
  },
  bolt(){
    return [[[.56,.02],[.20,.55],[.44,.55],[.34,.98],[.80,.40],[.53,.40],[.72,.02]]];
  },
  padlock(){
    const body=[[.10,.44],[.90,.44],[.90,.98],[.10,.98]];
    const so=ringCircle(.5,.44,.30,36).filter(p=>p[1]<=.45);
    const si=ringCircle(.5,.44,.18,36).filter(p=>p[1]<=.45).reverse();
    const shackle=[[.20,.45],...so.slice().sort((p,q)=>p[0]-q[0]).reverse(),[.80,.45],[.68,.45],
                   ...si.slice().sort((p,q)=>p[0]-q[0]),[.32,.45]];
    const kh=ringCircle(.5,.62,.085,20);
    const stem=[[.455,.62],[.545,.62],[.575,.86],[.425,.86]];
    return [body, kh, stem, shackle];
  },
  exclaim(){
    const outer=ringCircle(.5,.5,.48,48);
    const inner=ringCircle(.5,.5,.375,48).reverse();
    const bt=.22, bb=.60, wt=.062, wb=.040;
    const bar=[[.5-wt,bt],[.5+wt,bt],[.5+wb,bb],[.5-wb,bb]];
    return [outer, inner, bar, ringCircle(.5,.72,.058,20)];
  },
  arcflash(){
    const rays=[];
    for(let i=0;i<12;i++){
      const a=i/12*Math.PI*2, a2=a+0.13;
      rays.push([[.5+Math.cos(a)*.14,.5+Math.sin(a)*.14],
                 [.5+Math.cos(a)*.49,.5+Math.sin(a)*.49],
                 [.5+Math.cos(a2)*.49,.5+Math.sin(a2)*.49],
                 [.5+Math.cos(a2)*.14,.5+Math.sin(a2)*.14]]);
    }
    return [ringCircle(.5,.5,.13,28), ...rays];
  },
  tag(){
    const o=[[.06,.24],[.68,.24],[.94,.5],[.68,.76],[.06,.76]];
    const i=[[.14,.31],[.65,.31],[.83,.5],[.65,.69],[.14,.69]].reverse();
    return [o,i,ringCircle(.24,.5,.055,20)];
  }
};
const ICON_NAMES = { danger:"Danger triangle", bolt:"Lightning bolt", padlock:"Padlock",
                     exclaim:"Exclamation circle", arcflash:"Arc flash burst", tag:"Tag outline" };

/* ------------------------------------------------- element -> primitives --- */
function rotPt(p, cx, cy, deg){
  if(!deg) return p;
  const a = deg*Math.PI/180, s=Math.sin(a), c=Math.cos(a);
  const dx=p[0]-cx, dy=p[1]-cy;
  return [cx+dx*c-dy*s, cy+dx*s+dy*c];
}
function fitInto(box, ar){                 // ar = w/h of the content
  if(!ar || !isFinite(ar)) return box;
  const bAR = box.w/box.h;
  if(ar > bAR){ const h = box.w/ar; return {x:box.x, y:box.y+(box.h-h)/2, w:box.w, h}; }
  const w = box.h*ar; return {x:box.x+(box.w-w)/2, y:box.y, w, h:box.h};
}

function elPrims(el, ctx){
  if(el.visible === false) return [];
  const box = boxOf(el);
  const ref = el.output === false;
  const rc = [box.x+box.w/2, box.y+box.h/2];
  const rot = el.rot||0;
  const out = [];

  if(el.type==="text"){
    const L = layoutText(el, box, ctx);
    L.lines.forEach((ln,i)=>{
      if(!ln) return;
      const w = L.widths[i];
      let x = box.x;
      if(el.align==="center") x = box.x + (box.w-w)/2;
      else if(el.align==="right") x = box.x + box.w - w;
      out.push({ t:"text", x, y:L.top + L.cap + i*L.step, str:ln, cap:L.cap, fs:L.fs,
                 w, font:el.font, bold:el.bold, italic:el.italic, track:el.track,
                 invert:el.invert, rot, rc });
    });
  }
  else if(el.type==="shape"){
    if(el.shape==="ellipse"){
      const ring = ringCircle(0,0,0.5,56).map(p=>[box.x+box.w/2+p[0]*box.w, box.y+box.h/2+p[1]*box.h]);
      out.push({ t:"poly", rings:[ring.map(p=>rotPt(p,rc[0],rc[1],rot))],
                 filled:el.filled, stroke:el.stroke });
    } else {
      out.push({ t:"rect", x:box.x, y:box.y, w:box.w, h:box.h, rx:el.corner||0,
                 filled:el.filled, stroke:el.stroke, rot, rc });
    }
  }
  else if(el.type==="icon"){
    const rings = (ICONS[el.icon]||ICONS.danger)();
    let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
    rings.forEach(r=>r.forEach(p=>{minX=Math.min(minX,p[0]);maxX=Math.max(maxX,p[0]);
                                   minY=Math.min(minY,p[1]);maxY=Math.max(maxY,p[1]);}));
    const uw=Math.max(1e-6,maxX-minX), uh=Math.max(1e-6,maxY-minY);
    const f = fitInto(box, uw/uh);
    const mapped = rings.map(r=>r.map(p=>rotPt(
      [f.x + (p[0]-minX)/uw*f.w, f.y + (p[1]-minY)/uh*f.h], rc[0], rc[1], rot)));
    out.push({ t:"poly", rings:mapped, filled:true, invert:el.invert });
  }
  else if(el.type==="image"){
    const ar = el.srcW && el.srcH ? el.srcW/el.srcH : null;
    const f = el.fit==="stretch" || !ar ? box : fitInto(box, ar);
    if(el.render==="trace" && el.paths && el.paths.length){
      const rings = el.paths.map(r => r.map(p =>
        rotPt([f.x + p[0]*f.w, f.y + p[1]*f.h], rc[0], rc[1], rot)));
      out.push({ t:"poly", rings, filled:true, traced:true });
    }
    else if(el.data) out.push({ t:"img", x:f.x, y:f.y, w:f.w, h:f.h, href:el.data,
                                bmp:el.bmp, rot, rc });
    else out.push({ t:"ph", x:box.x, y:box.y, w:box.w, h:box.h, label:el.name||"GRAPHIC" });
  }
  if(ref) out.forEach(p => { p.noOut = true; });
  return out;
}

function facePrims(face, ctx){
  const out = [];
  face.els.forEach(el => out.push(...elPrims(el, ctx)));
  return out;
}
function rosterCtx(i){
  const r = doc.roster[i] || {};
  return { first:r.first||"", last:r.last||"", dept:r.dept||"",
           n:String(i+1), total:String(doc.roster.length),
           date:new Date().toISOString().slice(0,10) };
}

/* Rotate a rendered face about a point. A prim is (axis-aligned geometry,
   angle, centre); adding a rotation moves the centre and sums the angle, with
   the stored coordinates carried along by the same delta. */
function rotatePrims(prims, C, deg){
  if(!deg) return prims;
  const spin = (p) => rotPt(p, C[0], C[1], deg);
  return prims.map(p=>{
    if(p.t==="poly"){
      return Object.assign({}, p, { rings: p.rings.map(r => r.map(spin)) });
    }
    const oldRc = p.rc || [0,0];
    const newRc = spin(oldRc);
    const dx = newRc[0]-oldRc[0], dy = newRc[1]-oldRc[1];
    const q = Object.assign({}, p, { rot:(p.rot||0)+deg, rc:newRc });
    q.x = p.x + dx; q.y = p.y + dy;
    return q;
  });
}
function facePrims2(f){
  const printable = f.prims.filter(p => !p.noOut);
  let prims = doc.textOut==="outline" ? outlineText(printable) : printable;
  const deg = f.cell && f.cell.rot;
  if(deg) prims = rotatePrims(prims, [doc.label.w/2, doc.label.h/2], deg);
  return prims;
}

/* --------------------------------------------------------- SVG serialiser --- */
function primSvg(p, ox, oy, k, opt){
  const X = v => r3((v+ox)*k), Y = v => r3((v+oy)*k);
  if(p.noOut){
    if(opt.forExport) return "";                 // never reaches the laser
    return refSvg(p, X, Y, k, opt);
  }
  const rot = p.rot ? ` transform="rotate(${r3(p.rot)} ${X(p.rc[0])} ${Y(p.rc[1])})"` : "";
  const ink = opt.ink || "#111111";
  if(p.t==="ph"){
    if(opt.forExport) return "";
    return `<rect x="${X(p.x)}" y="${Y(p.y)}" width="${r3(p.w*k)}" height="${r3(p.h*k)}"`
      + ` fill="none" stroke="${opt.guide}" stroke-width="${r3(0.008*k)}" stroke-dasharray="${r3(.03*k)} ${r3(.02*k)}"/>`
      + `<text x="${X(p.x+p.w/2)}" y="${Y(p.y+p.h/2)}" fill="${opt.guide}"`
      + ` font-family="Arial" font-size="${r3(Math.min(p.h*0.34,p.w*0.20,0.09)*k)}"`
      + ` text-anchor="middle" dominant-baseline="central">${esc(p.label)}</text>`;
  }
  if(p.t==="text"){
    const ls = p.track ? ` letter-spacing="${r3(p.fs*p.track/1000*k)}"` : "";
    return `<text x="${X(p.x)}" y="${Y(p.y)}" font-family="${esc(p.font)}, Arial, sans-serif"`
      + ` font-size="${r3(p.fs*k)}" font-weight="${p.bold?700:400}"`
      + (p.italic?` font-style="italic"`:"") + ls
      + ` fill="${p.invert ? (opt.knock||"#FFFFFF") : ink}" xml:space="preserve"${rot}>`
      + `${esc(p.str)}</text>`;
  }
  if(p.t==="rect"){
    const style = p.filled ? `fill="${ink}"`
      : `fill="none" stroke="${ink}" stroke-width="${r3((p.stroke||0.008)*k)}"`;
    return `<rect x="${X(p.x)}" y="${Y(p.y)}" width="${r3(p.w*k)}" height="${r3(p.h*k)}"`
      + ` rx="${r3((p.rx||0)*k)}" ${style}${rot}/>`;
  }
  if(p.t==="poly"){
    const d = p.rings.map(r=>"M"+r.map(v=>X(v[0])+","+Y(v[1])).join("L")+"Z").join("");
    return p.filled===false
      ? `<path d="${d}" fill="none" stroke="${ink}" stroke-width="${r3((p.stroke||0.008)*k)}"/>`
      : `<path d="${d}" fill="${p.invert?(opt.knock||"#FFFFFF"):ink}" fill-rule="evenodd"/>`;
  }
  if(p.t==="img"){
    return `<image x="${X(p.x)}" y="${Y(p.y)}" width="${r3(p.w*k)}" height="${r3(p.h*k)}"`
      + ` preserveAspectRatio="none" href="${p.href}" xlink:href="${p.href}"${rot}/>`;
  }
  return "";
}

/* -------------------------------------------------------------- fixture --- */
const cellKey = (r,c) => r+"_"+c;

function cellCenter(r,c){
  const f = doc.fixture;
  const mv = (f.moved||{})[cellKey(r,c)] || {dx:0, dy:0};
  return { x: f.originX + c*f.pitchX + (r%2 ? f.stagger : 0) + mv.dx,
           y: f.originY + r*f.pitchY + mv.dy };
}
/* every cell in the array, in the order the machine will fill them */
function fixtureCells(){
  const f = doc.fixture, out = [];
  const rows = Math.max(1, Math.round(f.rows)), cols = Math.max(1, Math.round(f.cols));
  const n = rows*cols;
  for(let i=0;i<n;i++){
    let r, c;
    if(f.order==="col"){ c = Math.floor(i/rows); r = i%rows; }
    else if(f.order==="serp"){ r = Math.floor(i/cols); const k = i%cols; c = (r%2) ? cols-1-k : k; }
    else { r = Math.floor(i/cols); c = i%cols; }
    const p = cellCenter(r,c);
    out.push({ r, c, x:p.x, y:p.y, skip: !!(f.skipped||{})[cellKey(r,c)],
               rot: (f.rot||{})[cellKey(r,c)] || 0 });
  }
  return out;
}
function fixtureCapacity(){ return fixtureCells().filter(c=>!c.skip).length; }

/* the working area: the lens field, or a box around whatever the array needs */
function fieldRect(){
  const f = doc.fixture;
  if(f.field > 0) return { x:0, y:0, w:f.field, h:f.field };
  const cells = fixtureCells();
  const hw = doc.label.w/2, hh = doc.label.h/2, m = 0.12;
  const xs = cells.map(c=>c.x), ys = cells.map(c=>c.y);
  const x0 = Math.min(...xs)-hw-m, y0 = Math.min(...ys)-hh-m;
  return { x:x0, y:y0,
           w: Math.max(...xs)+hw+m-x0, h: Math.max(...ys)+hh+m-y0 };
}
/* Internally the bed is measured downward from its top-left, because that is
   how SVG and the editor work. The machine is usually zeroed at the bottom-left,
   so every bed coordinate the user sees or types goes through here. */
function bedFlipped(){ return doc.bedOrigin !== "tl"; }
function toBedY(yDownInches){
  return bedFlipped() ? fieldRect().h - yDownInches : yDownInches;
}
function fromBedY(bedYInches){
  return bedFlipped() ? fieldRect().h - bedYInches : bedYInches;
}

function centerArray(){
  const f = doc.fixture, fr = fieldRect();
  const span = (rc,pitch) => (Math.max(1,Math.round(rc))-1)*pitch;
  f.originX = fr.x + (fr.w - span(f.cols,f.pitchX) - Math.abs(f.stagger))/2
              + (f.stagger<0 ? Math.abs(f.stagger) : 0);
  f.originY = fr.y + (fr.h - span(f.rows,f.pitchY))/2;
}
/* how many rows/columns of this pitch actually fit the field */
function fitArrayToField(){
  const f = doc.fixture;
  if(f.field <= 0) return;
  const usableX = f.field - doc.label.w, usableY = f.field - doc.label.h;
  f.cols = Math.max(1, Math.floor(usableX/f.pitchX) + 1);
  f.rows = Math.max(1, Math.floor(usableY/f.pitchY) + 1);
  centerArray();
}
function fixtureOversize(){
  const fr = fieldRect(), out = [];
  if(doc.fixture.field <= 0) return out;
  fixtureCells().forEach(c=>{
    if(c.skip) return;
    const quarter = (c.rot===90 || c.rot===270);
    const hw = (quarter ? doc.label.h : doc.label.w)/2;
    const hh = (quarter ? doc.label.w : doc.label.h)/2;
    if(c.x-hw < -1e-6 || c.y-hh < -1e-6 ||
       c.x+hw > fr.w+1e-6 || c.y+hh > fr.h+1e-6)
      out.push(c.r+1+"×"+(c.c+1));
  });
  return out;
}
function batchCount(){ return sheetFaces().batches; }
function allFaceCount(){
  const o = doc.sheet.order;
  const per = (o==="pairs"||o==="grouped") ? doc.faces.length : 1;
  return doc.roster.length * per;
}

/* Reference geometry: shown, never marked. Drawn as a dashed ghost so it can't
   be mistaken for artwork. */
function refSvg(p, X, Y, k, opt){
  const col = opt.ref || "#A855C7";
  const dash = ` stroke="${col}" stroke-width="${r3(0.006*k)}" fill="none"`
             + ` stroke-dasharray="${r3(0.022*k)} ${r3(0.014*k)}"`;
  const rot = p.rot ? ` transform="rotate(${r3(p.rot)} ${X(p.rc[0])} ${Y(p.rc[1])})"` : "";
  if(p.t==="text"){
    const ls = p.track ? ` letter-spacing="${r3(p.fs*p.track/1000*k)}"` : "";
    return `<text x="${X(p.x)}" y="${Y(p.y)}" font-family="${esc(p.font)}, Arial, sans-serif"`
      + ` font-size="${r3(p.fs*k)}" font-weight="${p.bold?700:400}"`
      + (p.italic?` font-style="italic"`:"") + ls
      + ` fill="${col}" fill-opacity="0.45" xml:space="preserve"${rot}>${esc(p.str)}</text>`;
  }
  if(p.t==="rect")
    return `<rect x="${X(p.x)}" y="${Y(p.y)}" width="${r3(p.w*k)}" height="${r3(p.h*k)}"`
      + ` rx="${r3((p.rx||0)*k)}"${dash}${rot}/>`;
  if(p.t==="poly"){
    const d = p.rings.map(r=>"M"+r.map(v=>X(v[0])+","+Y(v[1])).join("L")+"Z").join("");
    return `<path d="${d}"${dash}/>`;
  }
  if(p.t==="img" || p.t==="ph")
    return `<rect x="${X(p.x)}" y="${Y(p.y)}" width="${r3(p.w*k)}" height="${r3(p.h*k)}"${dash}${rot}/>`;
  return "";
}

/* ---------------------------------------------------------------- sheet --- */
function sheetFaces(batchIdx){
  const F = doc.fixture;
  const cells = fixtureCells().filter(c=>!c.skip);

  const make = (fi, ri) => {
    const f = doc.faces[fi]; if(!f) return null;
    const r = doc.roster[ri] || {};
    const nm = (r.first||r.last) ? (r.first+" "+r.last).trim() : ("Lock "+(ri+1));
    return { name:nm+" · "+f.name, short:nm, faceName:f.name, faceIdx:fi, lockIdx:ri,
             prims:facePrims(f, rosterCtx(ri)) };
  };
  const place = (list, batches, b, capacity, total) => {
    const fr = fieldRect();
    list.forEach(f=>{
      f.ox = f.cell.x - doc.label.w/2 - fr.x;
      f.oy = f.cell.y - doc.label.h/2 - fr.y;
    });
    return { faces:list, total, capacity, batches, batch:b,
             w:fr.w, h:fr.h, field:fr };
  };

  /* ---- hand assignment: each pocket simply names a side ----
     Cells carrying the same side take locks in fill order, so "left column
     marks side 1, right column marks side 2" gives lock 1 both its sides. ---- */
  if(F.manual){
    const seats = cells
      .map(c => ({ cell:c, face:(F.assign||{})[cellKey(c.r,c.c)] }))
      .filter(e => e.face !== null && e.face !== undefined && doc.faces[e.face]);

    const seen = {};
    seats.forEach(e => { e.slot = (seen[e.face] = (seen[e.face]===undefined ? 0 : seen[e.face]+1)); });

    const slots = Math.max(1, ...Object.values(seen).map(v=>v+1));
    const batches = Math.max(1, Math.ceil(doc.roster.length / slots));
    const b = clamp(batchIdx===undefined ? (F.batch||0) : batchIdx, 0, batches-1);

    const out = [];
    seats.forEach(e=>{
      const ri = b*slots + e.slot;
      if(ri >= doc.roster.length) return;
      const f = make(e.face, ri);
      if(f){ f.cell = e.cell; out.push(f); }
    });
    return place(out, batches, b, seats.length, doc.roster.length * Object.keys(seen).length);
  }

  /* ---- automatic: walk the roster in the chosen face order ---- */
  const all = [];
  const order = doc.sheet.order;
  const push = (fi, ri) => { const f = make(fi, ri); if(f) all.push(f); };
  if(order==="pairs"){
    doc.roster.forEach((_,ri)=> doc.faces.forEach((_,fi)=> push(fi,ri)));
  } else if(order==="grouped"){
    doc.faces.forEach((_,fi)=> doc.roster.forEach((_,ri)=> push(fi,ri)));
  } else {
    const fi = parseInt(String(order).replace("face",""))||0;
    doc.roster.forEach((_,ri)=> push(fi,ri));
  }
  const cap = cells.length || 1;
  const batches = Math.max(1, Math.ceil(all.length/cap));
  const b = clamp(batchIdx===undefined ? (F.batch||0) : batchIdx, 0, batches-1);
  const slice = all.slice(b*cap, b*cap + cap);
  slice.forEach((f,i)=>{ f.cell = cells[i]; });
  return place(slice, batches, b, cap, all.length);
}

/* Copy whatever the automatic layout is doing into the grid, so hand editing
   starts from something familiar. */
function seedAssignment(){
  const F = doc.fixture;
  const nf = Math.max(1, doc.faces.length);
  F.assign = {};
  fixtureCells().filter(c=>!c.skip).forEach((c,i)=>{
    F.assign[cellKey(c.r,c.c)] = i % nf;
  });
}
function assignByColumn(){
  const F = doc.fixture, nf = Math.max(1, doc.faces.length);
  F.assign = {};
  fixtureCells().filter(c=>!c.skip).forEach(c=>{ F.assign[cellKey(c.r,c.c)] = c.c % nf; });
}
function assignByRow(){
  const F = doc.fixture, nf = Math.max(1, doc.faces.length);
  F.assign = {};
  fixtureCells().filter(c=>!c.skip).forEach(c=>{ F.assign[cellKey(c.r,c.c)] = c.r % nf; });
}
function assignAll(fi){
  const F = doc.fixture;
  F.assign = {};
  fixtureCells().filter(c=>!c.skip).forEach(c=>{ F.assign[cellKey(c.r,c.c)] = fi; });
}
/* one tap moves a pocket to the next side, then to empty */
function cycleCell(key){
  const F = doc.fixture, n = doc.faces.length;
  const cur = F.assign[key];
  if(cur === null || cur === undefined) F.assign[key] = 0;
  else if(cur + 1 < n) F.assign[key] = cur + 1;
  else delete F.assign[key];
}

function exportStamp(){
  const n = doc.textOut==="outline" ? "outlines" : "live LightBurn text";
  const ascii = t => String(t).replace(/[\u2010-\u2015]/g,"-").replace(/[\u00b7\u2022]/g,"|")
                              .replace(/[^\x20-\x7E]/g,"");
  return ascii(`Markbench ${BUILD} | text as ${n} | ${activeMachine().name} | `
       + `${activeMaterial().name} | ${new Date().toISOString().slice(0,16).replace("T"," ")}`);
}

function exportSVG(){
  const sh = sheetFaces(), k = MM;
  const opt = { forExport:true, ink:"#000000", knock:"#FFFFFF", guide:"#BBBBBB" };
  let s = `<?xml version="1.0" encoding="UTF-8"?>\n`
    + `<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" `
    + `width="${r3(sh.w*k)}mm" height="${r3(sh.h*k)}mm" `
    + `viewBox="0 0 ${r3(sh.w*k)} ${r3(sh.h*k)}">\n`
    + `<title>${esc(doc.name)} — ${sh.faces.length} faces`
    + (sh.batches>1 ? ` — batch ${sh.batch+1} of ${sh.batches}` : "") + `</title>\n`
    + `<desc>${esc(exportStamp())}</desc>\n`;
  sh.faces.forEach((f,i)=>{
    const prims = facePrims2(f);
    s += `<g id="${esc("face_"+(i+1)+"_"+f.name.replace(/[^A-Za-z0-9]+/g,"_"))}">\n`;
    prims.forEach(p=>{ const t = primSvg(p, f.ox, f.oy, k, opt); if(t) s += "  "+t+"\n"; });
    s += `</g>\n`;
  });
  return s + `</svg>\n`;
}

/* ---------------------------------------------------- LightBurn serialiser --- */
function lbCut(idx, name, p, isCut, output){
  const M = (typeof activeMachine==="function") ? activeMachine() : {source:"q"};
  const qp = M.source==="mopa" ? Math.round(p.pulse||M.pulseMin||2) : 200;
  return `  <CutSetting type="${isCut?"Cut":"Scan"}">
    <index Value="${idx}"/>
    <name Value="${esc(name)}"/>
    <maxPower Value="${p.power}"/>
    <maxPower2 Value="${p.power}"/>
    <speed Value="${p.speed}"/>
    <frequency Value="${Math.round(p.freq*1000)}"/>
    <numPasses Value="${p.passes}"/>
    <interval Value="${p.interval}"/>
    <QPulseWidth Value="${qp}"/>
    <doOutput Value="${output?1:0}"/>
    <priority Value="${idx}"/>
    <tabCount Value="1"/>
    <tabCountMax Value="1"/>
  </CutSetting>\n`;
}
function lbXForm(cx, cy, rot){
  if(!rot) return `1 0 0 1 ${r3(cx)} ${r3(cy)}`;
  const a = -rot*Math.PI/180, s=Math.sin(a), c=Math.cos(a);
  return `${r3(c)} ${r3(s)} ${r3(-s)} ${r3(c)} ${r3(cx)} ${r3(cy)}`;
}
function lbXFormScaled(cx, cy, rot, sx, sy){
  const a = -(rot||0)*Math.PI/180, si = Math.sin(a), co = Math.cos(a);
  return `${r3(sx*co)} ${r3(sx*si)} ${r3(-sy*si)} ${r3(sy*co)} ${r3(cx)} ${r3(cy)}`;
}
function primLbrn(p, ox, oy, H, pad){
  const k = MM;
  const X = v => (v+ox)*k, Y = v => H - (v+oy)*k;
  if(p.t==="ph") return "";
  if(p.t==="text"){
    /* Measured against LightBurn 1.7.08: the XForm point is the TOP of the
       character box, not the baseline. Send the cap top, plus a user nudge. */
    const yTop = Y(p.y - p.cap) + (doc.lbTextNudge||0);
    return `${pad}<Shape Type="Text" CutIndex="0" Font="${esc(p.font)}" Str="${esc(p.str)}" `
      + `H="${r3(p.cap*k)}" LS="${r3(p.fs*k*(p.track||0)/1000)}" LnS="0" Ah="0" Av="0" `
      + `Bold="${p.bold?1:0}" Italic="${p.italic?1:0}" Weld="0" HasBackupPath="0">\n`
      + `${pad}  <XForm>${lbXForm(X(p.x), yTop, p.rot)}</XForm>\n${pad}</Shape>\n`;
  }
  if(p.t==="rect"){
    return `${pad}<Shape Type="Rect" CutIndex="0" W="${r3(p.w*k)}" H="${r3(p.h*k)}" `
      + `Cr="${r3((p.rx||0)*k)}">\n`
      + `${pad}  <XForm>${lbXForm(X(p.x+p.w/2), Y(p.y+p.h/2), p.rot)}</XForm>\n${pad}</Shape>\n`;
  }
  if(p.t==="poly"){
    let v="", pr="", n=0;
    p.rings.forEach(r=>{
      const st=n;
      r.forEach(q=>{ v += `V${r3(X(q[0]))} ${r3(Y(q[1]))}`; n++; });
      for(let i=st;i<n;i++) pr += `L${i} ${i+1<n?i+1:st}`;
    });
    return `${pad}<Shape Type="Path" CutIndex="0">\n${pad}  <XForm>1 0 0 1 0 0</XForm>\n`
      + `${pad}  <VertList>${v}</VertList>\n${pad}  <PrimList>${pr}</PrimList>\n${pad}</Shape>\n`;
  }
  if(p.t==="img"){
    if(p.bmp && p.bmp.data && doc.lbImage !== "guide"){
      const sx = (p.w*k)/p.bmp.w, sy = (p.h*k)/p.bmp.h;
      return `${pad}<Shape Type="Bitmap" CutIndex="0" W="${p.bmp.w}" H="${p.bmp.h}" `
        + `File="" Dither="0" Data="${p.bmp.data}">\n`
        + `${pad}  <XForm>${lbXFormScaled(X(p.x+p.w/2), Y(p.y+p.h/2), p.rot, sx, sy)}</XForm>\n`
        + `${pad}</Shape>\n`;
    }
    return `${pad}<Shape Type="Rect" CutIndex="1" W="${r3(p.w*k)}" H="${r3(p.h*k)}" Cr="0">\n`
      + `${pad}  <XForm>${lbXForm(X(p.x+p.w/2), Y(p.y+p.h/2), p.rot)}</XForm>\n${pad}</Shape>\n`;
  }
  return "";
}
function exportLBRN(){
  const sh = sheetFaces(), H = sh.h*MM, p = laserEffective();
  const stamp = exportStamp();
  let s = `<?xml version="1.0" encoding="UTF-8"?>\n`
    + `<LightBurnProject AppVersion="1.7.00" DeviceName="${esc(activeMachine().name)}" FormatVersion="1" `
    + `MaterialHeight="0" MirrorX="False" MirrorY="False">\n`;
  s += lbCut(0, activeMaterial().name.slice(0,30), p, doc.laser.fill==="cut", true);
  s += lbCut(1, "Guide — no output", {power:10,speed:1000,freq:30,passes:1,interval:0.05}, true, false);
  sh.faces.forEach(f=>{
    s += `  <Shape Type="Group">\n    <XForm>1 0 0 1 0 0</XForm>\n    <Children>\n`;
    facePrims2(f).forEach(q=> s += primLbrn(q, f.ox, f.oy, H, "      "));
    s += `    </Children>\n  </Shape>\n`;
  });
  return s + `</LightBurnProject>\n<!-- ${esc(stamp)} -->\n`;
}

/* Overall extents of everything that will be marked, reported the way
   LightBurn reports a selection: centre and size, Y measured up from the bed. */
/* Axis-aligned extents of one primitive, honouring its rotation. */
function primBBox(p){
  if(p.t==="ph") return null;
  if(p.t==="poly"){
    const xs=[], ys=[];
    p.rings.forEach(r=>r.forEach(v=>{xs.push(v[0]);ys.push(v[1]);}));
    if(!xs.length) return null;
    return [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)];
  }
  let a,b,c,d;
  if(p.t==="text"){ a=p.x; c=p.x+p.w; b=p.y-p.cap; d=p.y; }
  else { a=p.x; b=p.y; c=p.x+p.w; d=p.y+p.h; }
  if(!p.rot) return [a,b,c,d];
  const rc = p.rc || [(a+c)/2, (b+d)/2];
  const pts = [[a,b],[c,b],[c,d],[a,d]].map(q => rotPt(q, rc[0], rc[1], p.rot));
  const xs = pts.map(q=>q[0]), ys = pts.map(q=>q[1]);
  return [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)];
}

function sheetBounds(){
  const sh = sheetFaces(), fr = fieldRect();
  let x0=1e9, y0=1e9, x1=-1e9, y1=-1e9;
  sh.faces.forEach(f=>{
    facePrims2(f).forEach(p=>{
      const bb = primBBox(p); if(!bb) return;
      const [a,b,c,d] = bb;
      x0=Math.min(x0,a+f.ox); x1=Math.max(x1,c+f.ox);
      y0=Math.min(y0,b+f.oy); y1=Math.max(y1,d+f.oy);
    });
  });
  if(x0>x1) return null;
  const w=(x1-x0)*MM, h=(y1-y0)*MM;
  const cyDown = (y0+y1)/2;
  return { w, h,
           cx: (x0+x1)/2*MM,
           cy: toBedY(cyDown)*MM,          // as the machine reports it
           cyDown,
           top: toBedY(y0)*MM, bottom: toBedY(y1)*MM,
           left: x0*MM, right: x1*MM };
}
/* shift the whole array so the marked area centres on a machine coordinate */
function placeArrayAt(bedX, bedY){
  const b = sheetBounds(); if(!b) return;
  doc.fixture.originX += (bedX - b.cx)/MM;
  doc.fixture.originY += fromBedY(bedY/MM) - b.cyDown;
}

/* ------------------------------------------------------------ fit checker --- */
function refCount(){
  let n = 0;
  doc.faces.forEach(f => f.els.forEach(e => { if(e.output === false && e.visible !== false) n++; }));
  return n;
}
function fitIssues(){
  const s = safeRect(), out = [];
  const t = 0.002;
  doc.faces.forEach(f=>{
    f.els.forEach(el=>{
      if(el.visible===false || el.output===false) return;
      elPrims(el, rosterCtx(0)).forEach(p=>{
        let x0,y0,x1,y1;
        if(p.t==="text"){ x0=p.x; x1=p.x+p.w; y0=p.y-p.cap; y1=p.y + (/[gjpqyQ,;]/.test(p.str)?p.cap*0.22:0); }
        else if(p.t==="poly"){
          const xs=[],ys=[]; p.rings.forEach(r=>r.forEach(v=>{xs.push(v[0]);ys.push(v[1]);}));
          x0=Math.min(...xs);x1=Math.max(...xs);y0=Math.min(...ys);y1=Math.max(...ys);
        } else { x0=p.x;y0=p.y;x1=p.x+p.w;y1=p.y+p.h; }
        if(x0<s.x-t||y0<s.y-t||x1>s.x+s.w+t||y1>s.y+s.h+t){
          const nm = f.name+" · "+el.name;
          if(!out.includes(nm)) out.push(nm);
        }
      });
    });
  });
  return out;
}

/* ============================================================================
   MARKBENCH — stage editor
   The stage is one SVG whose viewBox IS the world, measured in inches.
   Screen scale = pixel width / viewBox width, so a handle drawn at 9/scale
   inches is always 9 px no matter the zoom.
   ========================================================================== */

const ui = {
  faceIdx:0, previewIdx:0, sel:[],
  view:{x:-0.4, y:-0.4, w:3}, scale:1,
  showGrid:true, snap:true, showLock:true, showRule:true,
  stageMode:"label", showNums:true, fixSel:null,
  grid:1/16,
  panel:"stage",
  drag:null, guides:[]
};

const stage = document.getElementById("stage");
/* touch needs a bigger grab area than a mouse does */
const coarse = () => window.matchMedia && window.matchMedia("(pointer:coarse)").matches;
const HANDLE_PX = () => coarse() ? 13 : 9;
const GRAB_PX   = () => coarse() ? 15 : 9;
const face = () => doc.faces[ui.faceIdx] || doc.faces[0];
const selEls = () => face().els.filter(e => ui.sel.includes(e.id));
const firstSel = () => selEls()[0] || null;

function lockOrigin(){
  return { x:(doc.label.w-doc.lock.w)/2 - doc.label.dx,
           y:(doc.label.h-doc.lock.h)/2 - doc.label.dy };
}
function worldBounds(){
  const lo = lockOrigin();
  const x0 = Math.min(0, lo.x), y0 = Math.min(0, lo.y);
  const x1 = Math.max(doc.label.w, lo.x+doc.lock.w);
  const y1 = Math.max(doc.label.h, lo.y+doc.lock.h);
  return {x:x0, y:y0, w:x1-x0, h:y1-y0};
}
function fitView(){
  const r = stage.getBoundingClientRect();
  if(!r.width || !r.height) return;
  const b = ui.stageMode==="fixture"
    ? (()=>{ const f = fieldRect(); return {x:0, y:0, w:f.w, h:f.h}; })()
    : worldBounds();
  const padTop = ui.showRule ? 0.34 : 0.18, padL = ui.showRule ? 0.30 : 0.18;
  const bw = b.w + padL + 0.18, bh = b.h + padTop + 0.18;
  const z = Math.min(r.width/bw, r.height/bh) * 0.94;
  const vw = r.width/z, vh = r.height/z;
  ui.view = { x: b.x - padL - (vw-bw)/2, y: b.y - padTop - (vh-bh)/2, w: vw };
  drawStage();
}
function viewRect(){
  const r = stage.getBoundingClientRect();
  const h = r.height ? ui.view.w * r.height / r.width : ui.view.w;
  return { x:ui.view.x, y:ui.view.y, w:ui.view.w, h };
}
function toWorld(ev){
  const r = stage.getBoundingClientRect(), v = viewRect();
  return { x: v.x + (ev.clientX-r.left)/r.width*v.w,
           y: v.y + (ev.clientY-r.top)/r.height*v.h };
}

/* ------------------------------------------------------------------ draw --- */
function drawStage(){
  if(ui.stageMode==="fixture") return drawFixture();
  const r = stage.getBoundingClientRect();
  if(!r.width) return;
  const v = viewRect();
  ui.scale = r.width / v.w;                       // px per inch
  const S = ui.scale, px = n => n/S;              // n screen px -> inches
  stage.setAttribute("viewBox", `${r3(v.x)} ${r3(v.y)} ${r3(v.w)} ${r3(v.h)}`);
  stage.setAttribute("preserveAspectRatio","none");

  const lo = lockOrigin(), sf = safeRect(), L = doc.label;
  let s = "";

  /* --- lock body --- */
  if(ui.showLock){
    s += `<rect x="${r3(lo.x)}" y="${r3(lo.y)}" width="${r3(doc.lock.w)}" height="${r3(doc.lock.h)}"`
      + ` rx="${r3(doc.lock.corner)}" fill="#20262F" stroke="#39424F" stroke-width="1" vector-effect="non-scaling-stroke"/>`;
  }
  /* --- label stock --- */
  s += `<rect x="0" y="0" width="${r3(L.w)}" height="${r3(L.h)}" rx="${r3(L.corner)}"`
    + ` fill="var(--paper)" stroke="#9A968B" stroke-width="1" vector-effect="non-scaling-stroke"/>`;

  /* --- grid --- */
  if(ui.showGrid && ui.grid*S >= 4){
    let g = "";
    for(let x=ui.grid; x<L.w-1e-6; x+=ui.grid){
      const major = Math.abs((x/0.125)-Math.round(x/0.125))<1e-6;
      g += `<line x1="${r3(x)}" y1="0" x2="${r3(x)}" y2="${r3(L.h)}" stroke="#C9C6BB" stroke-width="${major?1:0.6}" opacity="${major?.85:.5}" vector-effect="non-scaling-stroke"/>`;
    }
    for(let y=ui.grid; y<L.h-1e-6; y+=ui.grid){
      const major = Math.abs((y/0.125)-Math.round(y/0.125))<1e-6;
      g += `<line x1="0" y1="${r3(y)}" x2="${r3(L.w)}" y2="${r3(y)}" stroke="#C9C6BB" stroke-width="${major?1:0.6}" opacity="${major?.85:.5}" vector-effect="non-scaling-stroke"/>`;
    }
    s += `<g clip-path="url(#lblclip)">${g}</g>`;
  }
  /* --- safe area --- */
  s += `<rect x="${r3(sf.x)}" y="${r3(sf.y)}" width="${r3(sf.w)}" height="${r3(sf.h)}"`
    + ` fill="none" stroke="#D8452E" stroke-width="1" stroke-dasharray="4 3" opacity=".65" vector-effect="non-scaling-stroke"/>`;

  /* --- artwork --- */
  const opt = { forExport:false, ink:"#14181F", knock:"var(--paper)", guide:"#A8A49A", ref:"#A855C7" };
  const ctx = rosterCtx(ui.previewIdx);
  s += `<g clip-path="url(#lblclip)">`;
  face().els.forEach(el=>{ elPrims(el, ctx).forEach(p=>{ s += primSvg(p, 0, 0, 1, opt); }); });
  s += `</g>`;

  /* --- selection --- */
  selEls().forEach(el=>{
    const b = boxOf(el), c=[b.x+b.w/2,b.y+b.h/2], rot=el.rot||0;
    const tr = rot?` transform="rotate(${r3(rot)} ${r3(c[0])} ${r3(c[1])})"`:"";
    s += `<rect x="${r3(b.x)}" y="${r3(b.y)}" width="${r3(b.w)}" height="${r3(b.h)}"`
      + ` fill="none" stroke="${el.output===false?"#A855C7":"var(--cyan)"}" stroke-width="1.4"`
      + ` vector-effect="non-scaling-stroke"${tr}/>`;
  });
  const one = ui.sel.length===1 ? firstSel() : null;
  if(one && !one.locked){
    const b = boxOf(one), c=[b.x+b.w/2,b.y+b.h/2], hs = px(HANDLE_PX());
    const tr = one.rot?` transform="rotate(${r3(one.rot)} ${r3(c[0])} ${r3(c[1])})"`:"";
    s += `<g${tr}>`;
    HANDLES.forEach(h=>{
      const p = handlePt(b,h);
      s += `<rect x="${r3(p[0]-hs/2)}" y="${r3(p[1]-hs/2)}" width="${r3(hs)}" height="${r3(hs)}"`
        + ` fill="#0C0F14" stroke="var(--cyan)" stroke-width="1.4" vector-effect="non-scaling-stroke"/>`;
    });
    s += `</g>`;
  }

  /* --- snap guides --- */
  ui.guides.forEach(g=>{
    s += g.axis==="x"
      ? `<line x1="${r3(g.v)}" y1="${r3(v.y)}" x2="${r3(g.v)}" y2="${r3(v.y+v.h)}" stroke="var(--accent)" stroke-width="1" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"/>`
      : `<line x1="${r3(v.x)}" y1="${r3(g.v)}" x2="${r3(v.x+v.w)}" y2="${r3(g.v)}" stroke="var(--accent)" stroke-width="1" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"/>`;
  });

  /* --- machinist's rule (the scale reference along top + left) --- */
  if(ui.showRule) s += drawRule(v, S);

  stage.innerHTML =
    `<defs><clipPath id="lblclip"><rect x="0" y="0" width="${r3(L.w)}" height="${r3(L.h)}" rx="${r3(L.corner)}"/></clipPath></defs>` + s;
}

/* ============================================================================
   FIXTURE VIEW — the bed as the machine sees it. Cells are centre points.
   ========================================================================== */
function drawFixture(){
  const r = stage.getBoundingClientRect();
  if(!r.width) return;
  const v = viewRect();
  ui.scale = r.width / v.w;
  const S = ui.scale, px = n => n/S;
  stage.setAttribute("viewBox", `${r3(v.x)} ${r3(v.y)} ${r3(v.w)} ${r3(v.h)}`);
  stage.setAttribute("preserveAspectRatio","none");

  const fr = fieldRect(), L = doc.label, F = doc.fixture;
  const lockOff = lockOrigin();
  const sh = sheetFaces();
  const assigned = new Map();
  sh.faces.forEach(f=>{ if(f.cell) assigned.set(cellKey(f.cell.r,f.cell.c), f); });

  let s = "";

  /* bed / lens field */
  s += `<rect x="0" y="0" width="${r3(fr.w)}" height="${r3(fr.h)}" fill="#161B24"`
    + ` stroke="${F.field>0?"#F26419":"#39424F"}" stroke-width="1.5" vector-effect="non-scaling-stroke"/>`;
  if(F.field>0){
    s += `<line x1="${r3(fr.w/2)}" y1="0" x2="${r3(fr.w/2)}" y2="${r3(fr.h)}" stroke="#2E384A" stroke-width="1" vector-effect="non-scaling-stroke"/>`
      +  `<line x1="0" y1="${r3(fr.h/2)}" x2="${r3(fr.w)}" y2="${r3(fr.h/2)}" stroke="#2E384A" stroke-width="1" vector-effect="non-scaling-stroke"/>`;
  }
  /* bed grid at the snap increment, when it is not too dense */
  if(ui.showGrid && ui.grid*S >= 5){
    let g = "";
    for(let x=ui.grid; x<fr.w; x+=ui.grid)
      g += `<line x1="${r3(x)}" y1="0" x2="${r3(x)}" y2="${r3(fr.h)}" stroke="#222A38" stroke-width="1" vector-effect="non-scaling-stroke"/>`;
    for(let y=ui.grid; y<fr.h; y+=ui.grid)
      g += `<line x1="0" y1="${r3(y)}" x2="${r3(fr.w)}" y2="${r3(y)}" stroke="#222A38" stroke-width="1" vector-effect="non-scaling-stroke"/>`;
    s += g;
  }

  const opt = { forExport:false, ink:"#14181F", knock:"var(--paper)", guide:"#A8A49A", ref:"#A855C7" };

  fixtureCells().forEach(cell=>{
    const cx = cell.x - fr.x, cy = cell.y - fr.y;
    const lx = cx - L.w/2, ly = cy - L.h/2;
    const k = cellKey(cell.r, cell.c);
    const sel = ui.fixSel === k;
    const face = assigned.get(k);
    const moved = !!F.moved[k];

    const spin = cell.rot ? ` transform="rotate(${r3(cell.rot)} ${r3(cx)} ${r3(cy)})"` : "";
    s += `<g${spin}>`;

    /* lock body silhouette under the label */
    if(ui.showLock){
      s += `<rect x="${r3(lx + lockOff.x)}" y="${r3(ly + lockOff.y)}" width="${r3(doc.lock.w)}"`
        + ` height="${r3(doc.lock.h)}" rx="${r3(doc.lock.corner)}" fill="#20262F"`
        + ` stroke="#39424F" stroke-width="1" vector-effect="non-scaling-stroke" opacity="${cell.skip?.35:1}"/>`;
    }
    /* the label stock */
    const empty = !face && !cell.skip;
    s += `<rect x="${r3(lx)}" y="${r3(ly)}" width="${r3(L.w)}" height="${r3(L.h)}" rx="${r3(L.corner)}"`
      + ` fill="${cell.skip?"#2A313D":"var(--paper)"}" fill-opacity="${empty?0.30:1}"`
      + ` stroke="${sel?"var(--cyan)":moved?"var(--accent)":"#9A968B"}"`
      + ` stroke-width="${sel?2:moved?1.6:1}"`
      + (empty?` stroke-dasharray="5 4"`:"") + ` vector-effect="non-scaling-stroke"/>`;

    /* real artwork, so you can see which lock lands where */
    if(face && !cell.skip){
      s += `<g clip-path="url(#fxclip)" transform="translate(${r3(lx)} ${r3(ly)})">`;
      face.prims.forEach(p=>{ s += primSvg(p, 0, 0, 1, opt); });
      s += `</g>`;
    } else {
      const fs = px(11);
      s += `<text x="${r3(cx)}" y="${r3(cy - px(14))}" fill="#5C6980" font-family="var(--cond),sans-serif"`
        + ` font-size="${r3(fs)}" text-anchor="middle" letter-spacing="${r3(fs*0.12)}">`
        + (cell.skip ? "SKIP" : "EMPTY") + `</text>`;
    }

    s += `</g>`;

    /* centre crosshair — the thing you are actually positioning */
    const t = px(9);
    s += `<g opacity="${cell.skip?.5:1}">`
      + `<line x1="${r3(cx-t)}" y1="${r3(cy)}" x2="${r3(cx+t)}" y2="${r3(cy)}" stroke="var(--cyan)" stroke-width="1.2" vector-effect="non-scaling-stroke"/>`
      + `<line x1="${r3(cx)}" y1="${r3(cy-t)}" x2="${r3(cx)}" y2="${r3(cy+t)}" stroke="var(--cyan)" stroke-width="1.2" vector-effect="non-scaling-stroke"/>`
      + `<circle cx="${r3(cx)}" cy="${r3(cy)}" r="${r3(px(3))}" fill="none" stroke="var(--cyan)" stroke-width="1.2" vector-effect="non-scaling-stroke"/></g>`;

    /* index badge + who is on it */
    if(ui.showNums){
      const fs = px(10);
      const idx = face ? (sh.faces.indexOf(face)+1) : null;
      s += `<text x="${r3(lx)}" y="${r3(ly - px(4))}" fill="${sel?"#2BC5D9":"#8593A8"}"`
        + ` font-family="ui-monospace,monospace" font-size="${r3(fs)}">${cell.r+1}·${cell.c+1}`
        + (idx?`  #${idx}`:"") + (cell.rot?`  ${cell.rot}°`:"") + `</text>`;
      if(face){
        s += `<text x="${r3(cx)}" y="${r3(ly + L.h + fs*1.5)}" fill="#8593A8" text-anchor="middle"`
          + ` font-family="ui-monospace,monospace" font-size="${r3(fs)}">${esc(face.short)} · ${esc(face.faceName)}</text>`;
      }
    }
  });

  /* pitch dimensions between the first two cells */
  if(F.cols>1 || F.rows>1){
    const fs = px(10), cells = fixtureCells();
    /* dimension the nominal pitch, not a cell someone has dragged off it */
    const nomX = c => F.originX + c*F.pitchX - fr.x;
    const nomY = r => F.originY + r*F.pitchY - fr.y;
    const topY    = Math.min(...cells.map(c=>c.y)) - fr.y - L.h/2;
    const botY    = Math.max(...cells.map(c=>c.y)) - fr.y + L.h/2;
    const leftX   = Math.min(...cells.map(c=>c.x)) - fr.x - L.w/2;
    const rightX  = Math.max(...cells.map(c=>c.x)) - fr.x + L.w/2;
    if(F.cols>1){
      let y = topY - px(18);
      if(y < px(12)) y = Math.min(fr.h - px(8), botY + px(22));
      s += dimLine(nomX(0), nomX(1), y, "x", U.fmt(F.pitchX,3)+" "+U.label(), fs, px);
    }
    if(F.rows>1){
      let x = leftX - px(18);
      if(x < px(12)) x = Math.min(fr.w - px(8), rightX + px(22));
      s += dimLine(nomY(0), nomY(1), x, "y", U.fmt(F.pitchY,3)+" "+U.label(), fs, px);
    }
  }

  if(ui.showRule) s += drawRule(v, S, fr, bedFlipped());

  stage.innerHTML =
    `<defs><clipPath id="fxclip"><rect x="0" y="0" width="${r3(L.w)}" height="${r3(L.h)}" rx="${r3(L.corner)}"/></clipPath></defs>` + s;
}

function dimLine(a, b, at, axis, label, fs, px){
  const t = px(4);
  const A = axis==="x" ? [a,at] : [at,a], B = axis==="x" ? [b,at] : [at,b];
  const cap = axis==="x"
    ? p=>`<line x1="${r3(p[0])}" y1="${r3(p[1]-t)}" x2="${r3(p[0])}" y2="${r3(p[1]+t)}" stroke="var(--accent)" stroke-width="1" vector-effect="non-scaling-stroke"/>`
    : p=>`<line x1="${r3(p[0]-t)}" y1="${r3(p[1])}" x2="${r3(p[0]+t)}" y2="${r3(p[1])}" stroke="var(--accent)" stroke-width="1" vector-effect="non-scaling-stroke"/>`;
  const mid = axis==="x" ? [(a+b)/2, at-px(5)] : [at-px(5), (a+b)/2];
  const txt = axis==="x"
    ? `<text x="${r3(mid[0])}" y="${r3(mid[1])}" fill="var(--accent)" font-family="ui-monospace,monospace" font-size="${r3(fs)}" text-anchor="middle">${esc(label)}</text>`
    : `<text x="${r3(mid[0])}" y="${r3(mid[1])}" fill="var(--accent)" font-family="ui-monospace,monospace" font-size="${r3(fs)}" text-anchor="middle" transform="rotate(-90 ${r3(mid[0])} ${r3(mid[1])})">${esc(label)}</text>`;
  return `<g pointer-events="none">`
    + `<line x1="${r3(A[0])}" y1="${r3(A[1])}" x2="${r3(B[0])}" y2="${r3(B[1])}" stroke="var(--accent)" stroke-width="1" vector-effect="non-scaling-stroke"/>`
    + cap(A) + cap(B) + txt + `</g>`;
}

/* which cell is under this world point */
function hitCell(w){
  const fr = fieldRect(), L = doc.label;
  const cells = fixtureCells();
  for(let i=cells.length-1;i>=0;i--){
    const c = cells[i];
    const cx = c.x-fr.x, cy = c.y-fr.y;
    const quarter = (c.rot===90 || c.rot===270);
    const hw = (quarter ? L.h : L.w)/2, hh = (quarter ? L.w : L.h)/2;
    if(Math.abs(w.x-cx) <= hw && Math.abs(w.y-cy) <= hh) return c;
  }
  return null;
}

function drawRule(v, S, fr, flipY){
  const L = fr ? {w:fr.w, h:fr.h} : doc.label;
  const px = n=>n/S;
  const inMode = doc.units==="in";
  const div = inMode ? 1/16 : 1/MM;             // finest tick
  const majEvery = inMode ? 16 : 10;            // 1 in, or 10 mm
  const midEvery = inMode ? 8 : 5;
  const y0 = -px(26), x0 = -px(26), th = px(9), tm = px(6), ts = px(3.5);
  const fs = px(9);
  let s = `<g pointer-events="none">`;
  s += `<rect x="0" y="${r3(y0-th-px(13))}" width="${r3(L.w)}" height="${r3(th+px(13))}" fill="#171D28"/>`;
  s += `<rect x="${r3(x0-th-px(13))}" y="0" width="${r3(th+px(13))}" height="${r3(L.h)}" fill="#171D28"/>`;
  s += `<line x1="0" y1="${r3(y0)}" x2="${r3(L.w)}" y2="${r3(y0)}" stroke="#7E8DA4" stroke-width="1.2" vector-effect="non-scaling-stroke"/>`;
  const n = Math.floor(L.w/div + 1e-6);
  for(let i=0;i<=n;i++){
    const x = i*div;
    const maj = i%majEvery===0, mid = i%midEvery===0;
    const len = maj?th:mid?tm:ts;
    if(!maj && !mid && div*S < 3.5) continue;
    s += `<line x1="${r3(x)}" y1="${r3(y0)}" x2="${r3(x)}" y2="${r3(y0-len)}" stroke="${maj?"#C4CEDC":"#6E7C93"}" stroke-width="${maj?1.2:1}" vector-effect="non-scaling-stroke"/>`;
    if(maj && i>0) s += `<text x="${r3(x)}" y="${r3(y0-th-px(3))}" fill="#B6C2D2" font-family="ui-monospace,monospace" font-size="${r3(fs)}" text-anchor="middle">${inMode?(i/16):(i)}</text>`;
  }
  s += `<line x1="${r3(x0)}" y1="0" x2="${r3(x0)}" y2="${r3(L.h)}" stroke="#7E8DA4" stroke-width="1.2" vector-effect="non-scaling-stroke"/>`;
  const m = Math.floor(L.h/div + 1e-6);
  for(let i=0;i<=m;i++){
    const y = flipY ? (L.h - i*div) : i*div;
    const maj = i%majEvery===0, mid = i%midEvery===0;
    const len = maj?th:mid?tm:ts;
    if(!maj && !mid && div*S < 3.5) continue;
    s += `<line x1="${r3(x0)}" y1="${r3(y)}" x2="${r3(x0-len)}" y2="${r3(y)}" stroke="${maj?"#C4CEDC":"#6E7C93"}" stroke-width="${maj?1.2:1}" vector-effect="non-scaling-stroke"/>`;
    if(maj && i>0) s += `<text x="${r3(x0-th-px(4))}" y="${r3(y+fs*0.36)}" fill="#B6C2D2" font-family="ui-monospace,monospace" font-size="${r3(fs)}" text-anchor="end">${inMode?(i/16):(i)}</text>`;
  }
  s += `<text x="${r3(x0-px(4))}" y="${r3(y0-px(4))}" fill="#5C6980" font-family="ui-monospace,monospace" font-size="${r3(fs)}" text-anchor="end">${U.label()}</text>`;
  return s+`</g>`;
}

/* --------------------------------------------------------------- handles --- */
const HANDLES = ["nw","n","ne","e","se","s","sw","w"];
function handlePt(b,h){
  const x = h.includes("w")?b.x : h.includes("e")?b.x+b.w : b.x+b.w/2;
  const y = h.includes("n")?b.y : h.includes("s")?b.y+b.h : b.y+b.h/2;
  return [x,y];
}
function unrot(pt, c, deg){
  if(!deg) return pt;
  const a = -deg*Math.PI/180, s=Math.sin(a), co=Math.cos(a);
  const dx=pt.x-c[0], dy=pt.y-c[1];
  return { x:c[0]+dx*co-dy*s, y:c[1]+dx*s+dy*co };
}
function hitElement(w){
  const els = face().els;
  for(let i=els.length-1;i>=0;i--){
    const el = els[i];
    if(el.visible===false || el.locked) continue;
    const b = boxOf(el), c=[b.x+b.w/2,b.y+b.h/2];
    const p = unrot(w, c, el.rot||0);
    const m = (coarse()?6:3)/ui.scale;
    if(p.x>=b.x-m && p.x<=b.x+b.w+m && p.y>=b.y-m && p.y<=b.y+b.h+m) return el;
  }
  return null;
}
function hitHandle(w){
  if(ui.sel.length!==1) return null;
  const el = firstSel(); if(!el || el.locked) return null;
  const b = boxOf(el), c=[b.x+b.w/2,b.y+b.h/2];
  const p = unrot(w, c, el.rot||0), t = GRAB_PX()/ui.scale;
  for(const h of HANDLES){
    const q = handlePt(b,h);
    if(Math.abs(p.x-q[0])<t && Math.abs(p.y-q[1])<t) return h;
  }
  return null;
}

/* --------------------------------------------------------------- snapping --- */
function snapTargets(exceptIds){
  const s = safeRect();
  const xs = [{v:s.x,l:"edge"},{v:s.x+s.w/2,l:"center"},{v:s.x+s.w,l:"edge"}];
  const ys = [{v:s.y,l:"edge"},{v:s.y+s.h/2,l:"middle"},{v:s.y+s.h,l:"edge"}];
  face().els.forEach(el=>{
    if(exceptIds.includes(el.id) || el.visible===false) return;
    const b = boxOf(el);
    xs.push({v:b.x},{v:b.x+b.w/2},{v:b.x+b.w});
    ys.push({v:b.y},{v:b.y+b.h/2},{v:b.y+b.h});
  });
  return {xs,ys};
}
function applySnap(box, ids){
  ui.guides = [];
  if(!ui.snap) return box;
  const tol = 7/ui.scale;
  const T = snapTargets(ids);
  const cands = [[box.x,0],[box.x+box.w/2,0.5],[box.x+box.w,1]];
  let bestX=null;
  cands.forEach(([v,f])=>{
    T.xs.forEach(t=>{
      const d = Math.abs(v-t.v);
      if(d<tol && (!bestX || d<bestX.d)) bestX = {d, dx:t.v-v, gv:t.v};
    });
  });
  const candsY = [[box.y,0],[box.y+box.h/2,0.5],[box.y+box.h,1]];
  let bestY=null;
  candsY.forEach(([v,f])=>{
    T.ys.forEach(t=>{
      const d = Math.abs(v-t.v);
      if(d<tol && (!bestY || d<bestY.d)) bestY = {d, dy:t.v-v, gv:t.v};
    });
  });
  if(bestX){ box.x += bestX.dx; ui.guides.push({axis:"x", v:bestX.gv}); }
  else { box.x = Math.round(box.x/ui.grid)*ui.grid; }
  if(bestY){ box.y += bestY.dy; ui.guides.push({axis:"y", v:bestY.gv}); }
  else { box.y = Math.round(box.y/ui.grid)*ui.grid; }
  return box;
}

/* ------------------------------------------------------------- interaction --- */
let pointers = new Map(), pinch = null;

stage.addEventListener("pointerdown", ev=>{
  stage.setPointerCapture(ev.pointerId);
  pointers.set(ev.pointerId, ev);
  if(pointers.size===2){
    const [a,b] = [...pointers.values()];
    pinch = { d:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY), w:ui.view.w,
              cx:(a.clientX+b.clientX)/2, cy:(a.clientY+b.clientY)/2 };
    ui.drag = null; return;
  }
  const w = toWorld(ev);

  if(ui.stageMode==="fixture"){
    const cell = hitCell(w);
    if(cell){
      ui.fixSel = cellKey(cell.r, cell.c);
      const fr = fieldRect();
      ui.drag = { mode:"cell", cell, start:w, base:{x:cell.x, y:cell.y},
                  moved:false, fr };
      drawFixture(); renderProps();
    } else {
      ui.drag = { mode:"pan", start:{cx:ev.clientX, cy:ev.clientY}, vx:ui.view.x, vy:ui.view.y };
    }
    return;
  }

  const h = hitHandle(w);
  if(h){
    const el = firstSel();
    ui.drag = { mode:"resize", h, el, start:w, box0:boxOf(el), cap0:el.cap };
    return;
  }
  const el = hitElement(w);
  if(el){
    if(ev.shiftKey){ ui.sel = ui.sel.includes(el.id) ? ui.sel.filter(i=>i!==el.id) : [...ui.sel, el.id]; }
    else if(!ui.sel.includes(el.id)) ui.sel = [el.id];
    ui.drag = { mode:"move", start:w, boxes:selEls().map(e=>({e, b:boxOf(e)})) };
    syncSelection();
  } else {
    if(!ev.shiftKey){ ui.sel = []; syncSelection(); }
    ui.drag = { mode:"pan", start:{cx:ev.clientX, cy:ev.clientY}, vx:ui.view.x, vy:ui.view.y };
  }
  drawStage();
});

stage.addEventListener("pointermove", ev=>{
  if(pointers.has(ev.pointerId)) pointers.set(ev.pointerId, ev);
  if(pinch && pointers.size===2){
    const [a,b] = [...pointers.values()];
    const d = Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);
    if(d>4){
      const r = stage.getBoundingClientRect();
      const before = { x: ui.view.x + (pinch.cx-r.left)/r.width*ui.view.w,
                       y: ui.view.y + (pinch.cy-r.top)/r.width*ui.view.w };
      ui.view.w = clamp(pinch.w * pinch.d/d, 0.25, 40);
      ui.view.x = before.x - (pinch.cx-r.left)/r.width*ui.view.w;
      ui.view.y = before.y - (pinch.cy-r.top)/r.width*ui.view.w;
      drawStage();
    }
    return;
  }
  const d = ui.drag; if(!d) { showCoord(toWorld(ev)); return; }
  if(d.mode==="pan"){
    const r = stage.getBoundingClientRect();
    ui.view.x = d.vx - (ev.clientX-d.start.cx)/r.width*ui.view.w;
    ui.view.y = d.vy - (ev.clientY-d.start.cy)/r.width*ui.view.w;
    drawStage(); return;
  }
  const w = toWorld(ev);
  if(d.mode==="cell"){
    let nx = d.base.x + (w.x-d.start.x), ny = d.base.y + (w.y-d.start.y);
    if(Math.abs(nx-d.base.x) > 0.004 || Math.abs(ny-d.base.y) > 0.004) d.moved = true;
    if(ui.snap){ nx = Math.round(nx/ui.grid)*ui.grid; ny = Math.round(ny/ui.grid)*ui.grid; }
    const F = doc.fixture, k = cellKey(d.cell.r, d.cell.c);
    const nominalX = F.originX + d.cell.c*F.pitchX + (d.cell.r%2 ? F.stagger : 0);
    const nominalY = F.originY + d.cell.r*F.pitchY;
    const dx = nx-nominalX, dy = ny-nominalY;
    if(Math.abs(dx)<1e-6 && Math.abs(dy)<1e-6) delete F.moved[k];
    else F.moved[k] = { dx:r3(dx), dy:r3(dy) };
    showCellCoord(nx, ny);
    drawFixture();
    return;
  }
  if(d.mode==="move"){
    let dx = w.x-d.start.x, dy = w.y-d.start.y;
    if(d.boxes.length===1){
      const nb = applySnap({x:d.boxes[0].b.x+dx, y:d.boxes[0].b.y+dy,
                            w:d.boxes[0].b.w, h:d.boxes[0].b.h}, [d.boxes[0].e.id]);
      setBox(d.boxes[0].e, nb);
    } else {
      ui.guides = [];
      d.boxes.forEach(({e,b})=> setBox(e, {x:b.x+dx, y:b.y+dy, w:b.w, h:b.h}));
    }
  }
  else if(d.mode==="resize"){
    const el = d.el, b0 = d.box0, c=[b0.x+b0.w/2, b0.y+b0.h/2];
    const p = unrot(w, c, el.rot||0), s0 = unrot(d.start, c, el.rot||0);
    let dx = p.x-s0.x, dy = p.y-s0.y;
    let nb = {...b0};
    if(d.h.includes("w")){ nb.x = b0.x+dx; nb.w = b0.w-dx; }
    if(d.h.includes("e")){ nb.w = b0.w+dx; }
    if(d.h.includes("n")){ nb.y = b0.y+dy; nb.h = b0.h-dy; }
    if(d.h.includes("s")){ nb.h = b0.h+dy; }
    if(nb.w < 0.02){ nb.w = 0.02; }
    if(nb.h < 0.005){ nb.h = 0.005; }
    if(el.type==="image" && el.keepAR && el.srcW && el.srcH && d.h.length===2){
      const ar = el.srcW/el.srcH;
      nb.h = nb.w/ar;
      if(d.h.includes("n")) nb.y = b0.y + b0.h - nb.h;
    }
    nb = applySnap(nb, [el.id]);
    if(el.type==="text" && el.fit==="none"){
      el.cap = clamp(d.cap0 * (nb.h/Math.max(1e-4,b0.h)), 0.01, 4);
    }
    setBox(el, nb);
  }
  showCoord(w);
  drawStage();
});

function endDrag(ev){
  pointers.delete(ev.pointerId);
  if(pointers.size<2) pinch = null;
  if(ui.drag && ui.drag.mode==="cell"){
    const d = ui.drag; ui.drag = null;
    if(!d.moved){                       // a tap toggles the cell off and on
      const F = doc.fixture, k = cellKey(d.cell.r, d.cell.c);
      if(F.skipped[k]) delete F.skipped[k]; else F.skipped[k] = true;
    }
    drawFixture(); renderProps(); updateStatus();
    if(typeof saveLocal==="function") saveLocal();
    return;
  }
  if(ui.drag){ const was = ui.drag.mode; ui.drag = null; ui.guides = [];
    drawStage(); renderProps(); updateStatus();
    if(was !== "pan" && typeof saveLocal === "function") saveLocal(); }
}
stage.addEventListener("pointerup", endDrag);
stage.addEventListener("pointercancel", endDrag);
stage.addEventListener("lostpointercapture", endDrag);

stage.addEventListener("wheel", ev=>{
  ev.preventDefault();
  const r = stage.getBoundingClientRect();
  const before = { x: ui.view.x + (ev.clientX-r.left)/r.width*ui.view.w,
                   y: ui.view.y + (ev.clientY-r.top)/r.width*ui.view.w };
  const f = Math.exp(ev.deltaY*0.0016);
  ui.view.w = clamp(ui.view.w*f, 0.25, 40);
  ui.view.x = before.x - (ev.clientX-r.left)/r.width*ui.view.w;
  ui.view.y = before.y - (ev.clientY-r.top)/r.width*ui.view.w;
  drawStage();
}, {passive:false});

stage.addEventListener("dblclick", ev=>{
