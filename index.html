/* ----------------------------------------------------------- local restore --- */
const STORE_KEY = "markbench.doc.v2";
let _saveT = null;
function saveLocal(){
  clearTimeout(_saveT);
  _saveT = setTimeout(()=>{
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(doc)); }catch(e){}
  }, 700);
}
function restoreLocal(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return false;
    const d = JSON.parse(raw);
    if(!d || !Array.isArray(d.faces) || !d.faces.length) return false;
    doc = migrateDoc(d); reflowAll(); return true;
  }catch(e){ return false; }
}
function resetDoc(){
  doc = defaultDoc(); ui.faceIdx=0; ui.sel=[]; ui.previewIdx=0;
  try{ localStorage.removeItem(STORE_KEY); }catch(e){}
  buildAll(); fitView(); toast("Reset to the starting layout");
}

/* --------------------------------------------------------------------- boot */
function boot(){
  ui.loadedAt = Date.now();
  console.log("%cMarkbench " + BUILD, "color:#F26419;font-weight:700");
  const restored = restoreLocal();
  buildPalette();
  buildAll();
  if(restored) setTimeout(()=>toast("Picked up where you left off"), 400);

  document.querySelectorAll("[data-align]").forEach(b=>
    b.addEventListener("click", ()=>doAlign(b.dataset.align)));
  $("btnDup").addEventListener("click", duplicateSel);
  $("btnDel").addEventListener("click", deleteSel);

  const tog = (id, key, fn) => {
    const b = $(id);
    const set = ()=> b.setAttribute("aria-pressed", ui[key]);
    b.addEventListener("click", ()=>{ ui[key] = !ui[key]; set(); (fn||drawStage)(); });
    set();
  };
  document.querySelectorAll("[data-mode]").forEach(b=>b.addEventListener("click", ()=>{
    setStageMode(b.dataset.mode);
    if(b.dataset.mode==="fixture" && ui.panel!=="fixture") showPanel("fixture");
  }));
  document.getElementById("stagewrap").dataset.mode = ui.stageMode;

  tog("tGrid","showGrid"); tog("tSnap","snap");
  tog("tLock","showLock"); tog("tRule","showRule", ()=>{ drawStage(); });
  tog("tNums","showNums");
  $("tFit").addEventListener("click", fitView);

  document.querySelectorAll("#nav button").forEach(b=>b.addEventListener("click", ()=>{
    const n = b.dataset.nav;
    if(n==="stage"){ closeSheets(); return; }
    if(n==="build"){
      const open = $("leftrail").classList.contains("open");
      closeSheets();
      if(!open){ $("leftrail").classList.add("open"); $("scrim").classList.add("show"); }
      syncNav(); return;
    }
    const same = $("rightrail").classList.contains("open") && ui.panel===n;
    closeSheets();
    if(!same) showPanel(n);
  }));
  $("tLayers").addEventListener("click", ()=>{
    const L = $("leftrail"), open = L.classList.toggle("open");
    $("tLayers").setAttribute("aria-pressed", open);
    $("scrim").classList.toggle("show", open);
  });
  $("rightrail").addEventListener("focusout", ()=>{
    setTimeout(()=>{ if(ui.railDirty && !railIsBeingTyped()) renderRail(true); }, 0);
  });
  $("scrim").addEventListener("click", closeSheets);
  document.querySelectorAll(".sheetgrip").forEach(g=>g.addEventListener("click", closeSheets));
  $("btnExport").addEventListener("click", ()=>showPanel("export"));
  $("docName").style.cursor = "pointer";
  $("docName").title = "Rename — Markbench build " + BUILD;
  $("docName").addEventListener("click", ()=>{
    const n = prompt("Project name", doc.name);
    if(n && n.trim()){ doc.name = n.trim().slice(0,40); updateStatus(); saveLocal(); }
  });

  cloudBoot();

  const ro = new ResizeObserver(()=>drawStage());
  ro.observe($("stagewrap"));
  requestAnimationFrame(()=>{ fitView(); syncNav(); });
}
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
else setTimeout(boot, 0);

/* ============================================================================
   MARKBENCH — cloud layer (Firebase / Firestore)

   Optional by design. With no config the app is exactly what it was: a single
   offline file. Configure it and the shop shares one library of designs,
   one people roster, and one set of proven laser recipes.

   Collections
     workspaces/{ws}/designs/{id}            metadata only  — cheap to list
     workspaces/{ws}/designs/{id}/body/main  the design payload
     workspaces/{ws}/people/{id}             shared roster
     workspaces/{ws}/presets/{id}            saved laser recipes
   ========================================================================== */

const FB_VERSION = "12.11.0";
const FB_CDN = "https://www.gstatic.com/firebasejs/" + FB_VERSION;

/* Commit your project's web config here and everyone who loads the page is
   connected with no setup. Leaving it blank makes the app ask for it once and
   remember it in the browser. A Firebase web apiKey is an identifier, not a
   secret — access is controlled by your Firestore rules. */
const FIREBASE_BUILTIN = {
  apiKey: "",
  authDomain: "",
  projectId: "",
  appId: "",
  storageBucket: "",
  messagingSenderId: "",
  workspace: "shop",
  authMode: "anonymous"        // "anonymous" | "google"
};

const CFG_KEY = "markbench.firebase";
const FS_DOC_LIMIT = 1048487;

const cloud = {
  state:"off",            // off | connecting | ready | error
  err:null, uid:null, who:"",
  fb:null, db:null, auth:null,
  designs:[], people:[], presets:[],
  curId:null, curName:"", openId:null, filter:"", busy:false, unsub:[]
};

function cloudCfg(){
  let saved = null;
  try{ saved = JSON.parse(localStorage.getItem(CFG_KEY) || "null"); }catch(e){}
  const c = Object.assign({}, FIREBASE_BUILTIN, saved || {});
  return c;
}
function cloudConfigured(c){ c = c || cloudCfg(); return !!(c.apiKey && c.projectId && c.appId); }
function saveCloudCfg(c){ try{ localStorage.setItem(CFG_KEY, JSON.stringify(c)); }catch(e){} }

/* single indirection point for the SDK import — lets the module be exercised
   without a network, and lets you swap in vendored SDK files if gstatic is blocked */
let fbImport = (url) => import(url);

async function cloudConnect(){
  const c = cloudCfg();
  if(!cloudConfigured(c)){ cloud.state="off"; renderCloud(); return; }
  cloud.state = "connecting"; cloud.err = null; renderCloud();
  try{
    const [app, auth, fs] = await Promise.all([
      fbImport(`${FB_CDN}/firebase-app.js`),
      fbImport(`${FB_CDN}/firebase-auth.js`),
      fbImport(`${FB_CDN}/firebase-firestore.js`)
    ]);
    cloud.fb = { app, auth, fs };
    const a = app.initializeApp({
      apiKey:c.apiKey, authDomain:c.authDomain, projectId:c.projectId,
      appId:c.appId, storageBucket:c.storageBucket, messagingSenderId:c.messagingSenderId
    });
    cloud.auth = auth.getAuth(a);
    cloud.db = fs.getFirestore(a);

    if(c.authMode === "google"){
      const cur = cloud.auth.currentUser;
      if(!cur) await auth.signInWithPopup(cloud.auth, new auth.GoogleAuthProvider());
    } else {
      await auth.signInAnonymously(cloud.auth);
    }
    const u = cloud.auth.currentUser;
    cloud.uid = u ? u.uid : null;
    cloud.who = u && u.email ? u.email : (u ? "device " + u.uid.slice(0,6) : "");
    cloud.state = "ready";
    cloudListen();
  }catch(e){
    cloud.state = "error";
    cloud.err = friendlyCloudError(e);
  }
  renderCloud();
}
function friendlyCloudError(e){
  const m = String(e && (e.code || e.message) || e);
  if(/Failed to fetch|dynamically imported|NetworkError|import/i.test(m))
    return "Couldn't load the Firebase SDK. Your network is probably blocking gstatic.com — "
         + "ask IT to allow it, or vendor the SDK files into the repo.";
  if(/auth\/operation-not-allowed/.test(m))
    return "Sign-in method isn't enabled. In the Firebase console open Authentication → Sign-in method "
         + "and enable " + (cloudCfg().authMode==="google" ? "Google." : "Anonymous.");
  if(/auth\/unauthorized-domain/.test(m))
    return "This domain isn't authorised. Add it under Authentication → Settings → Authorized domains.";
  if(/permission-denied|insufficient/i.test(m))
    return "Firestore rules rejected the request. Publish the rules from firestore.rules in the repo.";
  if(/popup/i.test(m)) return "The sign-in popup was closed or blocked.";
  return m;
}

function wsPath(){ return "workspaces/" + (cloudCfg().workspace || "shop"); }
function cloudListen(){
  const { collection, onSnapshot, query, orderBy, limit } = cloud.fb.fs;
  cloud.unsub.forEach(u=>{ try{u();}catch(e){} });
  cloud.unsub = [];
  const watch = (name, key, q) => cloud.unsub.push(onSnapshot(q,
    snap => { cloud[key] = snap.docs.map(d=>Object.assign({id:d.id}, d.data())); renderCloud(); },
    err  => { cloud.err = friendlyCloudError(err); renderCloud(); }));
  watch("designs","designs", query(collection(cloud.db, wsPath()+"/designs"), orderBy("updatedAt","desc"), limit(200)));
  watch("people","people",   query(collection(cloud.db, wsPath()+"/people"), orderBy("last"), limit(500)));
  watch("presets","presets", query(collection(cloud.db, wsPath()+"/presets"), orderBy("name"), limit(200)));
}
function cloudDisconnect(){
  cloud.unsub.forEach(u=>{ try{u();}catch(e){} });
  cloud.unsub = []; cloud.state = "off"; cloud.designs = cloud.people = cloud.presets = [];
  cloud.curId = null; renderCloud();
}

/* ---------------------------------------------------------------- designs --- */
function designPayload(){ return JSON.stringify(doc); }
function payloadSize(){ return new Blob([designPayload()]).size; }

/* Everything worth knowing about a design without downloading its payload,
   so the library list is useful on its own. */
function designMeta(name, size){
  const M = activeMachine(), mat = activeMaterial(), F = doc.fixture;
  const p = laserEffective();
  const els = {};
  doc.faces.forEach(f => f.els.forEach(e => { els[e.type] = (els[e.type]||0)+1; }));
  return {
    name, updatedBy: cloud.who || "unknown", updatedAt: cloud.fb.fs.serverTimestamp(),
    bytes: size, schema: 2, build: BUILD, units: doc.units,

    faces: doc.faces.length, locks: doc.roster.length,
    faceNames: doc.faces.map(f=>f.name).join(" · ").slice(0,80),
    elements: Object.entries(els).map(([k,v])=>v+" "+k).join(", "),

    lockW: r3(doc.lock.w*MM),   lockH: r3(doc.lock.h*MM),
    labelW: r3(doc.label.w*MM), labelH: r3(doc.label.h*MM),
    pad: r3(doc.pad*MM),

    fixRows: Math.round(F.rows), fixCols: Math.round(F.cols),
    pitchX: r3(F.pitchX*MM), pitchY: r3(F.pitchY*MM),
    field: F.field>0 ? Math.round(F.field*MM) : 0,
    fixRotated: Object.keys(F.rot||{}).filter(k=>F.rot[k]).length,
    fixSkipped: Object.keys(F.skipped||{}).length,
    fixMoved: Object.keys(F.moved||{}).length,

    machine: M.name, machineWatts: M.watts, machineSource: M.source, lens: M.lens,

    material: mat.name, proven: !!mat.proven,
    speed: p.speed, power: p.power, freq: p.freq,
    interval: p.interval, passes: p.passes, pulse: p.pulse||0,
    fill: doc.laser.fill, textOut: doc.textOut
  };
}

async function cloudRenameDesign(id, current){
  const name = (prompt("Rename this design", current) || "").trim();
  if(!name || name === current) return;
  const { doc:dref, setDoc } = cloud.fb.fs;
  try{
    await setDoc(dref(cloud.db, wsPath()+"/designs/"+id), {name}, {merge:true});
    if(cloud.curId === id){ doc.name = name; updateStatus(); saveLocal(); }
    toast("Renamed");
  }catch(e){ cloud.err = friendlyCloudError(e); renderCloud(); }
}

async function cloudSaveDesign(asNew){
  if(cloud.state!=="ready" || cloud.busy) return;
  const body = designPayload(), size = new Blob([body]).size;
  if(size > FS_DOC_LIMIT - 4096){
    toast("Too big for one record (" + Math.round(size/1024) + " KB). Lower the graphic resolution.");
    return;
  }
  const name = (doc.name || "Untitled").slice(0,60);
  const { doc:dref, collection, setDoc, addDoc } = cloud.fb.fs;
  cloud.busy = true; renderCloud();
  try{
    const meta = designMeta(name, size);
    let id = asNew ? null : cloud.curId;
    if(id){
      await setDoc(dref(cloud.db, wsPath()+"/designs/"+id), meta, {merge:true});
    } else {
      const ref = await addDoc(collection(cloud.db, wsPath()+"/designs"), meta);
      id = ref.id;
    }
    await setDoc(dref(cloud.db, wsPath()+"/designs/"+id+"/body/main"), { data: body });
    cloud.curId = id; cloud.curName = name; cloud.openId = id;
    toast(asNew ? "Saved as a new design" : "Saved to the shop library");
  }catch(e){ cloud.err = friendlyCloudError(e); toast("Save failed"); }
  cloud.busy = false; renderCloud();
}
async function cloudOpenDesign(id){
  if(cloud.state!=="ready") return;
  const { doc:dref, getDoc } = cloud.fb.fs;
  cloud.busy = true; renderCloud();
  try{
    const snap = await getDoc(dref(cloud.db, wsPath()+"/designs/"+id+"/body/main"));
    if(!snap.exists()) throw new Error("That design has no saved body.");
    const d = JSON.parse(snap.data().data);
    if(!d || !Array.isArray(d.faces) || !d.faces.length) throw new Error("bad payload");
    doc = migrateDoc(d); ui.faceIdx = 0; ui.sel = []; ui.previewIdx = 0;
    cloud.curId = id; cloud.openId = id;
    reflowAll(); buildAll(); fitView();
    toast("Opened " + (doc.name||"design"));
  }catch(e){ cloud.err = friendlyCloudError(e); toast("Couldn't open that one"); }
  cloud.busy = false; renderCloud();
}
async function cloudDeleteDesign(id, name){
  if(cloud.state!=="ready") return;
  if(!confirm("Delete \u201C"+name+"\u201D from the shop library? This affects everyone.")) return;
  const { doc:dref, deleteDoc } = cloud.fb.fs;
  try{
    await deleteDoc(dref(cloud.db, wsPath()+"/designs/"+id+"/body/main"));
    await deleteDoc(dref(cloud.db, wsPath()+"/designs/"+id));
    if(cloud.curId===id) cloud.curId = null;
    toast("Deleted");
  }catch(e){ cloud.err = friendlyCloudError(e); }
  renderCloud();
}

/* ----------------------------------------------------------------- people --- */
async function cloudPushRoster(){
  if(cloud.state!=="ready") return;
  const { collection, addDoc, serverTimestamp } = cloud.fb.fs;
  const rows = doc.roster.filter(r=>(r.first||r.last).trim());
  if(!rows.length){ toast("Nothing in this roster to share"); return; }
  const have = new Set(cloud.people.map(p=>(p.first+"|"+p.last).toLowerCase()));
  let n = 0;
  try{
    for(const r of rows){
      const k = ((r.first||"")+"|"+(r.last||"")).toLowerCase();
      if(have.has(k)) continue;
      await addDoc(collection(cloud.db, wsPath()+"/people"),
        { first:r.first||"", last:r.last||"", dept:r.dept||"", addedAt:serverTimestamp() });
      have.add(k); n++;
    }
    toast(n ? n+" added to the shared roster" : "All of them were already shared");
  }catch(e){ cloud.err = friendlyCloudError(e); renderCloud(); }
}
function cloudPullRoster(){
  if(!cloud.people.length){ toast("The shared roster is empty"); return; }
  doc.roster = cloud.people.map(p=>({first:p.first||"", last:p.last||"", dept:p.dept||""}));
  ui.previewIdx = 0;
  buildAll();
  toast(doc.roster.length + " locks loaded from the shared roster");
}
async function cloudAddPerson(){
  const first = (prompt("First name")||"").trim(); if(!first) return;
  const last  = (prompt("Last name")||"").trim();
  const dept  = (prompt("Department")||"").trim();
  const { collection, addDoc, serverTimestamp } = cloud.fb.fs;
  try{ await addDoc(collection(cloud.db, wsPath()+"/people"), {first,last,dept,addedAt:serverTimestamp()}); }
  catch(e){ cloud.err = friendlyCloudError(e); renderCloud(); }
}
async function cloudDeletePerson(id){
  const { doc:dref, deleteDoc } = cloud.fb.fs;
  try{ await deleteDoc(dref(cloud.db, wsPath()+"/people/"+id)); }
  catch(e){ cloud.err = friendlyCloudError(e); renderCloud(); }
}

/* ---------------------------------------------------------------- presets --- */
async function cloudSavePreset(){
  if(cloud.state!=="ready") return;
  const mat = activeMaterial(), M = activeMachine();
  const name = (prompt("Share this material as", mat.name) || "").trim();
  if(!name) return;
  const { collection, addDoc, serverTimestamp } = cloud.fb.fs;
  try{
    await addDoc(collection(cloud.db, wsPath()+"/presets"), {
      name, speed:mat.speed, power:mat.power, freq:mat.freq, interval:mat.interval,
      passes:mat.passes, pulse:mat.pulse||0, fill:mat.fill||"scan",
      note:mat.note||"", proven:!!mat.proven,
      machineName:M.name, machineWatts:M.watts, machineSource:M.source, lens:M.lens,
      by: cloud.who || "unknown", savedAt: serverTimestamp()
    });
    toast("Shared with the shop");
  }catch(e){ cloud.err = friendlyCloudError(e); renderCloud(); }
}
function cloudApplyPreset(id){
  const p = cloud.presets.find(x=>x.id===id); if(!p) return;
  const M = activeMachine();
  const mismatch = p.machineName && p.machineName !== M.name;
  const mat = { id:uid("mat_"), name:p.name + (mismatch ? " (from "+p.machineName+")" : ""),
                machineId: mismatch ? null : doc.machineId,
                speed:p.speed, power:p.power, freq:p.freq, interval:p.interval,
                passes:p.passes||1, pulse:p.pulse||0, fill:p.fill||"scan",
                proven: mismatch ? false : !!p.proven,
                note: (p.note||"") + (mismatch
                  ? ((p.note?"\n\n":"") + "Proved on a " + p.machineWatts + " W " + p.machineName
                     + ". Re-check it on this machine before trusting it.") : "") };
  doc.materials.push(mat);
  doc.laser.materialId = mat.id; doc.laser.trim = 0; doc.laser.manual = false;
  ui.panel = "material"; renderRail(); saveLocal(); updateStatus();
  toast(mismatch ? "Added — different machine, verify it" : "Added to your materials");
}
async function cloudDeletePreset(id){
  const { doc:dref, deleteDoc } = cloud.fb.fs;
  try{ await deleteDoc(dref(cloud.db, wsPath()+"/presets/"+id)); }
  catch(e){ cloud.err = friendlyCloudError(e); renderCloud(); }
}

/* -------------------------------------------------------------------- UI --- */
function cloudDotClass(){
  return cloud.state==="ready" ? "on" : cloud.state==="error" ? "bad"
       : cloud.state==="connecting" ? "wait" : "";
}
function renderCloudChip(){
  const el = $("cloudChip"); if(!el) return;
  const label = { off:"Local", connecting:"…", ready:"Cloud", error:"Cloud" }[cloud.state];
  el.className = "chip " + cloudDotClass();
  el.innerHTML = `<i></i>${label}`;
  el.title = cloud.state==="ready" ? ("Connected as " + cloud.who) : (cloud.err || "Not connected");
}
function renderCloud(){
  renderCloudChip();
  if(ui.panel==="cloud") renderRail();
}
function fmtWhen(ts){
  if(!ts) return "";
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  const diff = (Date.now()-d.getTime())/1000;
  if(diff < 60) return "just now";
  if(diff < 3600) return Math.floor(diff/60)+" min ago";
  if(diff < 86400) return Math.floor(diff/3600)+" h ago";
  return d.toLocaleDateString();
}

/* The design's name belongs to the document, not to Firebase — so it shows
   whether or not the cloud is connected. */
function designNameSection(){
  const ready = cloud.state === "ready";
  return `
  <section class="sec"><h3>This design</h3><div class="body">
    <div class="row">${fText("Design name","doc.name")}</div>
    <p class="hint" style="margin-top:0">Give each lock type its own name — "Red thermoplastic 1.5in",
      "Aluminium tag", "Electrical dept". It titles the export file, and with the cloud connected each
      name is its own entry in the shop library.</p>
    ${ready ? `
      <div class="btnrow split" style="margin-top:9px">
        <button class="btn pri" data-act="cloudput" ${cloud.busy?"disabled":""}>${cloud.curId?"Save changes":"Save to library"}</button>
        <button class="btn" data-act="cloudputnew" ${cloud.busy?"disabled":""}>Save as new</button>
      </div>
      ${cloud.curId?`<p class="hint">Editing <b>${esc(cloud.curName||doc.name)}</b>. "Save changes" overwrites it;
        "Save as new" forks a copy.</p>`:""}`
    : `
      <div class="btnrow split" style="margin-top:9px">
        <button class="btn" data-act="savejson">Save to a file</button>
        <button class="btn ghost" data-act="loadjson">Open a file</button>
      </div>
      <p class="hint">Not connected, so designs save as project files. Connect below and they go to a
        shared library the whole shop can open.</p>`}
  </div></section>`;
}

function panelCloud(){
  const c = cloudCfg();
  if(!cloudConfigured(c) || cloud.state==="off"){
    return designNameSection() + `
    <section class="sec"><h3>Connect a Firebase project</h3><div class="body">
      ${cloud.err?`<div class="callout bad">${esc(cloud.err)}</div>`:""}
      <p class="hint" style="margin-top:0">Paste the web config from Firebase console → Project settings →
        Your apps. The API key is an identifier, not a secret; your Firestore rules do the protecting.</p>
      <div class="row">${cfgField("Project ID","projectId",c)}</div>
      <div class="row">${cfgField("API key","apiKey",c)}</div>
      <div class="row">${cfgField("App ID","appId",c)}</div>
      <div class="row c2">${cfgField("Auth domain","authDomain",c)}${cfgField("Workspace","workspace",c)}</div>
      <div class="row">${cfgField("Sender ID","messagingSenderId",c)}</div>
      <div class="row"><label class="fld"><span>Sign-in</span>
        <select id="cfgAuthMode">
          <option value="anonymous"${c.authMode!=="google"?" selected":""}>Anonymous — anyone on the page</option>
          <option value="google"${c.authMode==="google"?" selected":""}>Google account</option>
        </select></label></div>
      <div class="btnrow split" style="margin-top:8px">
        <button class="btn pri" data-act="cloudsave">Connect</button>
        <button class="btn sm ghost" data-act="cloudpaste">Paste whole config</button>
      </div>
      <p class="hint">Everything keeps working offline without this. The cloud only adds a shared library.</p>
    </div></section>`;
  }
  if(cloud.state==="connecting")
    return designNameSection()
      + `<section class="sec"><div class="body"><div class="empty">Connecting to ${esc(c.projectId)}…</div></div></section>`;

  const size = payloadSize();
  const heavy = size > FS_DOC_LIMIT*0.7;

  return `
  <section class="sec"><h3>Workspace
    <span class="tag">${esc(c.workspace||"shop")}</span></h3><div class="body">
    ${cloud.err?`<div class="callout bad">${esc(cloud.err)}</div>`:""}
    <div class="readout">
      <b>Project</b><span>${esc(c.projectId)}</span>
      <b>Signed in</b><span>${esc(cloud.who||"—")}</span>
      <b>This design</b><span>${Math.round(size/1024)} KB</span>
    </div>
    ${heavy?`<div class="callout">This design is heavy for one record. Drop graphic resolution to 300 dpi
      or use 1-bit mode before saving.</div>`:""}
    <div class="btnrow" style="margin-top:9px">
      <button class="btn sm ghost wide" data-act="cloudoff">Disconnect</button>
    </div>
  </div></section>

  ${designNameSection()}

  <section class="sec"><h3>Shop library <span class="tag">${cloud.designs.length}</span></h3><div class="body">
    ${cloud.designs.length>6?`<div class="row"><input type="text" id="dsFilter" placeholder="Filter by name, machine or material"
      value="${esc(cloud.filter||"")}"></div>`:""}
    ${(() => {
      const q = (cloud.filter||"").toLowerCase();
      const list = cloud.designs.filter(d => !q ||
        [d.name,d.machine,d.material,d.updatedBy].join(" ").toLowerCase().includes(q));
      if(!list.length) return `<div class="empty">${cloud.designs.length?"Nothing matches that":"Nothing saved yet. Name this design above and save it."}</div>`;
      return `<div class="layers">${list.map(d=>{
        const open = cloud.openId===d.id;
        return `<div class="layer" aria-selected="${d.id===cloud.curId}" style="flex-direction:column;align-items:stretch;gap:6px">
          <div style="display:flex;align-items:center;gap:7px">
            <span class="nm">${d.proven?"✓ ":""}${esc(d.name||"Untitled")}
              <em style="display:block;font-style:normal;font-size:11px;color:var(--text-3)">
                ${d.labelW?`${d.labelW}×${d.labelH} mm · `:""}${d.faces||"?"} faces · ${d.locks||"?"} locks
                ${d.machine?" · "+esc(d.machine):""}</em></span>
            <button class="mini" data-detail="${d.id}" title="Details">${open?"▾":"▸"}</button>
            <button class="mini" data-open="${d.id}" title="Open">↧</button>
            <button class="mini" data-rename="${d.id}" data-name="${esc(d.name||"")}" title="Rename">✎</button>
            <button class="mini" data-deldesign="${d.id}" data-name="${esc(d.name||"")}" title="Delete">✕</button>
          </div>
          ${open?`<div class="readout" style="margin:0">
            <b>Lock body</b><span>${d.lockW||"—"} × ${d.lockH||"—"} mm</span>
            <b>Label</b><span>${d.labelW||"—"} × ${d.labelH||"—"} mm</span>
            <b>Padding</b><span>${d.pad!==undefined?d.pad+" mm":"—"}</span>
            <b>Fixture</b><span>${d.fixRows||"?"} × ${d.fixCols||"?"} @ ${d.pitchX||"?"} / ${d.pitchY||"?"} mm</span>
            <b>Field</b><span>${d.field?d.field+" mm":"no limit"}</span>
            ${(d.fixRotated||d.fixSkipped||d.fixMoved)?`<b>Cell edits</b><span>${d.fixRotated||0} rot · ${d.fixSkipped||0} skip · ${d.fixMoved||0} moved</span>`:""}
            <b>Machine</b><span>${esc(d.machine||"—")}${d.machineWatts?" · "+d.machineWatts+" W":""}</span>
            <b>Lens</b><span>${d.lens?d.lens+" mm":"—"}</span>
            <b>Material</b><span>${esc(d.material||"—")}${d.proven?" ✓":""}</span>
            <b>Settings</b><span>${d.speed||"?"} mm/s · ${d.power||"?"}% · ${d.freq||"?"} kHz</span>
            <b>Interval</b><span>${d.interval!==undefined?d.interval+" mm":"—"} · ${d.passes||1}p</span>
            ${d.pulse?`<b>Pulse</b><span>${d.pulse} ns</span>`:""}
            <b>Elements</b><span>${esc(d.elements||"—")}</span>
            <b>Text</b><span>${d.textOut==="live"?"live text":"outlines"}</span>
            <b>Saved</b><span>${esc(d.updatedBy||"")} ${fmtWhen(d.updatedAt)}</span>
            <b>Size</b><span>${d.bytes?Math.round(d.bytes/1024)+" KB":"—"}</span>
          </div>
          <button class="btn sm wide" data-open="${d.id}">Open this design</button>`:""}
        </div>`;}).join("")}</div>`;
    })()}
  </div></section>

  <section class="sec"><h3>Shared roster <span class="tag">${cloud.people.length}</span></h3><div class="body">
    <div class="btnrow split">
      <button class="btn sm" data-act="pullroster">Load into batch</button>
      <button class="btn sm" data-act="pushroster">Share this batch</button>
    </div>
    ${cloud.people.length ? `<div class="layers" style="margin-top:8px;max-height:230px;overflow:auto">
      ${cloud.people.map(p=>`<div class="layer">
        <span class="nm">${esc(((p.first||"")+" "+(p.last||"")).trim()||"—")}
          <em style="display:block;font-style:normal;font-size:11px;color:var(--text-3)">${esc(p.dept||"")}</em></span>
        <button class="mini" data-delperson="${p.id}">✕</button></div>`).join("")}</div>`
      : `<div class="empty" style="margin-top:8px">No shared people yet</div>`}
    <div class="btnrow" style="margin-top:6px"><button class="btn sm ghost wide" data-act="addperson">Add a person</button></div>
  </div></section>

  <section class="sec"><h3>Shared materials <span class="tag">${cloud.presets.length}</span></h3><div class="body">
    ${cloud.presets.length ? `<div class="layers">${cloud.presets.map(p=>{
      const other = p.machineName && p.machineName !== activeMachine().name;
      return `<div class="layer">
        <span class="nm">${p.proven?"✓ ":""}${esc(p.name)}
          <em style="display:block;font-style:normal;font-size:11px;color:${other?"var(--amber)":"var(--text-3)"}">
            ${p.speed} mm/s · ${p.power}% · ${p.freq} kHz · ${p.passes||1}p
            ${p.machineName?" · "+esc(p.machineName):""} · ${esc(p.by||"")}</em></span>
        <button class="mini" data-preset="${p.id}" title="Add to my materials">↧</button>
        <button class="mini" data-delpreset="${p.id}" title="Delete">✕</button>
      </div>`;}).join("")}</div>` : `<div class="empty">Nothing shared yet</div>`}
    <div class="btnrow" style="margin-top:8px">
      <button class="btn sm wide" data-act="savepreset">Share the selected material</button>
    </div>
    <p class="hint">Recipes are stamped with the machine they were proved on. Pull one in from a different
      machine and it lands unverified, with a note, rather than pretending to be trustworthy.</p>
  </div></section>`;
}
function cfgField(label, key, c){
  return `<label class="fld"><span>${label}</span>
    <input type="text" id="cfg_${key}" value="${esc(c[key]||"")}" spellcheck="false" autocapitalize="off"></label>`;
}

function cloudBind(root){
  const g = id => root.querySelector("#"+id);
  root.querySelectorAll("[data-open]").forEach(b=>b.addEventListener("click",()=>cloudOpenDesign(b.dataset.open)));
  root.querySelectorAll("[data-detail]").forEach(b=>b.addEventListener("click",()=>{
    cloud.openId = (cloud.openId===b.dataset.detail) ? null : b.dataset.detail;
    renderRail(true);
  }));
  root.querySelectorAll("[data-rename]").forEach(b=>b.addEventListener("click",()=>
    cloudRenameDesign(b.dataset.rename, b.dataset.name)));
  const filt = root.querySelector("#dsFilter");
  if(filt) filt.addEventListener("input", ()=>{ cloud.filter = filt.value; });
  root.querySelectorAll("[data-deldesign]").forEach(b=>b.addEventListener("click",()=>cloudDeleteDesign(b.dataset.deldesign, b.dataset.name)));
  root.querySelectorAll("[data-delperson]").forEach(b=>b.addEventListener("click",()=>cloudDeletePerson(b.dataset.delperson)));
  root.querySelectorAll("[data-preset]").forEach(b=>b.addEventListener("click",()=>cloudApplyPreset(b.dataset.preset)));
  root.querySelectorAll("[data-delpreset]").forEach(b=>b.addEventListener("click",()=>cloudDeletePreset(b.dataset.delpreset)));
}

async function cloudAction(a){
  switch(a){
    case "cloudsave": {
      const keys = ["projectId","apiKey","appId","authDomain","workspace","messagingSenderId"];
      const c = cloudCfg();
      keys.forEach(k=>{ const el = $("cfg_"+k); if(el) c[k] = el.value.trim(); });
      const am = $("cfgAuthMode"); if(am) c.authMode = am.value;
      if(!c.authDomain && c.projectId) c.authDomain = c.projectId + ".firebaseapp.com";
      if(!c.storageBucket && c.projectId) c.storageBucket = c.projectId + ".appspot.com";
      if(!c.workspace) c.workspace = "shop";
      if(!cloudConfigured(c)){ toast("Project ID, API key and App ID are all required"); return; }
      saveCloudCfg(c); await cloudConnect(); break;
    }
    case "cloudpaste": {
      const raw = prompt("Paste the whole firebaseConfig object or JSON");
      if(!raw) return;
      try{
        const json = raw.replace(/^[^{]*/,"").replace(/[^}]*$/,"")
                        .replace(/([{,]\s*)([A-Za-z0-9_]+)\s*:/g,'$1"$2":')
                        .replace(/'/g,'"').replace(/,(\s*})/g,"$1");
        const o = JSON.parse(json);
        const c = Object.assign(cloudCfg(), o);
        saveCloudCfg(c); ui.panel="cloud"; renderRail();
        toast("Config read — press Connect");
      }catch(e){ toast("Couldn't read that config"); }
      break;
    }
    case "cloudoff": cloudDisconnect(); break;
    case "cloudput": await cloudSaveDesign(false); break;
    case "cloudputnew": await cloudSaveDesign(true); break;
    case "pullroster": cloudPullRoster(); break;
    case "pushroster": await cloudPushRoster(); break;
    case "addperson": await cloudAddPerson(); break;
    case "savepreset": await cloudSavePreset(); break;
  }
}

function cloudBoot(){
  renderCloudChip();
  const chip = $("cloudChip");
  if(chip) chip.addEventListener("click", ()=>showPanel("cloud"));
  if(cloudConfigured()) cloudConnect();
}

</script>
