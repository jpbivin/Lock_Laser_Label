/* ============================================================================
   MARKBENCH — contour tracer

   Turns a 1-bit bitmap into closed vector outlines so a logo marks as real
   geometry instead of as an image fill.

   Method: crack following. Every ink pixel contributes the lattice edges where
   its neighbour is empty, directed so ink always sits on the same side. Those
   directed edges are then stitched into closed loops, so holes (the middle of
   an O, the gap in an A) fall out on their own with the opposite winding and
   fill correctly under even-odd.

   Output rings are normalised to 0..1 across the traced frame, which makes them
   independent of trace resolution and safe to scale.
   ========================================================================== */

const TRACE_MAX_PX = 1_800_000;     // ~1340 x 1340; plenty for a lock-body logo
const TRACE_MAX_SIDE = 1600;
/* Small sources get scaled UP before tracing. Interpolation turns a hard pixel
   staircase into a graded edge, and thresholding that graded edge lands much
   closer to the true curve than the original pixel corners would. */
const TRACE_MIN_SIDE = 900;

/* --- luminance + threshold ------------------------------------------------ */
function inkMask(data, W, H, thresh, invert){
  const ink = new Uint8Array(W*H);
  for(let i=0, p=0; i<ink.length; i++, p+=4){
    const a = data[p+3];
    let g = 0.299*data[p] + 0.587*data[p+1] + 0.114*data[p+2];
    if(invert) g = 255-g;
    if(a < 16) g = 255;             // transparent counts as background
    ink[i] = g < thresh ? 1 : 0;
  }
  return ink;
}

/* --- crack following ------------------------------------------------------ */
function traceMask(ink, W, H){
  const at = (x,y) => (x<0||y<0||x>=W||y>=H) ? 0 : ink[y*W+x];
  const stride = W+1;
  const key = (x,y) => y*stride + x;

  /* every lattice point keeps the edges that leave it */
  const out = new Map();
  const add = (x0,y0,x1,y1) => {
    const k = key(x0,y0);
    let a = out.get(k);
    if(!a){ a = []; out.set(k, a); }
    a.push([x1, y1, 0]);            // [endX, endY, used]
  };
  for(let y=0; y<H; y++){
    const row = y*W;
    for(let x=0; x<W; x++){
      if(!ink[row+x]) continue;
      if(!at(x,   y-1)) add(x,   y,   x+1, y  );   // top,    heading +x
      if(!at(x+1, y  )) add(x+1, y,   x+1, y+1);   // right,  heading +y
      if(!at(x,   y+1)) add(x+1, y+1, x,  y+1);    // bottom, heading -x
      if(!at(x-1, y  )) add(x,   y+1, x,  y  );    // left,   heading -y
    }
  }

  const loops = [];
  const guardMax = 4*W*H + 16;

  for(const [startKey, edges] of out){
    for(const seed of edges){
      if(seed[2]) continue;
      const sx = startKey % stride, sy = (startKey - sx)/stride;
      seed[2] = 1;

      const pts = [[sx, sy]];
      let px = sx, py = sy;
      let nx = seed[0], ny = seed[1];
      let dx = nx-px, dy = ny-py;
      let guard = 0;

      while((nx !== sx || ny !== sy) && guard++ < guardMax){
        pts.push([nx, ny]);
        const list = out.get(key(nx, ny));
        if(!list){ break; }
        /* At a four-way lattice point two edges leave it. Turning the same way
           every time keeps the walk on one region instead of hopping across
           the diagonal pinch. Order: turn, then straight, then the other turn. */
        const want = [[-dy, dx], [dx, dy], [dy, -dx], [-dx, -dy]];
        let next = null;
        for(const [wx, wy] of want){
          next = list.find(c => !c[2] && (c[0]-nx)===wx && (c[1]-ny)===wy);
          if(next) break;
        }
        if(!next) next = list.find(c => !c[2]);
        if(!next) break;
        next[2] = 1;
        px = nx; py = ny;
        nx = next[0]; ny = next[1];
        dx = nx-px; dy = ny-py;
      }
      if(pts.length >= 4) loops.push(pts);
    }
  }
  return loops;
}

/* --- geometry helpers ----------------------------------------------------- */
function ringArea(r){
  let a = 0;
  for(let i=0, n=r.length; i<n; i++){
    const p = r[i], q = r[(i+1)%n];
    a += p[0]*q[1] - q[0]*p[1];
  }
  return a/2;
}
function dropCollinear(r){
  const out = [];
  const n = r.length;
  for(let i=0;i<n;i++){
    const a = r[(i-1+n)%n], b = r[i], c = r[(i+1)%n];
    const cross = (b[0]-a[0])*(c[1]-a[1]) - (b[1]-a[1])*(c[0]-a[0]);
    if(cross !== 0) out.push(b);
  }
  return out.length >= 3 ? out : r;
}
/* Douglas–Peucker on an open polyline */
function dpOpen(pts, tol){
  if(pts.length < 3) return pts.slice();
  const keep = new Uint8Array(pts.length);
  keep[0] = keep[pts.length-1] = 1;
  const stack = [[0, pts.length-1]];
  const t2 = tol*tol;
  while(stack.length){
    const [i, j] = stack.pop();
    if(j <= i+1) continue;
    const ax = pts[i][0], ay = pts[i][1];
    const bx = pts[j][0], by = pts[j][1];
    const ex = bx-ax, ey = by-ay;
    const len2 = ex*ex + ey*ey;
    let far = -1, fd = -1;
    for(let k=i+1; k<j; k++){
      const px = pts[k][0]-ax, py = pts[k][1]-ay;
      let d2;
      if(len2 === 0){ d2 = px*px + py*py; }
      else {
        let t = (px*ex + py*ey)/len2;
        t = t<0 ? 0 : t>1 ? 1 : t;
        const qx = px - t*ex, qy = py - t*ey;
        d2 = qx*qx + qy*qy;
      }
      if(d2 > fd){ fd = d2; far = k; }
    }
    if(fd > t2 && far > 0){
      keep[far] = 1;
      stack.push([i, far], [far, j]);
    }
  }
  const out = [];
  for(let i=0;i<pts.length;i++) if(keep[i]) out.push(pts[i]);
  return out;
}
/* DP on a closed ring: anchor at the two most distant points so the start
   vertex doesn't become an artificial corner */
function dpClosed(ring, tol){
  const n = ring.length;
  if(n < 5 || tol <= 0) return ring;
  let a = 0, best = -1;
  for(let i=1;i<n;i++){
    const dx = ring[i][0]-ring[0][0], dy = ring[i][1]-ring[0][1];
    const d = dx*dx + dy*dy;
    if(d > best){ best = d; a = i; }
  }
  const first = ring.slice(0, a+1);
  const second = ring.slice(a).concat([ring[0]]);
  const s1 = dpOpen(first, tol);
  const s2 = dpOpen(second, tol);
  const merged = s1.concat(s2.slice(1, -1));
  return merged.length >= 3 ? merged : ring;
}

/* --- the public entry point ----------------------------------------------- */
/* returns { rings, points, W, H } — rings normalised to 0..1, y down */
function traceImageData(imgData, W, H, opt){
  const ink = inkMask(imgData, W, H, opt.thresh, opt.invert);
  let loops = traceMask(ink, W, H);

  const minArea = Math.max(0, opt.minArea||0);
  const tol = Math.max(0, opt.tol||0);
  const rings = [];
  let points = 0;

  for(let r of loops){
    if(Math.abs(ringArea(r)) < minArea) continue;   // specks and stray pixels
    r = dropCollinear(r);
    if(tol > 0) r = dpClosed(r, tol);
    if(r.length < 3) continue;
    if(Math.abs(ringArea(r)) < minArea) continue;
    points += r.length;
    rings.push(r.map(p => [p[0]/W, p[1]/H]));
  }
  /* biggest shapes first keeps the fill order sane in LightBurn */
  rings.sort((a,b)=>Math.abs(ringArea(b))-Math.abs(ringArea(a)));
  return { rings, points, W, H };
}

/* --- run it against an element ------------------------------------------- */
async function traceElement(el){
  if(!el.raw) return;
  const im = await loadImg(el.raw);
  let W = im.naturalWidth || 300, H = im.naturalHeight || 200;
  const side = Math.max(W, H);
  let k = 1;
  if(side < TRACE_MIN_SIDE) k = TRACE_MIN_SIDE/side;
  if(side > TRACE_MAX_SIDE) k = TRACE_MAX_SIDE/side;
  if(W*k * H*k > TRACE_MAX_PX) k = Math.sqrt(TRACE_MAX_PX/(W*H));
  W = Math.max(8, Math.round(W*k));
  H = Math.max(8, Math.round(H*k));

  const cv = document.createElement("canvas");
  cv.width = W; cv.height = H;
  const cx = cv.getContext("2d", {willReadFrequently:true});
  cx.imageSmoothingQuality = "high";
  cx.drawImage(im, 0, 0, W, H);
  const d = cx.getImageData(0, 0, W, H);

  /* the speck filter is authored as a resolution-independent number */
  const minAreaPx = (el.traceMin||0) * (W*H) / 100000;

  const res = traceImageData(d.data, W, H, {
    thresh: el.thresh, invert: el.invert,
    tol: el.traceTol, minArea: minAreaPx
  });

  el.paths = res.rings.map(r => r.map(p => [Math.round(p[0]*1e4)/1e4,
                                            Math.round(p[1]*1e4)/1e4]));
  el.tracePts = res.points;
  el.traceRes = W + "×" + H;
  el.data = null;                              // the raster isn't needed now
  el.bmp = null;
  el.bytes = new Blob([JSON.stringify(el.paths)]).size;
}


/* ============================================================================
   TEXT → OUTLINES

   LightBurn's text shape anchors vertically in a way its file format doesn't
   document, and the shop PC may not even have the font. Both problems vanish
   if we hand over geometry instead of text: render the run ourselves at high
   resolution, trace it with the same contour tracer used for logos, and emit
   closed paths positioned from the pen origin and baseline we already computed.

   What you see in the editor is then what lands on the part.
   ========================================================================== */

const TEXT_PPI = 700;            // raster resolution for tracing glyphs
const TEXT_TOL = 0.55;           // px at that resolution ≈ 0.02 mm deviation
const _textRings = new Map();

function textRingsKey(str, o){
  return [str, o.font, o.bold?1:0, o.italic?1:0,
          Math.round(o.cap*1e4), Math.round(o.track||0)].join("\u0001");
}

/* returns rings in INCHES, offset from the pen origin (x) and baseline (y) */
function textRings(str, o){
  if(!str) return [];
  const key = textRingsKey(str, o);
  const hit = _textRings.get(key);
  if(hit) return hit;

  const fsIn = o.cap / CAPR;
  let scale = TEXT_PPI;
  if(fsIn*scale < 40) scale = 40/fsIn;             // keep small type legible to the tracer
  if(fsIn*scale > 400) scale = 400/fsIn;           // and keep big type cheap
  const fsPx = fsIn*scale;

  const cv = document.createElement("canvas");
  const cx = cv.getContext("2d", {willReadFrequently:true});
  const font = (o.italic?"italic ":"") + (o.bold?"700 ":"400 ") + fsPx + "px " +
               "'" + o.font + "', Arial, sans-serif";
  cx.font = font;

  const space = fsPx * (o.track||0)/1000;
  const m = cx.measureText(str);
  const advance = m.width + space*Math.max(0, str.length-1);
  const asc  = (m.actualBoundingBoxAscent  != null && isFinite(m.actualBoundingBoxAscent))
             ? m.actualBoundingBoxAscent  : fsPx*0.85;
  const desc = (m.actualBoundingBoxDescent != null && isFinite(m.actualBoundingBoxDescent))
             ? m.actualBoundingBoxDescent : fsPx*0.30;

  const padPx = Math.ceil(fsPx*0.25) + 4;
  const W = Math.max(8, Math.ceil(advance) + padPx*2);
  const H = Math.max(8, Math.ceil(asc + desc) + padPx*2);
  if(W*H > TRACE_MAX_PX) return [];                // absurdly long run; leave it as text

  cv.width = W; cv.height = H;
  const g = cv.getContext("2d", {willReadFrequently:true});
  g.fillStyle = "#ffffff"; g.fillRect(0,0,W,H);
  g.font = font;
  g.textAlign = "left";
  g.textBaseline = "alphabetic";
  g.fillStyle = "#000000";

  const ox = padPx, oy = padPx + asc;
  if(space === 0){
    g.fillText(str, ox, oy);
  } else {
    /* place each glyph at the advance of the prefix, so kerning survives and
       the total width matches what the layout engine measured */
    for(let i=0;i<str.length;i++){
      const at = g.measureText(str.slice(0,i)).width + i*space;
      g.fillText(str[i], ox + at, oy);
    }
  }

  const res = traceImageData(g.getImageData(0,0,W,H).data, W, H,
                             {thresh:128, invert:false, tol:TEXT_TOL, minArea:1.5});

  /* normalised -> pixels -> inches relative to (pen origin, baseline) */
  const rings = res.rings.map(r => r.map(q => [
    (q[0]*W - ox)/scale,
    (q[1]*H - oy)/scale
  ]));

  if(_textRings.size > 500) _textRings.clear();
  _textRings.set(key, rings);
  return rings;
}

/* swap text primitives for traced geometry, baking in any rotation */
function outlineText(prims){
  const out = [];
  for(const p of prims){
    if(p.t !== "text"){ out.push(p); continue; }
    let rings;
    try{
      rings = textRings(p.str, {font:p.font, bold:p.bold, italic:p.italic,
                                cap:p.cap, track:p.track});
    }catch(e){ rings = null; }
    if(!rings || !rings.length){ out.push(p); continue; }   // fall back to live text
    out.push({ t:"poly", filled:true, invert:p.invert, fromText:true,
               rings: rings.map(r => r.map(q =>
                 rotPt([p.x + q[0], p.y + q[1]], p.rc[0], p.rc[1], p.rot))) });
  }
  return mergeKnockouts(out);
}
/* Knocked-out text over a filled bar previously relied on LightBurn's
   "fill all shapes at once" setting to cut the letters out. Now that the text
   is geometry, fold the letter rings into the bar as holes instead — one shape
   with even-odd winding, which fills correctly whatever the layer is set to. */
function mergeKnockouts(prims){
  const out = prims.slice();
  for(let i=0;i<out.length;i++){
    const t = out[i];
    if(!(t.t==="poly" && t.fromText && t.invert)) continue;
    let host = -1;
    for(let j=i-1;j>=0;j--){
      const h = out[j];
      const box = h.t==="rect" && h.filled && !h.rx && !h.rot
        ? {x:h.x, y:h.y, w:h.w, h:h.h} : null;
      if(!box) continue;
      const fits = t.rings.every(r => r.every(q =>
        q[0] >= box.x-1e-6 && q[0] <= box.x+box.w+1e-6 &&
        q[1] >= box.y-1e-6 && q[1] <= box.y+box.h+1e-6));
      if(fits){ host = j; break; }
    }
    if(host < 0) continue;
    const h = out[host];
    out[host] = { t:"poly", filled:true, knockHost:true, rings:[
      [[h.x,h.y],[h.x+h.w,h.y],[h.x+h.w,h.y+h.h],[h.x,h.y+h.h]],
      ...t.rings
    ]};
    out.splice(i,1); i--;
  }
  return out;
}

function countOutlinePoints(){
  let n = 0;
  sheetFaces().faces.forEach(f => outlineText(f.prims).forEach(p => {
    if(p.t==="poly") p.rings.forEach(r => n += r.length);
  }));
  return n;
}

/* ============================================================================
   MARKBENCH — panels, image pipeline, laser recipes, export, boot
   ========================================================================== */

/* -------------------------------------------------------- laser settings --- */
function laserEffective(){
  const L = doc.laser, M = activeMachine();
  if(L.manual) return clampToMachine({ speed:L.speed, power:L.power, freq:L.freq,
                                       interval:L.interval, passes:L.passes, pulse:L.pulse });
  const m = activeMaterial(), n = L.trim||0;
  return clampToMachine({ speed: Math.round(m.speed*Math.pow(0.82,n)/10)*10,
                          power: Math.round(m.power*Math.pow(1.05,n)),
                          freq:m.freq, interval:m.interval, passes:m.passes, pulse:m.pulse });
}

/* ------------------------------------------------------------ image pipe --- */
const _imgCache = new Map();
function loadImg(src){
  if(_imgCache.has(src)) return Promise.resolve(_imgCache.get(src));
  return new Promise((res,rej)=>{
    const im = new Image();
    im.onload = ()=>{ _imgCache.set(src,im); res(im); };
    im.onerror = ()=>rej(new Error("image"));
    im.src = src;
  });
}
function readFile(file){
  return new Promise((res,rej)=>{
    const fr = new FileReader();
    fr.onload = ()=>res(fr.result); fr.onerror = ()=>rej(new Error("read"));
    fr.readAsDataURL(file);
  });
}
async function ingestImage(el, file){
  const uploaded = await readFile(file);
  el.isSvg = /^data:image\/svg/.test(uploaded);
  let im = null;
  try{ im = await loadImg(uploaded); }catch(e){}
  el.srcW = (im && im.naturalWidth) || 300;
  el.srcH = (im && im.naturalHeight) || 200;

  /* Store a working copy at trace resolution instead of the original. A 4 MB
     phone photo has no business riding along in the project file. */
  el.raw = uploaded;
  if(im && !el.isSvg){
    const side = Math.max(el.srcW, el.srcH);
    if(side > TRACE_MAX_SIDE){
      const k = TRACE_MAX_SIDE/side;
      const w = Math.max(8, Math.round(el.srcW*k)), h = Math.max(8, Math.round(el.srcH*k));
      const cv = document.createElement("canvas");
      cv.width = w; cv.height = h;
      const cx = cv.getContext("2d");
      cx.imageSmoothingQuality = "high";
      cx.drawImage(im, 0, 0, w, h);
      el.raw = cv.toDataURL("image/png");
    }
  }
  if(el.keepAR && el.srcW && el.srcH){
    const b = boxOf(el);
    setBox(el, {x:b.x, y:b.y, w:b.w, h:b.w*el.srcH/el.srcW});
  }
  el.name = file.name.replace(/\.[^.]+$/,"").slice(0,24) || el.name;
  await processImage(el);
}
async function processImage(el){
  if(!el.raw) return;
  if(el.render === "trace"){ await traceElement(el); return; }
  el.paths = null; el.tracePts = 0;
  if(el.isSvg && el.mode==="original"){
    el.data = el.raw; el.bmp = null;
    el.bytes = Math.round(el.raw.length*0.75); return;
  }
  const im = await loadImg(el.raw);
  const targetW = Math.max(24, Math.min(4000, Math.round(el.w * el.dpi)));
  const scale = Math.min(1, targetW/(im.naturalWidth||targetW));
  const W = Math.max(8, Math.round((im.naturalWidth||targetW)*scale));
  const H = Math.max(8, Math.round((im.naturalHeight||targetW)*scale));
  const cv = document.createElement("canvas");
  cv.width = W; cv.height = H;
  const cx = cv.getContext("2d", {willReadFrequently:true});
  cx.imageSmoothingQuality = "high";
  cx.drawImage(im, 0, 0, W, H);
  if(el.mode!=="original"){
    const d = cx.getImageData(0,0,W,H), a = d.data;
    for(let i=0;i<a.length;i+=4){
      let g = 0.299*a[i] + 0.587*a[i+1] + 0.114*a[i+2];
      if(el.invert) g = 255-g;
      if(el.mode==="threshold"){
        const on = g < el.thresh;                  // dark pixels are the mark
        a[i]=a[i+1]=a[i+2] = on?0:255;
        a[i+3] = on ? Math.max(a[i+3],255) : 0;    // white becomes clear
      } else {
        a[i]=a[i+1]=a[i+2] = g;
      }
    }
    cx.putImageData(d,0,0);
  }
  el.data = cv.toDataURL("image/png");
  el.bytes = Math.round(el.data.length*0.75);

  /* LightBurn wants an opaque raster — flatten the transparency onto white */
  const fl = document.createElement("canvas");
  fl.width = W; fl.height = H;
  const fx = fl.getContext("2d");
  fx.fillStyle = "#ffffff"; fx.fillRect(0,0,W,H);
  fx.drawImage(cv, 0, 0);
  el.bmp = { w:W, h:H, data: fl.toDataURL("image/png").split(",")[1] };
}

/* ------------------------------------------------------------ small util --- */
const $ = id => document.getElementById(id);
function toast(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove("show"), 2200);
}
function download(name, text, mime){
  const b = new Blob([text], {type:mime||"application/octet-stream"});
  const u = URL.createObjectURL(b), a = document.createElement("a");
  a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(u), 5000);
}
function setByPath(path, v){
  const parts = path.split(".");
  const root = parts.shift();
  let o = root==="el" ? firstSel() : root==="ui" ? ui : doc;
  if(!o) return;
  while(parts.length>1) o = o[parts.shift()];
  o[parts[0]] = v;
}
function getByPath(path){
  const parts = path.split(".");
  const root = parts.shift();
  let o = root==="el" ? firstSel() : root==="ui" ? ui : doc;
  for(const p of parts){ if(o==null) return undefined; o = o[p]; }
  return o;
}

/* -------------------------------------------------------- field builders --- */
function fLen(label, path, opt){
  const v = getByPath(path);
  return `<label class="fld"><span>${label} (${U.label()})</span>
    <input type="number" step="${U.step()}" ${opt&&opt.min!==undefined?`min="${opt.min}"`:""}
      value="${U.toDisp(v||0).toFixed(doc.units==="in"?3:2)}" data-bind="${path}" data-kind="len"></label>`;
}
function fBedY(label, path){
  const v = toBedY(getByPath(path)||0);
  return `<label class="fld"><span>${label} (${U.label()})</span>
    <input type="number" step="${U.step()}"
      value="${U.toDisp(v).toFixed(doc.units==="in"?3:2)}" data-bind="${path}" data-kind="bedy"></label>`;
}
function fNum(label, path, step, min, max){
  return `<label class="fld"><span>${label}</span>
    <input type="number" step="${step||1}" ${min!==undefined?`min="${min}"`:""} ${max!==undefined?`max="${max}"`:""}
      value="${getByPath(path)}" data-bind="${path}" data-kind="num"></label>`;

function fText(label, path){
  return `<label class="fld"><span>${label}</span>
    <input type="text" value="${esc(getByPath(path)??"")}" data-bind="${path}"></label>`;
}
function fArea(label, path, rows){
  return `<label class="fld"><span>${label}</span>
    <textarea rows="${rows||3}" data-bind="${path}">${esc(getByPath(path)??"")}</textarea></label>`;
}
function fSel(label, path, opts, kind){
  const cur = getByPath(path);
  const curS = (cur===null||cur===undefined) ? "" : String(cur);
  return `<label class="fld"><span>${label}</span><select data-bind="${path}"${kind?` data-kind="${kind}"`:""}>`
    + opts.map(o=>{ const [v,t] = Array.isArray(o)?o:[o,o];
        return `<option value="${esc(v)}"${String(v)===curS?" selected":""}>${esc(t)}</option>`; }).join("")
    + `</select></label>`;
}
function fChk(label, path){
  return `<label class="chk"><input type="checkbox" ${getByPath(path)?"checked":""}
    data-bind="${path}" data-kind="bool"><span>${label}</span></label>`;
}
function fSeg(label, path, opts){
  const raw = getByPath(path);
  const cur = String(raw === undefined ? "" : raw);
  return `<label class="fld"><span>${label}</span><div class="seg" data-seg="${path}">`
    + opts.map(([v,t])=>`<button type="button" data-v="${esc(v)}" aria-pressed="${String(v)===cur}">${esc(t)}</button>`).join("")
    + `</div></label>`;
}
function fAnchor(path){
  const cur = getByPath(path);
  const ids = ["tl","tc","tr","ml","mc","mr","bl","bc","br"];
  return `<label class="fld"><span>Anchor to safe area</span><div class="anchor9" data-anchor="${path}">`
    + ids.map(i=>`<button type="button" data-v="${i}" aria-pressed="${i===cur}" title="${i}"></button>`).join("")
    + `</div></label>`;
}

const RAIL_TABS = [["props","Element"],["design","Stock"],["batch","Batch"],["fixture","Fixture"],
                   ["machine","Machine"],["material","Material"],["cloud","Cloud"],["export","Export"]];

/* A rebuild replaces every node in the panel, which would rip focus out of
   whatever the user is typing in. So: if a text field in the panel has focus,
   mark the panel dirty and rebuild when they leave it. The stage and status
   bar still update live — only the panel's own re-render waits. */
function railIsBeingTyped(){
  const a = document.activeElement, host = $("railBody");
  return !!(a && host && host.contains(a) &&
            (a.tagName==="INPUT" || a.tagName==="TEXTAREA"));
}
function renderRail(force){
  if(!force && railIsBeingTyped()){ ui.railDirty = true; return; }
  ui.railDirty = false;
  const tabs = `<div class="sec"><div class="body" style="padding-top:10px">
    <div class="tabgrid" id="railTabs">${RAIL_TABS.map(([v,t])=>
      `<button type="button" data-tab="${v}" aria-pressed="${ui.panel===v}">${t}</button>`).join("")}</div>
  </div></div>`;
  let body = "";
  if(ui.panel==="props")  body = panelProps();
  else if(ui.panel==="design") body = panelDesign();
  else if(ui.panel==="batch")  body = panelBatch();
  else if(ui.panel==="fixture") body = panelFixture();
  else if(ui.panel==="machine")  body = panelMachine();
  else if(ui.panel==="material") body = panelMaterial();
  else if(ui.panel==="cloud")  body = panelCloud();
  else body = panelExport();
  $("railBody").innerHTML = tabs + body;
  bindPanel($("railBody"));
  cloudBind($("railBody"));
}
function renderProps(){ if(ui.panel==="props") renderRail(); }

/* A miniature of the bed: one button per pocket showing which side it marks.
   Tap to step to the next side, then to empty. */
function assignGrid(){
  const F = doc.fixture;
  const rows = Math.max(1, Math.round(F.rows)), cols = Math.max(1, Math.round(F.cols));
  let g = `<div class="cellgrid" style="grid-template-columns:repeat(${cols},minmax(0,1fr))">`;
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    const k = cellKey(r,c);
    const skipped = !!F.skipped[k];
    const fi = (F.assign||{})[k];
    const has = fi !== null && fi !== undefined && doc.faces[fi];
    const sel = ui.fixSel===k;
    const label = skipped ? "—" : has ? `<b>${fi+1}</b>` : "·";
    const title = skipped ? `Row ${r+1}, column ${c+1} — skipped`
                : has ? `Row ${r+1}, column ${c+1} — ${doc.faces[fi].name}`
                : `Row ${r+1}, column ${c+1} — empty`;
    g += `<button type="button" class="cellbtn${sel?" sel":""}${skipped?" off":""}"
      data-cell="${k}" title="${esc(title)}">${label}${F.rot[k]?`<i>${F.rot[k]}°</i>`:""}</button>`;
  }
  return g + `</div>`;
}

/* ------------------------------------------------------- panel behaviour --- */
function bindPanel(root){
  root.querySelectorAll("[data-bind]").forEach(inp=>{
    const numeric = inp.dataset.kind==="len" || inp.dataset.kind==="num" || inp.dataset.kind==="bedy";
    const ev = (inp.type==="checkbox"||inp.tagName==="SELECT") ? "change" : "input";

    /* "1." and "-" and "" are on the way to a number, not a number. Committing
       them would snap the value to 0 and fight the person typing. */
    const partial = t => t==="" || t==="-" || t==="." || t==="-." ||
                         /^-?\d*\.$/.test(t) || !/^-?\d*\.?\d*$/.test(t);

    if(numeric){
      inp.addEventListener("focus", ()=>{ try{ inp.select(); }catch(e){} });
      inp.addEventListener("blur", ()=>{
        const t = inp.value.trim();
        if(partial(t)){                       // put back what the model actually holds
          const cur = getByPath(inp.dataset.bind);
          inp.value = inp.dataset.kind==="len"
            ? U.toDisp(cur||0).toFixed(doc.units==="in"?3:2)
            : inp.dataset.kind==="bedy"
            ? U.toDisp(toBedY(cur||0)).toFixed(doc.units==="in"?3:2)
            : (cur ?? 0);
        }
      });
    }

    inp.addEventListener(ev, async ()=>{
      const path = inp.dataset.bind, kind = inp.dataset.kind||"raw";
      let v;
      if(kind==="bool") v = inp.checked;
      else if(numeric){
        const t = inp.value.trim();
        if(partial(t)) return;                // wait for the rest of the number
        const n = parseFloat(t);
        if(!isFinite(n)) return;
        v = kind==="len" ? U.fromDisp(n)
          : kind==="bedy" ? fromBedY(U.fromDisp(n))
          : n;
      }
      else v = inp.value;
      if(path.startsWith("ui.")){
        if(kind==="raw" && typeof v==="string" && v.trim()!=="" && isFinite(+v)) v = +v;
        ui[path.slice(3)] = v; drawStage(); return;
      }
      setByPath(path, v);
      if(inp.dataset.reproc){
        const lab = inp.parentElement && inp.parentElement.querySelector("span");
        if(lab){
          const stem = inp.dataset.relabel || "Threshold";
          lab.textContent = stem==="Simplify"
            ? `Simplify ${(+v).toFixed(2)} px — higher is lighter, lower is truer`
            : stem==="Drop specks under" ? `Drop specks under ${Math.round(v)} px²`
            : `Threshold ${Math.round(v)}`;
        }
        const el=firstSel(); if(el){ await processImage(el); drawStage(); }
      }
      await afterEdit(path);
    });
  });
  root.querySelectorAll("[data-seg]").forEach(seg=>{
    seg.addEventListener("click", async e=>{
      const b = e.target.closest("button[data-v]"); if(!b) return;
      const path = seg.dataset.seg;
      let v = b.dataset.v;
      if(v==="true") v = true; else if(v==="false") v = false;
      [...seg.children].forEach(c=>c.setAttribute("aria-pressed", c===b));
      if(path==="doc.units"){ doc.units = v; renderRail(); drawStage(); updateStatus(); return; }
      setByPath(path, v);
      if(path==="el.output"){ const e = firstSel(); if(e) setBox(e, boxOf(e)); renderRail(true); }
      await afterEdit(path);
    });
  });
  root.querySelectorAll("[data-anchor]").forEach(a=>{
    a.addEventListener("click", e=>{
      const b = e.target.closest("button[data-v]"); if(!b) return;
      const el = firstSel(); if(!el) return;
      reanchor(el, b.dataset.v);
      renderRail(); drawStage();
    });
  });
  root.querySelectorAll("[data-cell]").forEach(b=>b.addEventListener("click",()=>{
    const k = b.dataset.cell;
    if(doc.fixture.skipped[k]) return;
    if(ui.stageMode!=="fixture") setStageMode("fixture");
    ui.fixSel = k;
    cycleCell(k);
    fixtureChanged();
  }));
  root.querySelectorAll("[data-fillside]").forEach(b=>b.addEventListener("click",()=>{
    assignAll(parseInt(b.dataset.fillside)||0); fixtureChanged();
  }));
  root.querySelectorAll("[data-asg]").forEach(sel=>sel.addEventListener("change",()=>{
    if(!ui.fixSel) return;
    if(sel.value==="") delete doc.fixture.assign[ui.fixSel];
    else doc.fixture.assign[ui.fixSel] = parseInt(sel.value);
    fixtureChanged();
  }));
  const cr = root.querySelector("[data-cellrot]");
  if(cr) cr.addEventListener("click", e=>{
    const b = e.target.closest("button[data-v]"); if(!b || !ui.fixSel) return;
    const deg = parseInt(b.dataset.v)||0;
    if(deg) doc.fixture.rot[ui.fixSel] = deg; else delete doc.fixture.rot[ui.fixSel];
    fixtureChanged();
  });
  const rq = root.querySelector("[data-rotq]");
  if(rq) rq.addEventListener("click", e=>{
    const b = e.target.closest("button[data-v]"); if(!b) return;
    const el = firstSel(); if(!el) return;
    el.rot = parseFloat(b.dataset.v); renderRail(); drawStage();
  });
  root.querySelectorAll("[data-token]").forEach(t=>{
    t.addEventListener("click", ()=>{
      const el = firstSel(); if(!el || el.type!=="text") return;
      const ta = root.querySelector('textarea[data-bind="el.text"]');
      const pos = ta ? ta.selectionStart : el.text.length;
      el.text = el.text.slice(0,pos) + t.dataset.token + el.text.slice(pos);
      renderRail(); drawStage();
    });
  });
  root.querySelectorAll("#railTabs button").forEach(b=>{
    b.addEventListener("click", ()=>{ ui.panel = b.dataset.tab; renderRail(true); syncNav(); });
  });
  const lensInput = root.querySelector("[data-lenses]");
  if(lensInput) lensInput.addEventListener("change", ()=>{
    const i = +lensInput.dataset.lenses;
    const v = lensInput.value.split(/[,\s]+/).map(x=>parseFloat(x)).filter(x=>x>0);
    doc.machines[i].lenses = v.length ? v : [doc.machines[i].lens];
    renderRail(); saveLocal();
  });
  root.querySelectorAll("[data-act]").forEach(b=> b.addEventListener("click", ()=>action(b.dataset.act)));
  if(root.querySelector("#roster")) renderRoster();
}

async function afterEdit(path){
  if(path.startsWith("doc.label")||path==="doc.pad"||path.startsWith("doc.lock")) reflowAll();
  const el = firstSel();
  if(el && path.startsWith("el.")){
    if(path==="el.w"||path==="el.h") setBox(el, boxOf(el));
    if(el.type==="image" && /^el\.(dpi|mode|invert|render|traceTol|traceMin|thresh|w|h)$/.test(path)){
      await processImage(el);
      if(path==="el.render") renderRail(true);
    }
  }
  drawStage(); updateStatus(); renderLayers(); saveLocal();
  if(path==="doc.machineId"){
    if(!machineMaterials().some(m=>m.id===doc.laser.materialId)){
      const first = machineMaterials()[0];
      if(first) doc.laser.materialId = first.id;
    }
    doc.laser.trim = 0; doc.laser.manual = false;
    renderRail(); updateStatus();
  }
  if(path==="doc.laser.materialId"){ doc.laser.trim=0; doc.laser.manual=false; renderRail(); }
  if(path==="doc.textOut") renderRail(true);
  if(path==="doc.bedOrigin"){ drawStage(); renderRail(true); }
  if(path==="doc.fixture.manual"){
    if(doc.fixture.manual && !Object.keys(doc.fixture.assign||{}).length) seedAssignment();
    fixtureChanged();
  }
  if(path.startsWith("doc.machines")||path.startsWith("doc.materials")) renderRail();
  if(path.startsWith("doc.fixture")){
    doc.fixture.batch = clamp(doc.fixture.batch||0, 0, batchCount()-1);
    renderRail();
  }
  if(path.startsWith("doc.laser.")&&doc.laser.manual!==true&&/speed|power|freq|interval|passes|pulse/.test(path)) doc.laser.manual = true;
  if(path.startsWith("doc.sheet")||path.startsWith("doc.laser")||path==="doc.pad"||path.startsWith("doc.label")){
    if(ui.panel==="batch"||ui.panel==="material"||ui.panel==="export"||ui.panel==="fixture") renderRail();
  }
}

/* ------------------------------------------------------------- actions --- */
async function action(a){
  if(/^(cloud|pull|push|addperson|savepreset)/.test(a)) return cloudAction(a);
  const el = firstSel();
  switch(a){
    case "pickimg": {
      if(!el) return;
      const f = $("fileImg");
      f.value = "";
      f.onchange = async ()=>{ if(f.files[0]){
        await ingestImage(el, f.files[0]);
        renderRail(true); drawStage(); renderLayers(); saveLocal();
        toast(el.render==="trace"
          ? "Traced to " + (el.paths?el.paths.length:0) + " outlines"
          : "Graphic loaded and compressed");
      } };
      f.click(); break;
    }
    case "clearimg": if(el){ el.raw=el.data=el.bmp=el.paths=null; el.bytes=0; el.tracePts=0;
      renderRail(true); drawStage(); } break;
    case "retrace": if(el){ await processImage(el); renderRail(true); drawStage(); saveLocal();
      toast((el.paths?el.paths.length:0)+" outlines"); } break;
    case "fitcontent": {
      if(!el) return;
      const b = boxOf(el);
      if(el.type==="text"){
        const L = layoutText(el, {...b, w:safeRect().w}, rosterCtx(ui.previewIdx));
        setBox(el, {x:b.x, y:b.y, w:Math.min(safeRect().w, L.maxW*1.02), h:L.totH*1.05});
      } else if(el.type==="image" && el.srcW){
        setBox(el, {x:b.x, y:b.y, w:b.w, h:b.w*el.srcH/el.srcW});
      }
      renderRail(); drawStage(); break;
    }
    case "fillsafe": { if(!el) return; const s=safeRect(); setBox(el,{x:s.x,y:s.y,w:s.w,h:s.h}); renderRail(); drawStage(); break; }
    case "addrow": doc.roster.push({first:"",last:"",dept:""}); renderRail(); drawStage(); break;
    case "clearroster": doc.roster = doc.roster.map(()=>({first:"",last:"",dept:""})); renderRail(); drawStage(); break;
    case "hardreload": {
      const u = new URL(location.href);
      u.searchParams.set("v", Date.now().toString(36));
      location.replace(u.toString());
      break;
    }
    case "gocloud": showPanel("cloud"); break;
    case "gofixture": setStageMode("fixture"); showPanel("fixture"); break;
    case "fxcenter": centerArray(); fixtureChanged(); break;
    case "fxfit": fitArrayToField(); fixtureChanged(); fitView(); break;
    case "fxprev": doc.fixture.batch = Math.max(0, (doc.fixture.batch||0)-1); fixtureChanged(); break;
    case "fxnext": doc.fixture.batch = Math.min(batchCount()-1, (doc.fixture.batch||0)+1); fixtureChanged(); break;
    case "fxtoggle": {
      if(!ui.fixSel) return;
      const F = doc.fixture;
      if(F.skipped[ui.fixSel]) delete F.skipped[ui.fixSel]; else F.skipped[ui.fixSel] = true;
      fixtureChanged(); break;
    }
    case "fxsnapback": if(ui.fixSel) delete doc.fixture.moved[ui.fixSel]; fixtureChanged(); break;
    case "fxclearmoved": doc.fixture.moved = {}; fixtureChanged(); break;
    case "fxclearrot": doc.fixture.rot = {}; fixtureChanged(); break;
    case "asgcol": assignByColumn(); fixtureChanged(); break;
    case "asgrow": assignByRow(); fixtureChanged(); break;
    case "asgclear": doc.fixture.assign = {}; fixtureChanged(); break;
    case "fxflipodd": {
      const F = doc.fixture, rows = Math.max(1, Math.round(F.rows));
      for(let r=0;r<rows;r++) for(let c=0;c<Math.max(1,Math.round(F.cols));c++){
        const k = cellKey(r,c);
        if(r%2===1) F.rot[k] = 180; else delete F.rot[k];
      }
      fixtureChanged(); toast("Alternate rows flipped"); break;
    }
    case "fxflipall": {
      const F = doc.fixture;
      const allFlipped = fixtureCells().every(c=>c.rot===180);
      fixtureCells().forEach(c=>{
        const k = cellKey(c.r,c.c);
        if(allFlipped) delete F.rot[k]; else F.rot[k] = 180;
      });
      fixtureChanged(); break;
    }
    case "fxplace": {
      const x = parseFloat(($("fxAtX")||{}).value), y = parseFloat(($("fxAtY")||{}).value);
      if(!isFinite(x) || !isFinite(y)) return;
      placeArrayAt(x, y); fixtureChanged();
      toast("Array centred on " + r3(x) + ", " + r3(y) + " mm"); break;
    }
    case "fxclearskip": doc.fixture.skipped = {}; fixtureChanged(); break;
    case "reset": if(confirm("Discard this design and start from the default layout?")) resetDoc(); break;
    case "loadcsv": {
      const rows = ($("csvBox").value||"").split("\n").map(r=>r.split(/[,\t]/).map(s=>s.trim()))
                     .filter(r=>r.join("").length);
      if(!rows.length){ toast("Nothing to load"); return; }
      doc.roster = rows.map(r=>({first:r[0]||"", last:r[1]||"", dept:r[2]||""}));
      ui.previewIdx = 0; renderRail(); drawStage(); toast(rows.length+" locks loaded"); break;
    }
    case "machadd": {
      const keys = Object.keys(MACHINE_TEMPLATES);
      const pick = prompt("Start from a template:\n" + keys.map((k,i)=>(i+1)+") "+MACHINE_TEMPLATES[k].name).join("\n"), "1");
      const k = keys[(parseInt(pick)||1)-1] || "custom";
      const m = makeMachine(k);
      const nm = prompt("Name this machine", m.name); if(nm) m.name = nm.slice(0,40);
      doc.machines.push(m); doc.machineId = m.id;
      renderRail(); updateStatus(); saveLocal(); toast("Machine added"); break;
    }
    case "machdup": {
      const m = JSON.parse(JSON.stringify(activeMachine()));
      m.id = uid("m_"); m.name = m.name + " copy";
      doc.machines.push(m); doc.machineId = m.id; renderRail(); saveLocal(); break;
    }
    case "machdel": {
      if(doc.machines.length<2) return;
      const gone = activeMachine();
      if(!confirm("Delete "+gone.name+"? Materials tied to it become 'any machine'.")) return;
      doc.machines = doc.machines.filter(m=>m.id!==gone.id);
      doc.materials.forEach(mt=>{ if(mt.machineId===gone.id) mt.machineId = null; });
      doc.machineId = doc.machines[0].id;
      renderRail(); updateStatus(); saveLocal(); break;
    }
    case "uselens": {
      doc.fixture.field = activeMachine().lens/MM;
      doc.fixture.batch = 0; centerArray();
      drawStage(); renderRail(); updateStatus(); saveLocal();
      toast("Bed set to "+activeMachine().lens+" mm"); break;
    }
    case "matnew": {
      const nm = (prompt("Name the material")||"").trim(); if(!nm) return;
      const M = activeMachine();
      const mat = { id:uid("mat_"), name:nm, machineId:doc.machineId,
                    speed:Math.round((M.speedMax||4000)*0.25), power:50, freq:M.freqDefault,
                    interval:M.intervalDefault, passes:1, fill:"scan",
                    pulse:M.source==="mopa"?(M.pulseMin||10):0, proven:false, note:"" };
      doc.materials.push(mat); doc.laser.materialId = mat.id;
      doc.laser.trim = 0; doc.laser.manual = false;
      renderRail(); saveLocal(); break;
    }
    case "matcapture": {
      const p = laserEffective();
      const nm = (prompt("Name these settings", activeMaterial().name + " (tuned)")||"").trim();
      if(!nm) return;
      const mat = Object.assign({}, p, { id:uid("mat_"), name:nm, machineId:doc.machineId,
        fill:doc.laser.fill, proven:true, note:activeMaterial().note||"" });
      doc.materials.push(mat);
      doc.laser.materialId = mat.id; doc.laser.trim = 0; doc.laser.manual = false;
      renderRail(); saveLocal(); toast("Saved as a new material"); break;
    }
    case "matdel": {
      if(doc.materials.length<2){ toast("Keep at least one material"); return; }
      const gone = activeMaterial();
      if(!confirm("Delete "+gone.name+"?")) return;
      doc.materials = doc.materials.filter(m=>m.id!==gone.id);
      doc.laser.materialId = (machineMaterials()[0]||doc.materials[0]).id;
      doc.laser.trim = 0; doc.laser.manual = false;
      renderRail(); saveLocal(); break;
    }
    case "savetrim": {
      const p = laserEffective(), mat = activeMaterial();
      const i = doc.materials.findIndex(m=>m.id===mat.id);
      if(i<0) return;
      Object.assign(doc.materials[i], { speed:p.speed, power:p.power, freq:p.freq,
        interval:p.interval, passes:p.passes, pulse:p.pulse, fill:doc.laser.fill, proven:true });
      doc.laser.trim = 0; doc.laser.manual = false;
      renderRail(); saveLocal(); toast("Stored on "+mat.name); break;
    }
    case "lighter": doc.laser.manual=false; doc.laser.trim=clamp(doc.laser.trim-1,-5,5); renderRail(); break;
    case "darker":  doc.laser.manual=false; doc.laser.trim=clamp(doc.laser.trim+1,-5,5); renderRail(); break;
    case "resettrim": doc.laser.manual=false; doc.laser.trim=0; syncManualToMaterial(); renderRail(); break;
    case "testgrid": download("hl50e-test-grid.lbrn", testGrid(), "application/xml"); toast("Test grid saved"); break;
    case "exall": {
      const n = batchCount(), keep = doc.fixture.batch;
      await withBusy("Building "+n+" run files", ()=>{
        for(let b=0;b<n;b++){
          doc.fixture.batch = b;
          download(fileStem()+"-run"+(b+1)+".lbrn", exportLBRN(), "application/xml");
        }
      });
      doc.fixture.batch = keep; fixtureChanged();
      toast(n+" run files saved"); break;
    }
    case "exsvg": await withBusy("Building SVG", ()=>{
        download(fileStem()+".svg", exportSVG(), "image/svg+xml"); }); toast("SVG saved"); break;
    case "exlbrn": await withBusy("Building LightBurn file", ()=>{
        download(fileStem()+".lbrn", exportLBRN(), "application/xml"); }); toast("LightBurn file saved"); break;
    case "savejson": download(fileStem()+".json", JSON.stringify(doc), "application/json"); toast("Project saved"); break;
    case "loadjson": {
      const f = $("fileJson"); f.value="";
      f.onchange = ()=>{
        const file = f.files[0]; if(!file) return;
        const fr = new FileReader();
        fr.onload = ()=>{ try{
            const d = JSON.parse(fr.result);
            if(!d.faces) throw new Error("shape");
            doc = migrateDoc(d); ui.faceIdx=0; ui.sel=[]; ui.previewIdx=0;
            reflowAll(); buildAll(); fitView(); toast("Project opened");
          }catch(e){ toast("That file isn't a Markbench project"); } };
        fr.readAsText(file);
      };
      f.click(); break;
    }
  }
}
/* exports trace every text run, which takes a moment on a big sheet */
function withBusy(msg, fn){
  toast(msg + "…");
  return new Promise(res => requestAnimationFrame(()=> setTimeout(()=>{
    try{ fn(); } finally { res(); }
  }, 0)));
}
function fileStem(){
  const n = batchCount();
  return (doc.name||"markbench").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")
    + "-" + doc.roster.length + "up"
    + (n>1 ? "-run"+((doc.fixture.batch||0)+1) : "");
}

/* ------------------------------------------------------------- test grid --- */
function testGrid(){
  const base = laserEffective();
  const sp = [0.6,0.85,1.15,1.5].map(k=>Math.max(20,Math.round(base.speed*k/10)*10));
  const pw = [0.7,0.85,1.0,1.15].map(k=>clamp(Math.round(base.power*k),5,100));
  const cell=8, gap=2, lw=11, lh=6;
  const W = lw+4*(cell+gap), H = lh+4*(cell+gap);
  let s = `<?xml version="1.0" encoding="UTF-8"?>\n<LightBurnProject AppVersion="1.7.00" `
    + `DeviceName="Haas HL-50E" FormatVersion="1" MaterialHeight="0" MirrorX="False" MirrorY="False">\n`;
  let i=0;
  for(let r=0;r<4;r++) for(let c=0;c<4;c++)
    s += lbCut(i++, `${sp[c]} mm/s · ${pw[r]}%`,
      {speed:sp[c],power:pw[r],freq:base.freq,passes:base.passes,interval:base.interval}, false, true);
  const LBL = i;
  s += lbCut(LBL, "Labels", {speed:1000,power:Math.min(60,base.power),freq:base.freq,passes:1,interval:base.interval}, false, true);
  i=0;
  for(let r=0;r<4;r++) for(let c=0;c<4;c++){
    const x = lw+c*(cell+gap), y = lh+r*(cell+gap);
    s += `  <Shape Type="Rect" CutIndex="${i++}" W="${cell}" H="${cell}" Cr="0">\n`
       + `    <XForm>1 0 0 1 ${r3(x+cell/2)} ${r3(H-(y+cell/2))}</XForm>\n  </Shape>\n`;
  }
  for(let c=0;c<4;c++)
    s += `  <Shape Type="Text" CutIndex="${LBL}" Font="Arial" Str="${sp[c]}" H="2.5" LS="0" LnS="0" `
       + `Ah="1" Av="0" Bold="1" Italic="0" Weld="0" HasBackupPath="0">\n`
       + `    <XForm>1 0 0 1 ${r3(lw+c*(cell+gap)+cell/2)} ${r3(H-lh+1.6)}</XForm>\n  </Shape>\n`;
  for(let r=0;r<4;r++)
    s += `  <Shape Type="Text" CutIndex="${LBL}" Font="Arial" Str="${pw[r]}%" H="2.5" LS="0" LnS="0" `
       + `Ah="2" Av="0" Bold="1" Italic="0" Weld="0" HasBackupPath="0">\n`
       + `    <XForm>1 0 0 1 ${r3(lw-1.6)} ${r3(H-(lh+r*(cell+gap)+cell/2+1.2))}</XForm>\n  </Shape>\n`;
  return s + `</LightBurnProject>\n`;
}

/* --------------------------------------------------------------- left rail --- */
const PALETTE = [
  ["text","Text", `<path d="M4 6h16M12 6v13M8 19h8"/>`],
  ["image","Graphic", `<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.6"/><path d="M4 17l5-4 4 3 3-2 4 3"/>`],
  ["icon","Symbol", `<path d="M12 3L22 20H2z"/><path d="M12 10v4M12 17.2v.1"/>`],
  ["shape","Rule / bar", `<rect x="3" y="10" width="18" height="4" rx="1"/>`]
];
function buildPalette(){
  $("palette").innerHTML = PALETTE.map(([t,label,path])=>
    `<button class="btn" data-add="${t}"><svg viewBox="0 0 24 24">${path}</svg>${label}</button>`).join("");
  $("palette").querySelectorAll("[data-add]").forEach(b=>
    b.addEventListener("click", ()=>addElement(b.dataset.add)));
}
function addElement(type){
  const s = safeRect();
  const mk = {text:textEl, image:imageEl, icon:iconEl, shape:shapeEl}[type];
  const el = mk({ anchor:"mc", ox:0, oy:0 });
  if(type==="text"){ el.w = s.w*0.9; el.h = 0.18; el.text = "New text"; }
  if(type==="shape"){ el.w = s.w*0.9; el.h = 0.015; el.name = "Rule"; }
  if(type==="icon"){ el.w = Math.min(s.w*0.5, 0.5); el.h = el.w*0.88; }
  if(type==="image"){ el.w = Math.min(s.w*0.8, 0.9); el.h = el.w*0.4; }
  setBox(el, boxOf(el));
  face().els.push(el);
  ui.sel = [el.id];
  buildAll();
  ui.panel = "props"; renderRail(); syncNav();
  if(type==="image") action("pickimg");
}
function duplicateSel(){
  const add = [];
  selEls().forEach(e=>{
    const c = JSON.parse(JSON.stringify(e));
    c.id = uid("e_"); c.name = e.name+" copy"; c.ox += ui.grid*2; c.oy += ui.grid*2;
    setBox(c, boxOf(c)); add.push(c);
  });
  if(!add.length) return;
  face().els.push(...add);
  ui.sel = add.map(a=>a.id);
  buildAll();
}
function deleteSel(){
  if(!ui.sel.length) return;
  face().els = face().els.filter(e=>!ui.sel.includes(e.id));
  ui.sel = []; buildAll();
}
const LAYER_ICON = {
  text:`<path d="M4 6h16M12 6v13M8 19h8"/>`,
  image:`<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M4 17l5-4 4 3 3-2 4 3"/>`,
  icon:`<path d="M12 3L22 20H2z"/>`,
  shape:`<rect x="3" y="10" width="18" height="4" rx="1"/>`
};
function renderLayers(){
  const els = face().els;
  const refs = els.filter(e=>e.output===false).length;
  $("elCount").textContent = refs ? (els.length + " · " + refs + " ref") : els.length;
  $("layers").innerHTML = els.length ? els.slice().reverse().map(el=>`
    <div class="layer" data-id="${el.id}" aria-selected="${ui.sel.includes(el.id)}">
      <svg class="ic" viewBox="0 0 24 24">${LAYER_ICON[el.type]||""}</svg>
      <span class="nm">${esc(el.name)}</span>
      <button class="mini" data-vis="${el.id}" data-off="${el.visible?0:1}" title="Show / hide">${el.visible?"◉":"○"}</button>
      <button class="mini" data-out="${el.id}" data-off="${el.output===false?1:0}"
        title="${el.output===false?"Reference only — will not be marked":"Will be marked"}">${el.output===false?"⊘":"◆"}</button>
      <button class="mini" data-lk="${el.id}" data-off="${el.locked?0:1}" title="Lock">${el.locked?"▣":"▢"}</button>
      <button class="mini" data-up="${el.id}" title="Bring forward">▲</button>
      <button class="mini" data-dn="${el.id}" title="Send back">▼</button>
    </div>`).join("") : `<div class="empty">No elements on this face yet</div>`;
  $("layers").querySelectorAll(".layer").forEach(row=>{
    row.addEventListener("click", ev=>{
      if(ev.target.closest("button")) return;
      const id = row.dataset.id;
      ui.sel = ev.shiftKey ? (ui.sel.includes(id)?ui.sel.filter(x=>x!==id):[...ui.sel,id]) : [id];
      syncSelection(); drawStage();
    });
  });
  const els2 = face().els;
  $("layers").querySelectorAll("[data-vis]").forEach(b=>b.addEventListener("click",()=>{
    const el = els2.find(e=>e.id===b.dataset.vis); el.visible = !el.visible; buildAll(); }));
  $("layers").querySelectorAll("[data-out]").forEach(b=>b.addEventListener("click",()=>{
    const el = els2.find(e=>e.id===b.dataset.out);
    el.output = (el.output === false);
    setBox(el, boxOf(el));
    buildAll(); }));
  $("layers").querySelectorAll("[data-lk]").forEach(b=>b.addEventListener("click",()=>{
    const el = els2.find(e=>e.id===b.dataset.lk); el.locked = !el.locked; buildAll(); }));
  $("layers").querySelectorAll("[data-up]").forEach(b=>b.addEventListener("click",()=>move(b.dataset.up, 1)));
  $("layers").querySelectorAll("[data-dn]").forEach(b=>b.addEventListener("click",()=>move(b.dataset.dn,-1)));
}
function move(id, dir){
  const a = face().els, i = a.findIndex(e=>e.id===id), j = i+dir;
  if(i<0||j<0||j>=a.length) return;
  [a[i],a[j]] = [a[j],a[i]];
  buildAll();
}

/* alignment ------------------------------------------------------------- */
function doAlign(kind){
  const sel = selEls(); if(!sel.length) return;
  const s = safeRect();
  let ref = s;
  if(sel.length>1){
    const bs = sel.map(boxOf);
    ref = { x:Math.min(...bs.map(b=>b.x)), y:Math.min(...bs.map(b=>b.y)) };
    ref.w = Math.max(...bs.map(b=>b.x+b.w)) - ref.x;
    ref.h = Math.max(...bs.map(b=>b.y+b.h)) - ref.y;
  }
  if(kind==="stack"){
    const bs = sel.map(e=>({e, b:boxOf(e)})).sort((p,q)=>p.b.y-q.b.y);
    const totH = bs.reduce((a,x)=>a+x.b.h,0);
    const gap = bs.length>1 ? (s.h-totH)/(bs.length-1) : 0;
    let y = s.y;
    bs.forEach(({e,b})=>{ setBox(e,{x:b.x,y,w:b.w,h:b.h}); y += b.h + gap; });
  } else if(kind==="fitwidth"){
    sel.forEach(e=>{ const b=boxOf(e); setBox(e,{x:s.x,y:b.y,w:s.w,h:b.h}); });
  } else sel.forEach(e=>{
    const b = boxOf(e);
    if(kind==="left") b.x = ref.x;
    if(kind==="right") b.x = ref.x+ref.w-b.w;
    if(kind==="hcenter") b.x = ref.x+(ref.w-b.w)/2;
    if(kind==="top") b.y = ref.y;
    if(kind==="bottom") b.y = ref.y+ref.h-b.h;
    if(kind==="vcenter") b.y = ref.y+(ref.h-b.h)/2;
    setBox(e,b);
  });
  buildAll();
}

/* ------------------------------------------------------------------ roster --- */
function renderRoster(){
  const host = $("roster"); if(!host) return;
  host.innerHTML = doc.roster.map((r,i)=>`
    <div class="rrow" data-i="${i}">
      <button class="n" data-prev="${i}" title="Preview this lock"
        style="color:${i===ui.previewIdx?"var(--accent)":""}">${i+1}</button>
      <input class="f" type="text" placeholder="First" value="${esc(r.first)}" data-k="first">
      <input class="l" type="text" placeholder="Last" value="${esc(r.last)}" data-k="last">

  host.querySelectorAll(".rrow").forEach(row=>{
    const i = +row.dataset.i;
    row.querySelectorAll("input").forEach(inp=> inp.addEventListener("input", ()=>{
      doc.roster[i][inp.dataset.k] = inp.value;
      saveLocal();

  host.querySelectorAll("[data-prev]").forEach(b=>b.addEventListener("click",()=>{
    ui.previewIdx = +b.dataset.prev; renderRail(); drawStage(); }));

    if(doc.roster.length<=1) return;
    doc.roster.splice(+b.dataset.del,1);

    renderRail(); drawStage(); }));

/* --------------------------------------------------------------- statusbar --- */
function updateStatus(){
  const sh = sheetFaces(), issues = fitIssues(), off = fixtureOversize();
  const f = $("stFit");
  if(ui.stageMode==="fixture"){
    if(off.length){ f.className="bad"; f.textContent = off.length+" off the field"; }
    else { f.className="good"; f.textContent = "Array fits the field"; }
  } else if(issues.length){ f.className="warn"; f.textContent = issues.length+" outside safe area"; }
  else { f.className="good"; f.textContent = "Inside limits"; }
  $("stSheet").textContent = ui.stageMode==="fixture"
    ? `${sh.faces.length}/${sh.capacity} cells · run ${sh.batch+1} of ${sh.batches} · ${r3(sh.w*MM)}×${r3(sh.h*MM)} mm`
    : `${sh.faces.length} faces · ${r3(sh.w*MM)}×${r3(sh.h*MM)} mm · ${doc.roster.length} locks`;
  $("docName").textContent = doc.name + " · " + face().name + " · " + activeMachine().name;
}
